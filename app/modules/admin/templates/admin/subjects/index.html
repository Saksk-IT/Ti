{% extends "admin/admin_base.html" %}

{% block title %}题库管理{% endblock %}

{% block head %}
<style>
    .container {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        padding: 32px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
        border: 0.5px solid var(--border-color);
    }
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 0.5px solid var(--border-color);
    }
    .page-title {
        margin: 0 0 8px;
        color: var(--text-color);
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 0;
    }
    .page-subtitle {
        color: var(--text-sub);
        font-size: 14px;
        line-height: 1.6;
    }
    .header-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }
    .stats-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 22px;
    }
    .stat-card {
        padding: 18px;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.68);
        border: 0.5px solid var(--border-color);
        box-shadow: var(--shadow-soft);
    }
    .stat-card-label {
        color: var(--text-sub);
        font-size: 13px;
        margin-bottom: 8px;
    }
    .stat-card-value {
        color: var(--text-color);
        font-size: 30px;
        font-weight: 650;
    }
    .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }
    .toolbar-title {
        color: var(--text-color);
        font-size: 16px;
        font-weight: 600;
    }
    .toolbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .search-input,
    .form-control,
    .form-textarea {
        width: 100%;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: var(--card-bg-solid);
        color: var(--text-color);
        font-size: 14px;
        line-height: 1.5;
        box-sizing: border-box;
    }
    .search-input {
        width: 280px;
        padding: 9px 12px;
    }
    .form-control {
        padding: 9px 12px;
    }
    .form-textarea {
        min-height: 78px;
        resize: vertical;
        padding: 10px 12px;
    }
    .search-input:focus,
    .form-control:focus,
    .form-textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }
    .table-wrapper {
        border: 0.5px solid var(--border-color);
        border-radius: var(--radius-md);
        overflow-x: auto;
        background: rgba(255, 255, 255, 0.68);
        box-shadow: var(--shadow-soft);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 860px;
    }
    th,
    td {
        padding: 14px 16px;
        border-bottom: 0.5px solid var(--border-color);
        text-align: left;
        vertical-align: middle;
    }
    th {
        color: var(--text-color);
        background: rgba(142, 142, 147, 0.06);
        font-size: 13px;
        font-weight: 650;
    }
    tbody tr:hover {
        background: rgba(142, 142, 147, 0.07);
    }
    tbody tr:last-child td {
        border-bottom: none;
    }
    .bank-cell {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }
    .bank-cover {
        width: 54px;
        height: 54px;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: rgba(142, 142, 147, 0.12);
        border: 0.5px solid var(--border-color);
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-sub);
        font-size: 12px;
    }
    .bank-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .bank-name {
        color: var(--text-color);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 4px;
    }
    .bank-desc {
        color: var(--text-sub);
        font-size: 12px;
        max-width: 360px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .owner-main {
        color: var(--text-color);
        font-weight: 500;
        margin-bottom: 3px;
    }
    .owner-sub {
        color: var(--text-sub);
        font-size: 12px;
    }
    .status-badge,
    .count-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 0.5px solid var(--border-color);
        background: rgba(142, 142, 147, 0.1);
        color: var(--text-color);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
    }
    .status-public {
        color: var(--success);
        border-color: rgba(52, 199, 89, 0.24);
        background: rgba(52, 199, 89, 0.1);
    }
    .status-private {
        color: var(--text-sub);
    }
    .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn-quiet {
        min-height: 34px;
        padding: 7px 12px;
        border-radius: var(--radius-sm);
        border: 0.5px solid var(--border-color);
        background: rgba(142, 142, 147, 0.1);
        color: var(--text-color);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }
    .btn-quiet:hover {
        background: rgba(142, 142, 147, 0.16);
    }
    .btn-quiet.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
    }
    .btn-quiet.warning {
        color: var(--warning);
        border-color: rgba(255, 149, 0, 0.24);
        background: rgba(255, 149, 0, 0.1);
    }
    .loading-state,
    .empty-state {
        padding: 54px 20px;
        text-align: center;
        color: var(--text-sub);
    }
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.46);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 18px;
    }
    .modal-overlay.show {
        display: flex;
    }
    .modal-content {
        width: min(680px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        background: var(--card-bg);
        border: 0.5px solid var(--border-color);
        border-radius: var(--radius-lg);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.16);
        padding: 26px;
    }
    .modal-header {
        color: var(--text-color);
        font-size: 20px;
        font-weight: 650;
        margin-bottom: 18px;
    }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }
    .form-group {
        margin-bottom: 16px;
    }
    .form-group.full {
        grid-column: 1 / -1;
    }
    .form-group label {
        display: block;
        color: var(--text-color);
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .cover-tools {
        display: grid;
        grid-template-columns: 132px 1fr;
        gap: 14px;
        align-items: start;
    }
    .cover-preview {
        width: 132px;
        aspect-ratio: 16 / 10;
        border-radius: var(--radius-sm);
        border: 0.5px solid var(--border-color);
        background: rgba(142, 142, 147, 0.1);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-sub);
        font-size: 12px;
    }
    .cover-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .cover-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
    }
    .checkbox-row {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-color);
        font-size: 14px;
        user-select: none;
    }
    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 0.5px solid var(--border-color);
    }
    [data-theme="dark"] .container,
    [data-theme="dark"] .stat-card,
    [data-theme="dark"] .table-wrapper {
        background: rgba(28, 28, 30, 0.72) !important;
    }
    @media (max-width: 840px) {
        .container {
            padding: 20px;
        }
        .page-header,
        .toolbar {
            align-items: stretch;
            flex-direction: column;
        }
        .header-actions,
        .toolbar-right {
            justify-content: flex-start;
        }
        .stats-row,
        .form-grid {
            grid-template-columns: 1fr;
        }
        .search-input {
            width: 100%;
        }
        .cover-tools {
            grid-template-columns: 1fr;
        }
        .cover-preview {
            width: 100%;
            max-width: 240px;
        }
        .modal-footer {
            flex-direction: column-reverse;
        }
        .modal-footer button {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1 class="page-title">题库管理</h1>
            <div class="page-subtitle">统一管理所有用户创建的题库资料、公开状态、题目数目与封面信息。</div>
        </div>
        <div class="header-actions">
            <button class="btn-quiet primary" onclick="openBankModal()">创建题库</button>
            <a class="btn-quiet" href="/admin/legacy-subjects">旧公共科目管理</a>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-card-label">总题库数</div>
            <div class="stat-card-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label">公开题库数</div>
            <div class="stat-card-value" id="statPublic">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-card-label">总题目数</div>
            <div class="stat-card-value" id="statQuestions">0</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="toolbar-title">用户题库列表</div>
        <div class="toolbar-right">
            <input class="search-input" id="searchInput" type="text" placeholder="搜索题库、所有者、描述..." oninput="filterBanks()">
            <button class="btn-quiet" onclick="loadBanks()">刷新</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>题库名称</th>
                    <th style="width: 180px;">题库所有者</th>
                    <th style="width: 110px;">公开状态</th>
                    <th style="width: 110px;">题目数目</th>
                    <th style="width: 250px;">操作</th>
                </tr>
            </thead>
            <tbody id="bankTableBody">
                <tr>
                    <td colspan="5" class="loading-state">加载中...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="bankModal" onclick="if(event.target===this) closeBankModal()">
    <div class="modal-content">
        <div class="modal-header" id="bankModalTitle">创建题库</div>
        <div class="form-grid">
            <div class="form-group full">
                <label for="bankName">题库名称 *</label>
                <input class="form-control" id="bankName" type="text" maxlength="50" placeholder="请输入题库名称">
            </div>
            <div class="form-group full">
                <label for="bankDescription">题库描述</label>
                <textarea class="form-textarea" id="bankDescription" maxlength="200" placeholder="描述题库用途、范围或来源"></textarea>
            </div>
            <div class="form-group full">
                <label for="bankPublicDescription">题库简介</label>
                <textarea class="form-textarea" id="bankPublicDescription" maxlength="200" placeholder="公开展示在题库广场的简介"></textarea>
            </div>
            <div class="form-group full">
                <label>题库封面</label>
                <div class="cover-tools">
                    <div class="cover-preview" id="coverPreview">暂无封面</div>
                    <div>
                        <input class="form-control" id="bankCoverImage" type="text" maxlength="500" placeholder="/uploads/bank_covers/xxx.png" oninput="updateCoverPreview()">
                        <div class="cover-actions">
                            <input id="coverFile" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
                            <button class="btn-quiet" type="button" onclick="chooseCover()">选择图片</button>
                            <button class="btn-quiet" type="button" onclick="uploadCover()" id="uploadCoverBtn">上传封面</button>
                            <button class="btn-quiet" type="button" onclick="clearCover()">清空封面</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group full">
                <label class="checkbox-row">
                    <input id="bankIsPublic" type="checkbox">
                    <span>公开状态</span>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-quiet" onclick="closeBankModal()">取消</button>
            <button class="btn-quiet primary" onclick="saveBank()">保存</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allBanks = [];
    let editingBankId = null;

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
    }

    function apiData(payload) {
        return payload && payload.data ? payload.data : {};
    }

    async function apiFetch(url, options = {}) {
        const method = String(options.method || 'GET').toUpperCase();
        const headers = Object.assign({}, options.headers || {});
        if (method !== 'GET' && method !== 'HEAD') {
            headers['X-Requested-With'] = 'XMLHttpRequest';
        }
        if (options.body && !(options.body instanceof FormData) && !headers['Content-Type']) {
            headers['Content-Type'] = 'application/json';
        }
        const res = await fetch(url, Object.assign({}, options, { headers }));
        const payload = await res.json().catch(() => ({}));
        if (!res.ok || (payload.status && payload.status !== 'success')) {
            throw new Error(payload.message || '请求失败');
        }
        return payload;
    }

    async function loadBanks() {
        const tbody = document.getElementById('bankTableBody');
        tbody.innerHTML = '<tr><td colspan="5" class="loading-state">加载中...</td></tr>';
        try {
            const payload = await apiFetch('/admin/api/user-banks');
            const data = apiData(payload);
            allBanks = Array.isArray(data.banks) ? data.banks : [];
            updateStats(data);
            renderBanks();
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty-state">${escapeHtml(e.message)}</td></tr>`;
        }
    }

    function updateStats(data) {
        const banks = Array.isArray(allBanks) ? allBanks : [];
        const total = Number(data && data.total != null ? data.total : banks.length);
        const publicCount = Number(data && data.public_count != null ? data.public_count : banks.filter(b => b.is_public).length);
        const questionCount = Number(data && data.total_questions != null ? data.total_questions : banks.reduce((sum, b) => sum + Number(b.question_count || 0), 0));
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statPublic').textContent = publicCount;
        document.getElementById('statQuestions').textContent = questionCount;
    }

    function currentFilteredBanks() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!keyword) return allBanks;
        return allBanks.filter(bank => {
            const owner = bank.owner || {};
            return [
                bank.name,
                bank.description,
                bank.public_description,
                owner.username,
                owner.email
            ].some(value => String(value || '').toLowerCase().includes(keyword));
        });
    }

    function filterBanks() {
        renderBanks(currentFilteredBanks());
    }

    function renderBanks(items = null) {
        const banks = items || allBanks;
        const tbody = document.getElementById('bankTableBody');
        if (!banks.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无题库数据</td></tr>';
            return;
        }
        tbody.innerHTML = '';
        banks.forEach(bank => {
            const owner = bank.owner || {};
            const tr = document.createElement('tr');
            const cover = bank.cover_image
                ? `<img src="${escapeHtml(bank.cover_image)}" alt="题库封面" loading="lazy">`
                : '封面';
            const desc = bank.public_description || bank.description || '暂无简介';
            const statusClass = bank.is_public ? 'status-public' : 'status-private';
            const statusText = bank.is_public ? '公开' : '私密';
            const toggleText = bank.is_public ? '设为私密' : '设为公开';
            tr.innerHTML = `
                <td>
                    <div class="bank-cell">
                        <div class="bank-cover">${cover}</div>
                        <div>
                            <div class="bank-name">${escapeHtml(bank.name)}</div>
                            <div class="bank-desc">${escapeHtml(desc)}</div>
                        </div>
                    </div>
                </td>
                <td>
                    <div class="owner-main">${escapeHtml(owner.username || '未知用户')}</div>
                    <div class="owner-sub">ID ${escapeHtml(owner.id || '')}</div>
                </td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td><span class="count-badge">${Number(bank.question_count || 0)} 题</span></td>
                <td>
                    <div class="actions">
                        <button class="btn-quiet" onclick="openBankModal(${bank.id})">编辑</button>
                        <button class="btn-quiet warning" onclick="togglePublic(${bank.id})">${toggleText}</button>
                        <a class="btn-quiet" href="/user/banks/${bank.id}/questions">进入题目管理</a>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function openBankModal(bankId = null) {
        const bank = bankId ? allBanks.find(item => item.id === bankId) : null;
        editingBankId = bank ? bank.id : null;
        document.getElementById('bankModalTitle').textContent = bank ? '编辑题库' : '创建题库';
        document.getElementById('bankName').value = bank ? bank.name || '' : '';
        document.getElementById('bankDescription').value = bank ? bank.description || '' : '';
        document.getElementById('bankPublicDescription').value = bank ? bank.public_description || '' : '';
        document.getElementById('bankCoverImage').value = bank ? bank.cover_image || '' : '';
        document.getElementById('bankIsPublic').checked = bank ? !!bank.is_public : false;
        document.getElementById('coverFile').value = '';
        updateCoverPreview();
        document.getElementById('bankModal').classList.add('show');
        document.body.style.overflow = 'hidden';
        setTimeout(() => document.getElementById('bankName').focus(), 50);
    }

    function closeBankModal() {
        document.getElementById('bankModal').classList.remove('show');
        document.body.style.overflow = '';
        editingBankId = null;
    }

    function readForm() {
        return {
            name: document.getElementById('bankName').value.trim(),
            description: document.getElementById('bankDescription').value.trim(),
            public_description: document.getElementById('bankPublicDescription').value.trim(),
            cover_image: document.getElementById('bankCoverImage').value.trim(),
            is_public: document.getElementById('bankIsPublic').checked
        };
    }

    async function saveBank() {
        const data = readForm();
        if (!data.name || data.name.length < 2 || data.name.length > 50) {
            showError('题库名称需要2-50个字符');
            return;
        }
        if (data.description.length > 200 || data.public_description.length > 200) {
            showError('题库描述和题库简介不能超过200个字符');
            return;
        }
        try {
            const url = editingBankId ? `/admin/api/user-banks/${editingBankId}` : '/admin/api/user-banks';
            const method = editingBankId ? 'PUT' : 'POST';
            const payload = await apiFetch(url, { method, body: JSON.stringify(data) });
            const bank = apiData(payload).bank;
            if (bank && bank.id) {
                const exists = allBanks.some(item => item.id === bank.id);
                allBanks = exists
                    ? allBanks.map(item => item.id === bank.id ? bank : item)
                    : [bank, ...allBanks];
                updateStats({});
                renderBanks(currentFilteredBanks());
            } else {
                await loadBanks();
            }
            closeBankModal();
            showSuccess(payload.message || '保存成功');
        } catch (e) {
            showError(e.message);
        }
    }

    async function togglePublic(bankId) {
        const bank = allBanks.find(item => item.id === bankId);
        if (!bank) return;
        const nextPublic = !bank.is_public;
        const message = nextPublic
            ? `确定要公开题库“${bank.name}”吗？`
            : `确定要将题库“${bank.name}”设为私密吗？`;
        if (!(await appConfirm(message))) return;
        try {
            const payload = await apiFetch(`/admin/api/user-banks/${bankId}/public`, {
                method: 'POST',
                body: JSON.stringify({
                    is_public: nextPublic,
                    public_description: bank.public_description || ''
                })
            });
            const updated = apiData(payload).bank;
            allBanks = allBanks.map(item => item.id === bankId ? updated : item);
            updateStats({});
            renderBanks(currentFilteredBanks());
            showSuccess(payload.message || '状态已更新');
        } catch (e) {
            showError(e.message);
        }
    }

    function chooseCover() {
        document.getElementById('coverFile').click();
    }

    async function uploadCover() {
        if (!editingBankId) {
            showError('请先保存题库后再上传封面');
            return;
        }
        const fileInput = document.getElementById('coverFile');
        if (!fileInput.files || !fileInput.files[0]) {
            showError('请先选择封面图片');
            return;
        }
        const button = document.getElementById('uploadCoverBtn');
        const oldText = button.textContent;
        button.disabled = true;
        button.textContent = '上传中...';
        try {
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            const payload = await apiFetch(`/admin/api/user-banks/${editingBankId}/cover/upload`, {
                method: 'POST',
                body: formData
            });
            document.getElementById('bankCoverImage').value = (apiData(payload).url || '');
            updateCoverPreview();
            showSuccess(payload.message || '上传成功');
        } catch (e) {
            showError(e.message);
        } finally {
            button.disabled = false;
            button.textContent = oldText;
        }
    }

    function clearCover() {
        document.getElementById('bankCoverImage').value = '';
        document.getElementById('coverFile').value = '';
        updateCoverPreview();
    }

    function updateCoverPreview() {
        const url = document.getElementById('bankCoverImage').value.trim();
        const preview = document.getElementById('coverPreview');
        preview.innerHTML = url
            ? `<img src="${escapeHtml(url)}" alt="题库封面预览">`
            : '暂无封面';
    }

    function showSuccess(message) {
        appAlert('✅ ' + message);
    }

    function showError(message) {
        appAlert('❌ ' + message);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadBanks();
        document.getElementById('coverFile').addEventListener('change', () => {
            const file = document.getElementById('coverFile').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('coverPreview').innerHTML = `<img src="${escapeHtml(e.target.result)}" alt="题库封面预览">`;
            };
            reader.readAsDataURL(file);
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeBankModal();
        });
    });
</script>
{% endblock %}
