{% extends "admin/admin_base.html" %}

{% block title %}旧公共科目管理{% endblock %}

{% block head %}
<style>
    .container {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        padding: 32px;
        border-radius: var(--radius-lg);
        border: 0.5px solid var(--border-color);
        box-shadow: var(--shadow-soft);
    }
    .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
        padding-bottom: 16px;
        border-bottom: 0.5px solid var(--border-color);
    }
    .page-title {
        margin: 0 0 8px;
        color: var(--text-color);
        font-size: 26px;
        font-weight: 650;
        letter-spacing: 0;
    }
    .page-subtitle {
        color: var(--text-sub);
        font-size: 14px;
        line-height: 1.6;
    }
    .panel {
        background: rgba(255, 255, 255, 0.68);
        border: 0.5px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 16px;
        margin-bottom: 16px;
    }
    .panel-title {
        color: var(--text-color);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 12px;
    }
    .inline-form {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }
    .form-control {
        min-height: 38px;
        padding: 8px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: var(--card-bg-solid);
        color: var(--text-color);
        font-size: 14px;
        box-sizing: border-box;
    }
    .form-control.name {
        flex: 1 1 260px;
    }
    .btn-quiet {
        min-height: 36px;
        padding: 7px 12px;
        border: 0.5px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: rgba(142, 142, 147, 0.1);
        color: var(--text-color);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }
    .btn-quiet.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
    }
    .table-wrapper {
        overflow-x: auto;
        border: 0.5px solid var(--border-color);
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.68);
    }
    table {
        width: 100%;
        min-width: 680px;
        border-collapse: collapse;
    }
    th,
    td {
        padding: 13px 14px;
        border-bottom: 0.5px solid var(--border-color);
        text-align: left;
    }
    th {
        color: var(--text-color);
        background: rgba(142, 142, 147, 0.06);
        font-size: 13px;
    }
    tbody tr:last-child td {
        border-bottom: none;
    }
    .status {
        display: inline-flex;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        border: 0.5px solid var(--border-color);
        font-size: 13px;
        color: var(--text-color);
        background: rgba(142, 142, 147, 0.1);
    }
    .status.locked {
        color: var(--danger);
        background: rgba(255, 59, 48, 0.1);
        border-color: rgba(255, 59, 48, 0.22);
    }
    .empty-state {
        text-align: center;
        color: var(--text-sub);
        padding: 42px 16px;
    }
    #importResult {
        width: 100%;
        color: var(--text-sub);
        font-size: 13px;
        line-height: 1.6;
        margin-top: 10px;
    }
    [data-theme="dark"] .container,
    [data-theme="dark"] .panel,
    [data-theme="dark"] .table-wrapper {
        background: rgba(28, 28, 30, 0.72) !important;
    }
    @media (max-width: 760px) {
        .container {
            padding: 20px;
        }
        .page-header {
            flex-direction: column;
        }
        .inline-form {
            align-items: stretch;
            flex-direction: column;
        }
        .form-control.name,
        .btn-quiet {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <div>
            <h1 class="page-title">旧公共科目管理</h1>
            <div class="page-subtitle">保留原公共 subjects 表的创建、导入和题集管理入口，供历史公共题库继续维护。</div>
        </div>
        <a class="btn-quiet" href="/admin/subjects">返回题库管理</a>
    </div>

    <div class="panel">
        <div class="panel-title">添加公共科目</div>
        <div class="inline-form">
            <input class="form-control name" id="subjectName" type="text" placeholder="请输入公共科目名称" onkeydown="if(event.key==='Enter') addSubject()">
            <button class="btn-quiet primary" onclick="addSubject()">立即添加</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">批量导入题库</div>
        <div class="inline-form">
            <input class="form-control name" type="file" id="importFile" accept=".xlsx">
            <button class="btn-quiet primary" onclick="importFromExcel()" id="importBtn">开始导入</button>
            <a class="btn-quiet" href="/admin/download_template">下载Excel模板文件</a>
        </div>
        <div id="importResult" style="display:none;"></div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width:80px;">序号</th>
                    <th>公共科目名称</th>
                    <th style="width:120px;">题目数量</th>
                    <th style="width:110px;">状态</th>
                    <th style="width:180px;">操作</th>
                </tr>
            </thead>
            <tbody id="subjectTableBody">
                <tr><td colspan="5" class="empty-state">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let subjects = [];

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
    }

    async function apiFetch(url, options = {}) {
        const method = String(options.method || 'GET').toUpperCase();
        const headers = Object.assign({}, options.headers || {});
        if (method !== 'GET' && method !== 'HEAD') {
            headers['X-Requested-With'] = 'XMLHttpRequest';
        }
        if (options.body && !(options.body instanceof FormData) && !headers['Content-Type']) {
            headers['Content-Type'] = 'application/json';
        }
        const res = await fetch(url, Object.assign({}, options, { headers }));
        const payload = await res.json().catch(() => ({}));
        if (!res.ok || (payload.status && payload.status !== 'success')) {
            throw new Error(payload.message || '请求失败');
        }
        return payload;
    }

    function isLocked(subject) {
        return subject.is_locked === true || subject.is_locked === 1 || subject.is_locked === '1';
    }

    async function loadSubjects() {
        try {
            subjects = await apiFetch('/admin/api/subjects');
            renderSubjects();
        } catch (e) {
            document.getElementById('subjectTableBody').innerHTML = `<tr><td colspan="5" class="empty-state">${escapeHtml(e.message)}</td></tr>`;
        }
    }

    function renderSubjects() {
        const tbody = document.getElementById('subjectTableBody');
        if (!subjects.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无公共科目</td></tr>';
            return;
        }
        tbody.innerHTML = '';
        subjects.forEach((subject, index) => {
            const locked = isLocked(subject);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${escapeHtml(subject.name)}</td>
                <td>${Number(subject.question_count || 0)} 题</td>
                <td><span class="status ${locked ? 'locked' : ''}">${locked ? '已锁定' : '正常'}</span></td>
                <td>
                    <a class="btn-quiet" href="/admin/subjects/${subject.id}/questions">题集管理</a>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function addSubject() {
        const input = document.getElementById('subjectName');
        const name = input.value.trim();
        if (!name) {
            appAlert('❌ 请输入公共科目名称');
            return;
        }
        try {
            const payload = await apiFetch('/admin/api/subjects', {
                method: 'POST',
                body: JSON.stringify({ name })
            });
            input.value = '';
            appAlert('✅ ' + (payload.message || '公共科目添加成功'));
            loadSubjects();
        } catch (e) {
            appAlert('❌ ' + e.message);
        }
    }

    async function importFromExcel() {
        const input = document.getElementById('importFile');
        const button = document.getElementById('importBtn');
        const result = document.getElementById('importResult');
        if (!input.files || !input.files[0]) {
            appAlert('❌ 请先选择 .xlsx 文件');
            return;
        }
        const formData = new FormData();
        formData.append('file', input.files[0]);
        button.disabled = true;
        button.textContent = '导入中...';
        result.style.display = 'none';
        try {
            const payload = await apiFetch('/admin/api/questions/import/excel', {
                method: 'POST',
                body: formData
            });
            result.style.display = 'block';
            result.textContent = payload.message || '导入完成';
            input.value = '';
            loadSubjects();
        } catch (e) {
            result.style.display = 'block';
            result.textContent = '导入失败：' + e.message;
        } finally {
            button.disabled = false;
            button.textContent = '开始导入';
        }
    }

    document.addEventListener('DOMContentLoaded', loadSubjects);
</script>
{% endblock %}
