{% block scripts %}
<script>
    const subjectId = {{ subject_id|int }};
    let allQuestions = [];
    const visibleCols = new Set(['id', 'q_type', 'content', 'actions']);

    document.addEventListener('DOMContentLoaded', () => {
        initColMenu();
        loadQuestionTypes();
        loadQuestions();
        document.getElementById('selectAll').addEventListener('change', (e) => {
            document.querySelectorAll('.questionSelect').forEach(cb => cb.checked = e.target.checked);
        });
        
        // 点击外部区域关闭下拉菜单
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown-menu').forEach(m => {
                    m.classList.remove('open');
                    m.style.display = 'none';
                });
            }
        });
    });

    function toggleDropdown(id) {
        const menu = document.getElementById(id);
        const isOpen = menu.classList.contains('open') || menu.style.display === 'block' || menu.style.display === 'flex';
        // 先关闭其它菜单
        document.querySelectorAll('.dropdown-menu').forEach(m => { m.classList.remove('open'); m.style.display = 'none'; });
        if (!isOpen) {
            menu.classList.add('open');
            if (id === 'batch-menu') {
                // 强制一行显示
                menu.style.display = 'flex';
                menu.style.flexWrap = 'nowrap';
                menu.style.alignItems = 'center';
                menu.style.whiteSpace = 'nowrap';
                menu.style.gap = '8px';
            } else {
                menu.style.display = 'block';
            }
        }
    }

    function initColMenu() {
        const menu = document.getElementById('col-menu');
        const headers = document.querySelectorAll('th[data-col]');
        headers.forEach(h => {
            const col = h.dataset.col;
            if (col === 'actions') return;
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = visibleCols.has(col);
            checkbox.onchange = () => toggleColumn(col);
            label.appendChild(checkbox);
            label.append(` ${h.textContent}`);
            menu.appendChild(label);
        });
    }

    function toggleColumn(col) {
        if (visibleCols.has(col)) visibleCols.delete(col); else visibleCols.add(col);
        renderTable();
    }

    async function loadQuestionTypes() {
        const res = await fetch('/admin/api/types');
        const types = await res.json();
        const typeFilter = document.getElementById('typeFilter');
        const qTypeSelect = document.getElementById('qType');
        types.forEach(t => {
            typeFilter.add(new Option(t, t));
            qTypeSelect.add(new Option(t, t));
        });
    }

    async function loadQuestions() {
        const type = document.getElementById('typeFilter').value;
        try {
            const res = await fetch(`/admin/api/questions?subject_id=${subjectId}&type=${type}`);
            allQuestions = await res.json();
            updateStats();
            renderTable();
        } catch (error) {
            console.error('加载题目失败:', error);
            showError('加载题目失败，请刷新页面重试');
        }
    }

    function updateStats() {
        const total = allQuestions.length;
        const choice = allQuestions.filter(q => q.q_type === '选择题').length;
        const blank = allQuestions.filter(q => q.q_type === '填空题').length;
        const judge = allQuestions.filter(q => q.q_type === '判断题').length;
        
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statChoice').textContent = choice;
        document.getElementById('statBlank').textContent = blank;
        document.getElementById('statJudge').textContent = judge;
    }

    function getTypeBadgeClass(type) {
        if (type === '选择题') return 'choice';
        if (type === '多选题') return 'choice'; // 多选题使用选择题的样式
        if (type === '填空题') return 'blank';
        if (type === '判断题') return 'judge';
        return 'other';
    }

    function renderDifficulty(level) {
        const stars = '★'.repeat(level) + '☆'.repeat(5 - level);
        return `<span class="difficulty-stars" title="难度: ${level}/5">${stars}</span>`;
    }

    function renderTags(tagsInput) {
        let tags = [];
        if (!tagsInput) {
            tags = [];
        } else if (Array.isArray(tagsInput)) {
            tags = tagsInput.map(t => String(t || '').trim()).filter(Boolean);
        } else if (typeof tagsInput === 'string') {
            const s = tagsInput.trim();
            if (s.startsWith('[') && s.endsWith(']')) {
                try {
                    const parsed = JSON.parse(s);
                    if (Array.isArray(parsed)) {
                        tags = parsed.map(t => String(t || '').trim()).filter(Boolean);
                    }
                } catch (e) {}
            }
            if (!tags.length && s) {
                tags = s.split(',').map(t => t.trim()).filter(Boolean);
            }
        } else {
            try {
                tags = String(tagsInput).split(',').map(t => t.trim()).filter(Boolean);
            } catch (e) {
                tags = [];
            }
        }
        if (!tags.length) return '';
        return `<div class="tag-list">${tags.map(t => `<span class="tag-item">${escapeHtml(t)}</span>`).join('')}</div>`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderTable() {
        const tbody = document.getElementById('questionTableBody');
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        tbody.innerHTML = '';
        
        document.querySelectorAll('th[data-col]').forEach(th => {
            th.style.display = visibleCols.has(th.dataset.col) || th.dataset.col === 'actions' ? '' : 'none';
        });
        
        const filtered = allQuestions.filter(q => q.content.toLowerCase().includes(keyword));
        
        if (filtered.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="empty-state">
                        <div class="empty-state-text">暂无题目数据</div>
                        <div class="empty-state-hint">点击"新增题目"按钮添加第一道题目</div>
                    </td>
                </tr>
            `;
            return;
        }
        
        filtered.forEach((q, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="questionSelect" data-id="${q.id}"></td>
                <td style="display: ${visibleCols.has('id') ? '' : 'none'}; text-align: center;">${index + 1}</td>
                <td style="display: ${visibleCols.has('q_type') ? '' : 'none'}">
                    <span class="type-badge ${getTypeBadgeClass(q.q_type)}">${q.q_type}</span>
                </td>
                <td class="col-content" style="display: ${visibleCols.has('content') ? '' : 'none'}"><div class="content-text">${escapeHtml(q.content)}</div></td>
                <td style="display: ${visibleCols.has('difficulty') ? '' : 'none'}">${renderDifficulty(q.difficulty || 1)}</td>
                <td style="display: ${visibleCols.has('tags') ? '' : 'none'}">${renderTags(q.tags)}</td>
                <td style="display: ${visibleCols.has('created_by') ? '' : 'none'}; font-size: 13px;">${escapeHtml(q.created_by || '-')}</td>
                <td style="display: ${visibleCols.has('updated_at') ? '' : 'none'}; font-size: 12px; color: #6c757d;">
                    ${q.updated_at ? new Date(q.updated_at).toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    }) : '-'}
                </td>
                <td>
                    <div class="action-btns">
                        <button class="btn-sm btn-edit" onclick="openDrawer(${q.id})" title="编辑题目">编辑</button>
                        <button class="btn-sm btn-delete" onclick="deleteQuestion(${q.id})" title="删除题目">删除</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function showError(message) {
        appAlert('❌ ' + message);
    }

    function showSuccess(message) {
        appAlert('✅ ' + message);
    }

    function searchQuestions() { renderTable(); }

    function rebuildAnswerInput(defaultValue = '') {
        const qType = document.getElementById('qType').value;
        const container = document.getElementById('answer-container');
        container.innerHTML = ''; // Clear previous input

        let inputElement;

        if (qType === '判断题') {
            inputElement = document.createElement('select');
            inputElement.id = 'qAnswer';
            
            const optionTrue = new Option('正确', '正确');
            const optionFalse = new Option('错误', '错误');
            
            inputElement.add(optionTrue);
            inputElement.add(optionFalse);
            
            if (defaultValue) {
                inputElement.value = defaultValue;
            }

        } else if (['计算题', '简答题'].includes(qType)) {
            inputElement = document.createElement('textarea');
            inputElement.id = 'qAnswer';
            inputElement.rows = 4;
            inputElement.placeholder = '请输入详细答案';
            inputElement.value = defaultValue;

        } else { // For '选择题', '多选题', '填空题' etc.
            inputElement = document.createElement('input');
            inputElement.type = 'text';
            inputElement.id = 'qAnswer';
            if (qType === '选择题') {
                 inputElement.placeholder = '例如: A (单选题只需一个答案)';
            } else if (qType === '多选题') {
                 inputElement.placeholder = '例如: AB 或 ABC (多选题至少需要两个答案，用字母连续输入，无需逗号)';
                 // 添加提示文本
                 const hint = document.createElement('div');
                 hint.style.fontSize = '12px';
                 hint.style.color = '#6c757d';
                 hint.style.marginTop = '6px';
                 hint.textContent = '提示：多选题答案至少需要两个选项，例如 AB、ABC 等。答案会自动验证是否在选项范围内。';
                 container.appendChild(inputElement);
                 container.appendChild(hint);
                 return; // 提前返回，因为已经添加了元素
            } else if (qType === '填空题') {
                // 填空题：结构化多空/多答案编辑器（保存时会自动生成 answer 字符串）
                container.innerHTML = `
                  <div id="blank-editor" style="border:1px solid #e9ecef; background:#fbfbfd; border-radius:12px; padding:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px;">
                      <div>
                        <div style="font-weight:700;">结构化答案（推荐）</div>
                        <div style="font-size:12px; color:#6c757d; margin-top:2px;">规则：不同空用 <b>;;</b> 分隔保存；同一空多答案用 <b>;</b> 分隔保存。</div>
                      </div>
                      <div style="display:flex; gap:8px; align-items:center;">
                        <button type="button" class="btn-sm" style="padding:6px 10px; border:1px solid #dee2e6; background:#fff; border-radius:8px; cursor:pointer;" onclick="blankEditorAddBlank()">+ 增加一空</button>
                        <button type="button" class="btn-sm" style="padding:6px 10px; border:1px solid #dee2e6; background:#fff; border-radius:8px; cursor:pointer;" onclick="blankEditorToggleRaw(true)">手写模式</button>
                      </div>
                    </div>

                    <div id="blank-groups" style="display:flex; flex-direction:column; gap:10px;"></div>

                    <div id="blank-raw" style="display:none; margin-top:10px;">
                      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
                        <div style="font-weight:600;">手写答案</div>
                        <button type="button" class="btn-sm" style="padding:6px 10px; border:1px solid #dee2e6; background:#fff; border-radius:8px; cursor:pointer;" onclick="blankEditorToggleRaw(false)">返回结构化</button>
                      </div>
                      <input id="blank-raw-input" type="text" style="width:100%; padding:10px 14px; border:1px solid #ced4da; border-radius:8px; font-size:14px;" placeholder="例如：北京;北平;;上海;沪" />
                      <div style="font-size:12px; color:#6c757d; margin-top:6px;">提示：你仍可直接手写；切回结构化会尝试自动解析。</div>
                    </div>

                    <!-- 最终提交给后端的 answer 字段 -->
                    <input type="hidden" id="qAnswer" value="" />
                  </div>
                `;

                // 初始化：基于题干 __ 数量 + 默认答案 defaultValue
                blankEditorInitFromContentAndAnswer(document.getElementById('qContent')?.value || '', defaultValue);

                return;
            }
            else {
                inputElement.placeholder = '请输入答案';
            }
            inputElement.value = defaultValue;
        }
        
        // Common properties for all inputs
        inputElement.style.width = '100%';
        inputElement.style.padding = '10px 14px';
        inputElement.style.border = '1px solid #ced4da';
        inputElement.style.borderRadius = '8px';
        inputElement.style.fontSize = '14px';

        container.appendChild(inputElement);
    }

    function handleQuestionTypeChange() {
        rebuildAnswerInput(); // Rebuild based on new type
        const optionsGroup = document.getElementById('optionsGroup');
        const qType = document.getElementById('qType').value;
        if (qType === '选择题' || qType === '多选题') {
            optionsGroup.style.display = 'block';
            // 如果没有选项，自动添加4个空选项
            if (document.querySelectorAll('.option-item').length === 0) {
                for (let i = 0; i < 4; i++) {
                    addOption();
                }
            }
        } else {
            optionsGroup.style.display = 'none';
        }
    }
    
    // 添加选项
    function addOption() {
        const container = document.getElementById('optionsContainer');
        const optionIndex = container.querySelectorAll('.option-item').length;
        const optionKey = String.fromCharCode(65 + optionIndex); // A, B, C, D...
        
        const optionItem = document.createElement('div');
        optionItem.className = 'option-item';
        optionItem.style.cssText = 'display: flex; align-items: flex-start; gap: 12px; padding: 12px; background: rgba(142, 142, 147, 0.06); border-radius: 8px; border: 1px solid rgba(0,0,0,0.1);';
        
        const label = document.createElement('div');
        label.style.cssText = 'flex: 0 0 auto; width: 32px; padding-top: 8px; font-weight: 600; color: #333;';
        label.textContent = optionKey + '.';
        
        const textarea = document.createElement('textarea');
        textarea.className = 'option-textarea';
        textarea.style.cssText = 'flex: 1; min-height: 60px; padding: 8px 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; font-size: 14px; line-height: 1.5; resize: vertical; font-family: inherit;';
        textarea.rows = 2;
        textarea.placeholder = '输入选项内容（支持多行）';
        textarea.oninput = updatePreview;
        
        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'btn-delete-option';
        deleteBtn.style.cssText = 'flex: 0 0 auto; padding: 8px 12px; background: rgba(255, 59, 48, 0.1); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.2); border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap;';
        deleteBtn.textContent = '删除';
        deleteBtn.onclick = function() {
            optionItem.remove();
            updateOptionLabels();
            updatePreview();
        };
        
        optionItem.appendChild(label);
        optionItem.appendChild(textarea);
        optionItem.appendChild(deleteBtn);
        container.appendChild(optionItem);
        
        updatePreview();
        textarea.focus();
    }
    
    // 更新选项标签（A, B, C, D...）
    function updateOptionLabels() {
        const items = document.querySelectorAll('.option-item');
        items.forEach((item, index) => {
            const label = item.querySelector('div');
            const optionKey = String.fromCharCode(65 + index);
            label.textContent = optionKey + '.';
        });
    }
    
    // 获取所有选项内容（保留换行符）
    function getOptions() {
        const items = document.querySelectorAll('.option-item');
        return Array.from(items).map(item => {
            const textarea = item.querySelector('.option-textarea');
            if (!textarea) return '';
            // 保留换行符，只去掉首尾空白（不包含换行符）
            const value = textarea.value;
            // 去掉首尾的空白字符（空格、制表符），但保留换行符
            return value.replace(/^[\s\t]+|[\s\t]+$/g, '');
        }).filter(Boolean);
    }
    
    // 设置选项内容
    function setOptions(options) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        
        if (options && options.length > 0) {
            options.forEach((opt, index) => {
                const optionItem = document.createElement('div');
                optionItem.className = 'option-item';
                optionItem.style.cssText = 'display: flex; align-items: flex-start; gap: 12px; padding: 12px; background: rgba(142, 142, 147, 0.06); border-radius: 8px; border: 1px solid rgba(0,0,0,0.1);';
                
                const optionKey = String.fromCharCode(65 + index);
                const label = document.createElement('div');
                label.style.cssText = 'flex: 0 0 auto; width: 32px; padding-top: 8px; font-weight: 600; color: #333;';
                label.textContent = optionKey + '.';
                
                const textarea = document.createElement('textarea');
                textarea.className = 'option-textarea';
                textarea.style.cssText = 'flex: 1; min-height: 60px; padding: 8px 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; font-size: 14px; line-height: 1.5; resize: vertical; font-family: inherit;';
                textarea.rows = 2;
                textarea.value = opt;
                textarea.placeholder = '输入选项内容（支持多行）';
                textarea.oninput = updatePreview;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'btn-delete-option';
                deleteBtn.style.cssText = 'flex: 0 0 auto; padding: 8px 12px; background: rgba(255, 59, 48, 0.1); color: #ff3b30; border: 1px solid rgba(255, 59, 48, 0.2); border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap;';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = function() {
                    optionItem.remove();
                    updateOptionLabels();
                    updatePreview();
                };
                
                optionItem.appendChild(label);
                optionItem.appendChild(textarea);
                optionItem.appendChild(deleteBtn);
                container.appendChild(optionItem);
            });
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('qType').addEventListener('change', handleQuestionTypeChange);
    });

    function openDrawer(id = null) {
        document.getElementById('editingId').value = id;
        if (id) {
            document.getElementById('drawer-title').textContent = '修改题目';
            fetch(`/admin/api/questions/${id}`).then(r=>r.json()).then(full_q => {
                document.getElementById('qType').value = full_q.q_type;
                // Manually trigger change to rebuild UI elements for the correct type
                handleQuestionTypeChange();
                
                document.getElementById('qDifficulty').value = full_q.difficulty || 1;
                document.getElementById('qTags').value = full_q.tags || '';
                document.getElementById('qContent').value = full_q.content;
                
                // 设置选项（支持多行）
                if (full_q.options) {
                    try {
                        const options = JSON.parse(full_q.options);
                        setOptions(options);
                    } catch(e) {
                        // 兼容旧格式：如果是字符串数组
                        const options = Array.isArray(full_q.options) ? full_q.options : [];
                        setOptions(options);
                    }
                } else {
                    setOptions([]);
                }
                
                // Set answer value on the newly created element
                // 填空题：用结构化编辑器回填
                if (full_q.q_type === '填空题') {
                    blankEditorInitFromContentAndAnswer(full_q.content || '', full_q.answer || '');
                } else {
                    const answerInput = document.getElementById('qAnswer');
                    if(answerInput) answerInput.value = full_q.answer;
                }

                document.getElementById('qExplanation').value = full_q.explanation || '';

                // New image handling
                try {
                    const imagePaths = JSON.parse(full_q.image_path || '[]');
                    setImagePaths(imagePaths);
                } catch (e) {
                    setImagePaths([]); // Clear on parse error
                }

                updatePreview();
            });
        } else {
            document.getElementById('drawer-title').textContent = '新增题目';
            // Reset all fields
            ['qDifficulty', 'qTags', 'qContent', 'qExplanation'].forEach(elId => document.getElementById(elId).value = '');
            setOptions([]);
            document.getElementById('qDifficulty').value = 1;
            document.getElementById('qType').selectedIndex = 0; // Reset to first type
            handleQuestionTypeChange(); // Build UI for default type
            setImagePaths([]); // Clear image previews for new question
            updatePreview();
        }
        document.getElementById('drawer').classList.add('open');
        document.getElementById('drawerOverlay').classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeDrawer() { 
        document.getElementById('drawer').classList.remove('open');
        document.getElementById('drawerOverlay').classList.remove('show');
        document.body.style.overflow = '';
    }

    async function saveQuestion() {
        const id = document.getElementById('editingId').value;
        const content = document.getElementById('qContent').value.trim();
        const answerInput = document.getElementById('qAnswer');
        const answer = answerInput ? answerInput.value.trim() : '';
        
        if (!content) {
            showError('请输入题干内容');
            return;
        }
        if (!answer) {
            showError('请输入答案');
            return;
        }
        
        const options = getOptions();
        const payload = {
            subject_id: subjectId,
            q_type: document.getElementById('qType').value,
            difficulty: parseInt(document.getElementById('qDifficulty').value) || 1,
            tags: document.getElementById('qTags').value.trim(),
            content: content,
            options: JSON.stringify(options),
            answer: answer,
            explanation: document.getElementById('qExplanation').value.trim(),
            image_path: document.getElementById('qImagePaths').value,
        };
        
        try {
            const url = id ? `/admin/api/questions/${id}` : '/admin/api/questions';
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await res.json();
            
            if (result.status === 'success') {
                showSuccess(result.message || (id ? '题目修改成功' : '题目添加成功'));
                closeDrawer();
                loadQuestions();
            } else {
                showError(result.message || '操作失败');
            }
        } catch (error) {
            console.error('保存题目失败:', error);
            showError('保存失败，请稍后重试');
        }
    }

    async function deleteQuestion(id) {
        if (!(await appConfirm('⚠️ 确定要删除该题目吗？\n\n此操作不可恢复！'))) return;
        
        try {
            const res = await fetch(`/admin/api/questions/${id}`, { method: 'DELETE' });
            const result = await res.json();
            
            if (result.status === 'success') {
                showSuccess(result.message || '题目删除成功');
                loadQuestions();
            } else {
                showError(result.message || '删除失败');
            }
        } catch (error) {
            console.error('删除题目失败:', error);
            showError('删除失败，请稍后重试');
        }
    }

    async function batchDeleteQuestions() {
        const ids = Array.from(document.querySelectorAll('.questionSelect:checked')).map(cb => cb.dataset.id);
        if (!ids.length) {
            showError('请先选择要删除的题目');
            return;
        }
        
        if (!(await appConfirm(`⚠️ 确定要删除选中的 ${ids.length} 道题目吗？\n\n此操作不可恢复！`))) return;
        
        try {
            const res = await fetch('/admin/api/questions/batch_delete', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ ids }) 
            });
            const result = await res.json();
            
            if (result.status === 'success') {
                showSuccess(result.message || `成功删除 ${ids.length} 道题目`);
                loadQuestions();
            } else {
                showError(result.message || '批量删除失败');
            }
        } catch (error) {
            console.error('批量删除失败:', error);
            showError('批量删除失败，请稍后重试');
        }
    }

    // ======= 导入/导出 =======
    function openImportModal(){ openModal('modalImport'); document.getElementById('importPreview').innerHTML=''; }
    function normalizeImportQuestions(payload){
        if(Array.isArray(payload)) return payload;
        if(payload && typeof payload === 'object'){
            if(Array.isArray(payload.questions)) return payload.questions;
            if(payload.data && Array.isArray(payload.data.questions)) return payload.data.questions;
        }
        return null;
    }
    function renderImportPreview(){
        const txt = document.getElementById('importText').value.trim();
        const file = document.getElementById('importFile').files[0];
        if(txt){
            try{
                const data = JSON.parse(txt);
                const list = normalizeImportQuestions(data);
                window.__importData = data;
                window.__importQuestions = list;
                showImportPreview(list);
            }catch(e){ appAlert('粘贴内容不是有效JSON'); }
            return;
        }
        if(file){
            const fr = new FileReader();
            fr.onload = () => {
                try{
                    const data = JSON.parse(fr.result);
                    const list = normalizeImportQuestions(data);
                    window.__importData = data;
                    window.__importQuestions = list;
                    showImportPreview(list);
                }catch(e){ appAlert('文件内容不是有效JSON'); }
            };
            fr.readAsText(file);
            return;
        }
        appAlert('请粘贴JSON或选择文件');
    }
    function showImportPreview(list){
        if(!Array.isArray(list)) { appAlert('JSON格式不支持：需要数组或包含 questions 的对象'); return; }
        const box = document.getElementById('importPreview');
        let ok=0, bad=0, html='';
        list.forEach((it, i)=>{
            const qType = (it && (it.type || it['题型'] || it.q_type)) || '';
            const qContent = (it && (it.content || it['题干'] || it['content'])) || '';
            const valid = String(qType||'').trim() && String(qContent||'').trim();
            if(valid) ok++; else bad++;
            html += `<div style="padding:6px; border-bottom:1px solid var(--border-color); ${valid?'':'background:#fff3cd'}">#${i+1} ${qType||'(缺少题型)'} - ${String(qContent||'').slice(0,60)}</div>`;
        });
        box.innerHTML = `<div style="margin-bottom:6px;">共 ${list.length} 条；有效 ${ok}，问题 ${bad}</div>` + html;
    }

        const ret = await res.json(); appAlert(ret.message||'');
        if(ret.status==='success'){ closeModal('modalImport'); loadQuestions(); }
    }

    async function uploadPackage() {
        const fileInput = document.getElementById('importPackageFile');

        const formData = new FormData();
        formData.append('file', file);

    // New uploadImage function for multiple files
    async function uploadImage() {
        const fileInput = document.getElementById('qImageFile');
        if (fileInput.files.length === 0) return;

        const files = Array.from(fileInput.files);
        let currentPaths = getImagePaths();

        // Show a temporary loading state if needed

        for (const file of files) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/admin/api/questions/upload_image', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();

                if (result.status === 'success') {
                    if (!currentPaths.includes(result.path)) {
                        currentPaths.push(result.path);
                    }
                } else {
                    showError(`图片 ${file.name} 上传失败: ${result.message}`);
                }
            } catch (e) {
                showError(`图片 ${file.name} 上传失败: ${e.message}`);
            }
        }
        
        fileInput.value = ''; // Clear the file input after processing all files
        setImagePaths(currentPaths);
    }

    // New removeImage function
    function removeImage(pathToRemove) {
        let currentPaths = getImagePaths();
        const updatedPaths = currentPaths.filter(path => path !== pathToRemove);
        setImagePaths(updatedPaths);
    }

    /* =============================
     * 填空题结构化答案编辑器
     * 格式约定：不同空用 ";;" 分隔；同一空多答案用 ";" 分隔
     * 示例：北京;北平;;上海;沪
     * ============================= */

    function blankEditorCountBlanksFromContent(content) {
        try {
            const c = (content || '').toString();
            const n = (c.match(/__/g) || []).length;
            return Math.max(1, n);
        } catch (e) {
            return 1;
        }
    }

    function blankEditorParseAnswer(answerStr) {
        const s = (answerStr || '').toString().trim();
        if (!s) return [];
        // 空之间：;;
        // 同空候选：;
        return s.split(';;').map(group => {
            const g = (group || '').trim();
            if (!g) return [''];
            const arr = g.split(';').map(x => x.trim()).filter(Boolean);
            return arr.length ? arr : [''];
        });
    }

    function blankEditorSerialize(groups) {
        const safeGroups = (groups || []).map(opts => {
            const cleaned = (opts || []).map(x => (x || '').toString().trim()).filter(Boolean);
            return cleaned.join(';');
        });
        return safeGroups.join(';;');
    }

    function blankEditorGetGroupsFromDOM() {
        const wrap = document.getElementById('blank-groups');
        if (!wrap) return [];
        const groups = [];
        wrap.querySelectorAll('[data-blank-group]').forEach(groupEl => {
            const opts = [];
            groupEl.querySelectorAll('input[data-blank-opt]').forEach(inp => {
                opts.push((inp.value || '').trim());
            });
            groups.push(opts);
        });
        return groups;
    }

    function blankEditorSyncHiddenAnswer() {
        const hidden = document.getElementById('qAnswer');
        if (!hidden) return;
        const rawBox = document.getElementById('blank-raw');
        const isRaw = rawBox && rawBox.style.display !== 'none';
        if (isRaw) {
            const rawInput = document.getElementById('blank-raw-input');
            hidden.value = rawInput ? (rawInput.value || '').trim() : '';
            return;
        }
        const groups = blankEditorGetGroupsFromDOM();
        hidden.value = blankEditorSerialize(groups);
    }

    function blankEditorRender(groups) {
        const wrap = document.getElementById('blank-groups');
        if (!wrap) return;
        wrap.innerHTML = '';

        (groups || []).forEach((opts, idx) => {
            const group = document.createElement('div');
            group.setAttribute('data-blank-group', '1');
            group.style.border = '1px solid #e9ecef';
            group.style.borderRadius = '12px';
            group.style.padding = '10px';
            group.style.background = '#fff';

            const header = document.createElement('div');
            header.style.display = 'flex';
            header.style.justifyContent = 'space-between';
            header.style.alignItems = 'center';
            header.style.gap = '10px';
            header.style.marginBottom = '8px';
            header.innerHTML = `
              <div style="font-weight:700;">空 ${idx + 1}</div>
              <div style="display:flex; gap:8px;">
                <button type="button" class="btn-sm" style="padding:6px 10px; border:1px solid #dee2e6; background:#fff; border-radius:8px; cursor:pointer;" data-add-opt>+ 增加答案</button>
                <button type="button" class="btn-sm" style="padding:6px 10px; border:1px solid #f1c0bc; background:rgba(255,59,48,0.06); color:#b42318; border-radius:8px; cursor:pointer;" data-del-blank>删除此空</button>
              </div>
            `;

            const list = document.createElement('div');
            list.style.display = 'flex';
            list.style.flexDirection = 'column';
            list.style.gap = '8px';

            const normOpts = (opts && opts.length) ? opts : [''];
            normOpts.forEach((val) => {
                list.appendChild(blankEditorCreateOptRow(val));
            });

            group.appendChild(header);
            group.appendChild(list);
            wrap.appendChild(group);

            // events
            header.querySelector('[data-add-opt]').onclick = () => {
                list.appendChild(blankEditorCreateOptRow(''));
                blankEditorSyncHiddenAnswer();
            };
            header.querySelector('[data-del-blank]').onclick = () => {
                // 至少保留 1 空
                const all = wrap.querySelectorAll('[data-blank-group]');
                if (all.length <= 1) {
                    showError('至少需要保留 1 个空');
                    return;
                }
                group.remove();
                // 重新编号
                wrap.querySelectorAll('[data-blank-group]').forEach((g, i) => {
                    const t = g.querySelector('div[style*="font-weight:700"]');
                    if (t) t.textContent = `空 ${i + 1}`;
                });
                blankEditorSyncHiddenAnswer();
            };
        });

        blankEditorSyncHiddenAnswer();
    }

    function blankEditorCreateOptRow(val) {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.gap = '8px';
        row.style.alignItems = 'center';

        const inp = document.createElement('input');
        inp.type = 'text';
        inp.setAttribute('data-blank-opt', '1');
        inp.value = (val || '').toString();
        inp.placeholder = '可接受答案（例如：北京）';
        inp.style.flex = '1';
        inp.style.padding = '10px 12px';
        inp.style.border = '1px solid #ced4da';
        inp.style.borderRadius = '10px';
        inp.style.fontSize = '14px';
        inp.oninput = () => blankEditorSyncHiddenAnswer();

        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '删除';
        del.className = 'btn-sm';
        del.style.padding = '8px 10px';
        del.style.border = '1px solid #dee2e6';
        del.style.background = '#fff';
        del.style.borderRadius = '10px';
        del.style.cursor = 'pointer';
        del.onclick = () => {
            const parent = row.parentElement;
            row.remove();
            // 每空至少保留 1 个输入
            if (parent && parent.querySelectorAll('input[data-blank-opt]').length === 0) {
                parent.appendChild(blankEditorCreateOptRow(''));
            }
            blankEditorSyncHiddenAnswer();
        };

        row.appendChild(inp);
        row.appendChild(del);
        return row;
    }

    function blankEditorInitFromContentAndAnswer(content, answerStr) {
        const blankCount = blankEditorCountBlanksFromContent(content);
        const parsed = blankEditorParseAnswer(answerStr);

        // 以题干空数为准：不足补齐，超出截断
        const groups = [];
        for (let i = 0; i < blankCount; i++) {
            groups.push(parsed[i] ? parsed[i] : ['']);
        }

        blankEditorRender(groups);

        // raw input 同步
        const rawInput = document.getElementById('blank-raw-input');
        if (rawInput) {
            rawInput.value = blankEditorSerialize(groups);
            rawInput.oninput = () => blankEditorSyncHiddenAnswer();
        }
    }

    function blankEditorAddBlank() {
        const wrap = document.getElementById('blank-groups');
        if (!wrap) return;
        const groups = blankEditorGetGroupsFromDOM();
        groups.push(['']);
        blankEditorRender(groups);

        const rawInput = document.getElementById('blank-raw-input');
        if (rawInput) rawInput.value = blankEditorSerialize(groups);
    }

    function blankEditorToggleRaw(toRaw) {
        const rawBox = document.getElementById('blank-raw');
        const rawInput = document.getElementById('blank-raw-input');
        const wrap = document.getElementById('blank-groups');
        if (!rawBox || !wrap) return;

        if (toRaw) {
            // 切到手写：用当前结构化结果填充
            const groups = blankEditorGetGroupsFromDOM();
            if (rawInput) rawInput.value = blankEditorSerialize(groups);
            rawBox.style.display = 'block';
            wrap.style.display = 'none';
        } else {
            // 切回结构化：尝试解析手写
            const parsed = blankEditorParseAnswer(rawInput ? rawInput.value : '');
            const blankCount = blankEditorCountBlanksFromContent(document.getElementById('qContent')?.value || '');
            const groups = [];
            for (let i = 0; i < blankCount; i++) groups.push(parsed[i] ? parsed[i] : ['']);
            rawBox.style.display = 'none';
            wrap.style.display = 'flex';
            blankEditorRender(groups);
        }
        blankEditorSyncHiddenAnswer();
    }

    // 题干变化时：如果当前是填空题，自动根据 __ 数量调整空数
    function blankEditorOnContentChanged() {
        const qType = document.getElementById('qType')?.value;
        if (qType !== '填空题') return;
        const wrap = document.getElementById('blank-groups');
        if (!wrap) return;
        const blankCount = blankEditorCountBlanksFromContent(document.getElementById('qContent')?.value || '');
        const current = blankEditorGetGroupsFromDOM();
        const groups = [];
        for (let i = 0; i < blankCount; i++) groups.push(current[i] ? current[i] : ['']);
        blankEditorRender(groups);

        const rawInput = document.getElementById('blank-raw-input');
        if (rawInput) rawInput.value = blankEditorSerialize(groups);
    }

    // 挂到 window，确保 onclick 可用
    window.blankEditorInitFromContentAndAnswer = blankEditorInitFromContentAndAnswer;
    window.blankEditorAddBlank = blankEditorAddBlank;
    window.blankEditorToggleRaw = blankEditorToggleRaw;

    // 监听题干输入
    document.addEventListener('DOMContentLoaded', () => {
        const c = document.getElementById('qContent');
        if (c) c.addEventListener('input', () => {
            // 防抖（很轻量）
            clearTimeout(window.__blankEditorTimer);
            window.__blankEditorTimer = setTimeout(blankEditorOnContentChanged, 120);
        });
    });
</script>
