<div class="container">
    <div class="toolbar">
        <div class="toolbar-left">
            <h1>通知管理</h1>
        </div>
        <div class="toolbar-right">
            <button class="btn-outline" onclick="refreshData()">刷新</button>
            <button class="btn-primary" onclick="openCreate()">新建通知</button>
        </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="filter-bar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索标题或内容..." oninput="handleSearch()">
            <button class="clear-search" id="clearSearch" onclick="clearSearch()">×</button>
        </div>

        <div class="filter-group">
            <span class="filter-label">状态:</span>
            <div class="filter-chips">
                <button class="filter-chip active" data-status="all" onclick="filterByStatus('all')">全部</button>
                <button class="filter-chip" data-status="active" onclick="filterByStatus('active')">启用</button>
                <button class="filter-chip" data-status="inactive" onclick="filterByStatus('inactive')">禁用</button>
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width:50px;">ID</th>
                    <th>标题</th>
                    <th>内容预览</th>
                    <th style="width:80px;">优先级</th>
                    <th style="width:90px;">状态</th>
                    <th style="width:160px;">创建时间</th>
                    <th style="width:100px;">操作</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr>
                    <td colspan="7" class="loading">
                        <div class="loading-spinner"></div>
                        <div style="margin-top: 12px;">加载中...</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="pagination" style="display: none;">
        <button onclick="changePage('first')" id="btnFirst">首页</button>
        <button onclick="changePage('prev')" id="btnPrev">上一页</button>
        <span class="page-info" id="pageInfo">第 1 页 / 共 1 页</span>
        <button onclick="changePage('next')" id="btnNext">下一页</button>
        <button onclick="changePage('last')" id="btnLast">末页</button>
    </div>
</div>
