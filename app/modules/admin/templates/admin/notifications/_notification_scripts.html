<script>
    let allNotifications = [];
    let filteredNotifications = [];
    let currentPage = 1;
    const pageSize = 10;
    let currentStatusFilter = 'all';
    let searchKeyword = '';

    function qs(sel) { return document.querySelector(sel); }
    function getVal(id) { return document.getElementById(id).value.trim(); }

    async function loadNotifications() {
        try {
            const res = await fetch('/admin/api/notifications');
            const js = await res.json();
            if (!res.ok || js.status !== 'success') {
                showError(js.message || '加载失败');
                return;
            }
            allNotifications = js.notifications || [];
            applyFilters();
            renderStats();
        } catch (e) {
            console.error('加载通知失败:', e);
            showError('加载通知失败');
        }
    }

    function refreshData() {
        showLoading();
        loadNotifications();
    }

    function showLoading() {
        const tb = document.getElementById('tbody');
        tb.innerHTML = `<tr><td colspan="7" class="loading">
            <div class="loading-spinner"></div>
            <div style="margin-top: 12px;">加载中...</div>
        </td></tr>`;
    }

    function showError(msg) {
        const tb = document.getElementById('tbody');
        tb.innerHTML = `<tr><td colspan="7" class="empty-state">
            <div class="empty-state-text">加载失败</div>
            <div class="empty-state-hint">${escapeHtml(msg)}</div>
        </td></tr>`;
    }

    function renderStats() {
        const total = allNotifications.length;
        const active = allNotifications.filter(n => n.is_active).length;
        const inactive = total - active;
        const highPriority = allNotifications.filter(n => n.priority >= 50).length;

        qs('#statsRow').innerHTML = `
            <div class="stat-card info">
                <div class="stat-label">总通知数</div>
                <div class="stat-value">${total}</div>
            </div>
            <div class="stat-card success">
                <div class="stat-label">已启用</div>
                <div class="stat-value">${active}</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-label">已禁用</div>
                <div class="stat-value">${inactive}</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-label">高优先级 (≥50)</div>
                <div class="stat-value">${highPriority}</div>
            </div>
        `;
    }

    function applyFilters() {
        filteredNotifications = allNotifications.filter(n => {
            if (currentStatusFilter === 'active' && !n.is_active) return false;
            if (currentStatusFilter === 'inactive' && n.is_active) return false;

            if (searchKeyword) {
                const keyword = searchKeyword.toLowerCase();
                const title = (n.title || '').toLowerCase();
                const content = (n.content || '').toLowerCase();
                if (!title.includes(keyword) && !content.includes(keyword)) return false;
            }
            return true;
        });

        currentPage = 1;
        renderTable();
    }

    function handleSearch() {
        const input = qs('#searchInput');
        searchKeyword = input.value.trim();
        qs('#clearSearch').style.display = searchKeyword ? 'block' : 'none';
        applyFilters();
    }

    function clearSearch() {
        qs('#searchInput').value = '';
        searchKeyword = '';
        qs('#clearSearch').style.display = 'none';
        applyFilters();
    }

    function filterByStatus(status) {
        currentStatusFilter = status;
        document.querySelectorAll('[data-status]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.status === status);
        });
        applyFilters();
    }

    function changePage(action) {
        const totalPages = Math.max(1, Math.ceil(filteredNotifications.length / pageSize));

        switch(action) {
            case 'first':
                currentPage = 1;
                break;
            case 'prev':
                if (currentPage > 1) currentPage--;
                break;
            case 'next':
                if (currentPage < totalPages) currentPage++;
                break;
            case 'last':
                currentPage = totalPages;
                break;
        }

        renderTable();
    }

    function renderTable() {
        const tb = document.getElementById('tbody');
        const totalPages = Math.max(1, Math.ceil(filteredNotifications.length / pageSize));

        if (filteredNotifications.length === 0) {
            tb.innerHTML = `<tr><td colspan="7" class="empty-state">
                <div class="empty-state-text">暂无通知</div>
                <div class="empty-state-hint">点击“新建通知”创建第一条通知</div>
            </td></tr>`;
            qs('#pagination').style.display = 'none';
            return;
        }

        const start = (currentPage - 1) * pageSize;
        const pageData = filteredNotifications.slice(start, start + pageSize);

        tb.innerHTML = pageData.map(n => {
            const statusClass = n.is_active ? 'tag-active' : 'tag-inactive';
            const statusText = n.is_active ? '启用' : '禁用';
            let priorityClass = 'priority-low';
            if (n.priority >= 70) priorityClass = 'priority-high';
            else if (n.priority >= 30) priorityClass = 'priority-medium';

            return `<tr>
                <td>${n.id}</td>
                <td><strong>${escapeHtml(n.title)}</strong></td>
                <td class="content-preview" title="${escapeHtml(n.content)}" data-content="${escapeHtml(n.content).replace(/"/g, '&quot;')}" onclick="showContentPreview(this.dataset.content)">${escapeHtml(n.content)}</td>
                <td><span class="priority-badge ${priorityClass}">${n.priority || 0}</span></td>
                <td><span class="tag ${statusClass}">${statusText}</span></td>
                <td class="muted">${formatDate(n.created_at)}</td>
                <td class="actions">
                    <div class="action-menu-wrapper">
                        <button class="btn-sm btn-action" onclick="toggleNotificationsActionMenu(${n.id}, event)" title="操作">操作</button>
                        <div class="action-menu" id="notificationsActionMenu_${n.id}">
                            <button class="action-menu-item" onclick="openEdit(${n.id}); closeNotificationsActionMenu(${n.id})">编辑</button>
                            <button class="action-menu-item" onclick="toggleActive(${n.id}); closeNotificationsActionMenu(${n.id})">${n.is_active ? '禁用' : '启用'}</button>
                            <div class="action-menu-divider"></div>
                            <button class="action-menu-item danger" onclick="deleteNotification(${n.id}); closeNotificationsActionMenu(${n.id})">删除</button>
                        </div>
                    </div>
                </td>
            </tr>`;
        }).join('');

        if (totalPages > 1) {
            qs('#pagination').style.display = 'flex';
            qs('#pageInfo').innerText = `第 ${currentPage} 页 / 共 ${totalPages} 页 (共 ${filteredNotifications.length} 条)`;
            qs('#btnFirst').disabled = currentPage === 1;
            qs('#btnPrev').disabled = currentPage === 1;
            qs('#btnNext').disabled = currentPage === totalPages;
            qs('#btnLast').disabled = currentPage === totalPages;
        } else {
            qs('#pagination').style.display = 'none';
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
            const d = new Date(dateStr);
            return d.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        } catch (e) {
            return dateStr;
        }
    }

    function updateCharCount(inputId, counterId, maxLength) {
        const input = document.getElementById(inputId);
        const counter = document.getElementById(counterId);
        const length = input.value.length;
        counter.textContent = `${length} / ${maxLength}`;

        counter.classList.remove('warning', 'danger');
        if (length > maxLength * 0.9) counter.classList.add('danger');
        else if (length > maxLength * 0.7) counter.classList.add('warning');
    }

    function openCreate() {
        qs('#dlgTitle').innerText = '新建通知';
        qs('#editId').value = '';
        qs('#editTitle').value = '';
        qs('#editContent').value = '';
        qs('#editPriority').value = '0';
        qs('#editActive').value = '1';
        qs('#editStartAt').value = '';
        qs('#editEndAt').value = '';
        updateCharCount('editTitle', 'titleCount', 100);
        updateCharCount('editContent', 'contentCount', 500);
        qs('#dlgEdit').style.display = 'flex';
    }

    async function openEdit(id) {
        try {
            const res = await fetch(`/admin/api/notifications/${id}`);
            const js = await res.json();
            if (!res.ok || js.status !== 'success') {
                appAlert(js.message || '获取通知失败');
                return;
            }

            const n = js.notification;
            qs('#dlgTitle').innerText = '编辑通知';
            qs('#editId').value = n.id;
            qs('#editTitle').value = n.title || '';
            qs('#editContent').value = n.content || '';
            qs('#editPriority').value = n.priority || 0;
            qs('#editActive').value = n.is_active ? '1' : '0';
            qs('#editStartAt').value = formatDateTimeLocal(n.start_at);
            qs('#editEndAt').value = formatDateTimeLocal(n.end_at);
            updateCharCount('editTitle', 'titleCount', 100);
            updateCharCount('editContent', 'contentCount', 500);
            qs('#dlgEdit').style.display = 'flex';
        } catch (e) {
            console.error('获取通知失败:', e);
            appAlert('获取通知失败');
        }
    }

    function formatDateTimeLocal(dateStr) {
        if (!dateStr) return '';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            const tzOff = d.getTimezoneOffset() * 60000;
            return new Date(d.getTime() - tzOff).toISOString().slice(0, 16);
        } catch (e) {
            return '';
        }
    }

    function closeEdit() {
        qs('#dlgEdit').style.display = 'none';
    }

    async function saveNotification() {
        const id = qs('#editId').value;
        const title = getVal('editTitle');
        const content = getVal('editContent');
        const priority = parseInt(qs('#editPriority').value, 10) || 0;
        const is_active = qs('#editActive').value === '1';
        const start_at = qs('#editStartAt').value || null;
        const end_at = qs('#editEndAt').value || null;

        if (!title) {
            appAlert('请填写标题');
            qs('#editTitle').focus();
            return;
        }
        if (!content) {
            appAlert('请填写内容');
            qs('#editContent').focus();
            return;
        }
        if (priority < 0 || priority > 100) {
            appAlert('优先级必须在 0-100 之间');
            qs('#editPriority').focus();
            return;
        }

        const btnSave = qs('#btnSave');
        const originalText = btnSave.textContent;
        btnSave.disabled = true;
        btnSave.textContent = '保存中...';

        try {
            const url = id ? `/admin/api/notifications/${id}` : '/admin/api/notifications';
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, priority, is_active, start_at, end_at })
            });

            const js = await res.json();
            if (!res.ok || js.status !== 'success') {
                appAlert(js.message || '保存失败');
                return;
            }

            appAlert(js.message || '保存成功');
            closeEdit();
            loadNotifications();
        } catch (e) {
            console.error('保存通知失败:', e);
            appAlert('保存通知失败');
        } finally {
            btnSave.disabled = false;
            btnSave.textContent = originalText;
        }
    }

    async function toggleActive(id) {
        try {
            const res = await fetch(`/admin/api/notifications/${id}/toggle`, { method: 'POST' });
            const js = await res.json();
            if (!res.ok || js.status !== 'success') {
                appAlert(js.message || '操作失败');
                return;
            }
            loadNotifications();
        } catch (e) {
            console.error('切换状态失败:', e);
            appAlert('切换状态失败');
        }
    }

    async function deleteNotification(id) {
        if (!(await appConfirm('确定要删除这条通知吗？\n\n删除后将无法恢复。'))) return;

        try {
            const res = await fetch(`/admin/api/notifications/${id}`, { method: 'DELETE' });
            const js = await res.json();
            if (!res.ok || js.status !== 'success') {
                appAlert(js.message || '删除失败');
                return;
            }
            appAlert(js.message || '删除成功');
            loadNotifications();
        } catch (e) {
            console.error('删除通知失败:', e);
            appAlert('删除通知失败');
        }
    }

    function toggleNotificationsActionMenu(notificationId, event) {
        event.stopPropagation();
        const menuId = `notificationsActionMenu_${notificationId}`;
        const menu = document.getElementById(menuId);

        document.querySelectorAll('.action-menu.show').forEach(m => {
            if (m.id && m.id.startsWith('notificationsActionMenu_') && m.id !== menuId) {
                m.classList.remove('show');
                const tr = m.closest('tr');
                if (tr) tr.style.zIndex = '';
            }
        });

        if (menu) {
            menu.classList.toggle('show');
            const tr = menu.closest('tr');
            if (tr) tr.style.zIndex = menu.classList.contains('show') ? '100' : '';
        }
    }

    function closeNotificationsActionMenu(notificationId) {
        const menu = document.getElementById(`notificationsActionMenu_${notificationId}`);
        if (menu) {
            menu.classList.remove('show');
            const tr = menu.closest('tr');
            if (tr) tr.style.zIndex = '';
        }
    }

    function showContentPreview(content) {
        const modal = document.getElementById('contentPreviewModal');
        const previewContent = document.getElementById('previewContent');
        if (modal && previewContent) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            previewContent.textContent = tempDiv.textContent || tempDiv.innerText || content;
            modal.style.display = 'flex';
        }
    }

    function closeContentPreview() {
        const modal = document.getElementById('contentPreviewModal');
        if (modal) modal.style.display = 'none';
    }

    qs('#dlgEdit').addEventListener('click', function(e) {
        if (e.target === this) closeEdit();
    });

    document.getElementById('contentPreviewModal')?.addEventListener('click', function(e) {
        if (e.target === this) closeContentPreview();
    });

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            const previewModal = document.getElementById('contentPreviewModal');
            if (previewModal && previewModal.style.display === 'flex') closeContentPreview();
            const editModal = document.getElementById('dlgEdit');
            if (editModal && editModal.style.display === 'flex') closeEdit();
        }
    });

    document.addEventListener('click', function(event) {
        if (!event.target.closest('.action-menu-wrapper')) {
            document.querySelectorAll('.action-menu.show').forEach(menu => {
                if (menu.id && menu.id.startsWith('notificationsActionMenu_')) {
                    menu.classList.remove('show');
                    const tr = menu.closest('tr');
                    if (tr) tr.style.zIndex = '';
                }
            });
        }
    });

    loadNotifications();
</script>
