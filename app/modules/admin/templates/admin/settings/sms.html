{% extends "admin/admin_base.html" %}

{% block title %}短信配置 - 系统设置{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <div class="header-left">
            <a href="/admin/settings" class="back-link">← 返回系统设置</a>
            <h1>短信配置</h1>
            <p class="page-description">配置阿里云短信验证码服务（登录注册 / 绑定手机 / 重置密码），保存后 Web 与小程序共用同一套配置。</p>
        </div>
    </div>

    <div class="settings-form-container">
        <form id="smsConfigForm" class="settings-form">
            <div class="form-section">
                <h3 class="section-title">基础开关</h3>

                <label class="checkbox-card">
                    <input type="checkbox" id="sms_enabled" {% if sms_config.enabled %}checked{% endif %}>
                    <div>
                        <strong>启用短信服务</strong>
                        <div class="form-hint">关闭后，短信验证码相关功能会直接提示未启用。</div>
                    </div>
                </label>

                <label class="checkbox-card">
                    <input type="checkbox" id="sms_console_output" {% if sms_config.console_output %}checked{% endif %}>
                    <div>
                        <strong>控制台输出验证码</strong>
                        <div class="form-hint">开发/联调时可开启；开启后不会发送真实短信，而是在日志中输出验证码。</div>
                    </div>
                </label>
            </div>

            <div class="form-section">
                <h3 class="section-title">阿里云账号与模板</h3>

                <div class="form-group">
                    <label for="sms_access_key_id">AccessKey ID</label>
                    <input type="text" id="sms_access_key_id" value="{{ sms_config.access_key_id }}" placeholder="请输入阿里云 AccessKey ID">
                    <div class="form-hint">已配置时会显示为脱敏值，输入新值才会更新。</div>
                </div>

                <div class="form-group">
                    <label for="sms_access_key_secret">AccessKey Secret</label>
                    <input type="password" id="sms_access_key_secret" value="{{ sms_config.access_key_secret }}" placeholder="请输入阿里云 AccessKey Secret">
                    <div class="form-hint">为安全起见，此字段始终以密文输入框展示。</div>
                </div>

                <div class="form-group">
                    <label for="sms_sign_name">短信签名</label>
                    <input type="text" id="sms_sign_name" value="{{ sms_config.sign_name }}" placeholder="例如：速通互联验证码">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="sms_template_code">登录/注册模板编码</label>
                        <input type="text" id="sms_template_code" value="{{ sms_config.template_code }}" placeholder="例如：100001">
                    </div>

                    <div class="form-group">
                        <label for="sms_template_code_bind">绑定手机模板编码</label>
                        <input type="text" id="sms_template_code_bind" value="{{ sms_config.template_code_bind }}" placeholder="例如：100004">
                    </div>

                    <div class="form-group">
                        <label for="sms_template_code_reset">重置密码模板编码</label>
                        <input type="text" id="sms_template_code_reset" value="{{ sms_config.template_code_reset }}" placeholder="例如：100003">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3 class="section-title">验证码规则</h3>

                <div class="form-grid form-grid-compact">
                    <div class="form-group">
                        <label for="sms_code_length">验证码长度</label>
                        <input type="number" id="sms_code_length" min="4" max="8" value="{{ sms_config.code_length or 6 }}">
                    </div>

                    <div class="form-group">
                        <label for="sms_valid_time">有效期（秒）</label>
                        <input type="number" id="sms_valid_time" min="60" max="1800" value="{{ sms_config.valid_time or 300 }}">
                    </div>

                    <div class="form-group">
                        <label for="sms_interval">发送间隔（秒）</label>
                        <input type="number" id="sms_interval" min="1" max="600" value="{{ sms_config.interval or 60 }}">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3 class="section-title">发送测试</h3>
                <div class="form-group">
                    <label for="test_phone">测试手机号</label>
                    <div class="test-row">
                        <input type="text" id="test_phone" placeholder="请输入测试手机号">
                        <button type="button" class="btn btn-secondary" id="testBtn">发送测试短信</button>
                    </div>
                    <div class="form-hint">测试时优先使用你当前表单中的配置，不会先写库。</div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="saveBtn">保存配置</button>
            </div>

            <div class="form-message" id="formMessage"></div>
        </form>
    </div>
</div>

<style>
.page-container { padding: 40px; max-width: 960px; margin: 0 auto; }
.page-header { margin-bottom: 32px; }
.back-link { display: inline-block; color: var(--text-sub); text-decoration: none; font-size: 14px; margin-bottom: 12px; transition: color 0.2s; }
.back-link:hover { color: var(--primary); }
.page-header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
.page-description { color: var(--text-sub); font-size: 15px; line-height: 1.7; }

.settings-form-container {
    background: var(--card-bg);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 0.5px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 32px;
    box-shadow: var(--shadow);
}

.settings-form { display: flex; flex-direction: column; gap: 32px; }
.form-section { display: flex; flex-direction: column; gap: 16px; }
.section-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-group label { font-size: 14px; font-weight: 500; color: var(--text-color); }

.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="password"] {
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--card-bg-solid);
    color: var(--text-color);
    font-size: 15px;
    transition: all 0.2s;
}

.form-group input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.form-grid-compact {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.checkbox-card {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px 16px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    background: var(--card-bg-solid);
}

.checkbox-card input {
    margin-top: 2px;
    width: 16px;
    height: 16px;
}

.test-row {
    display: flex;
    gap: 12px;
}

.test-row input { flex: 1; }

.form-hint { font-size: 13px; color: var(--text-sub); line-height: 1.6; }
.form-actions { display: flex; justify-content: flex-end; }

.btn {
    padding: 12px 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
.btn-secondary {
    background: rgba(142,142,147,0.14);
    color: var(--text-color);
    border: 1px solid var(--border-color);
}
.btn-secondary:hover { background: rgba(142,142,147,0.2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.form-message { margin-top: 8px; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 14px; display: none; }
.form-message.success { display: block; background: rgba(52,199,89,0.15); color: var(--success); border: 1px solid rgba(52,199,89,0.3); }
.form-message.error { display: block; background: rgba(255,59,48,0.15); color: var(--danger); border: 1px solid rgba(255,59,48,0.3); }

@media only screen and (max-width: 768px) {
    .page-container { padding: 20px; }
    .settings-form-container { padding: 20px; }
    .page-header h1 { font-size: 24px; }
    .form-grid, .form-grid-compact { grid-template-columns: 1fr; }
    .test-row { flex-direction: column; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('smsConfigForm');
    const saveBtn = document.getElementById('saveBtn');
    const testBtn = document.getElementById('testBtn');
    const messageDiv = document.getElementById('formMessage');

    function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = 'form-message ' + type;
    }

    function getPayload() {
        return {
            sms_access_key_id: document.getElementById('sms_access_key_id').value.trim(),
            sms_access_key_secret: document.getElementById('sms_access_key_secret').value.trim(),
            sms_sign_name: document.getElementById('sms_sign_name').value.trim(),
            sms_template_code: document.getElementById('sms_template_code').value.trim(),
            sms_template_code_bind: document.getElementById('sms_template_code_bind').value.trim(),
            sms_template_code_reset: document.getElementById('sms_template_code_reset').value.trim(),
            sms_code_length: document.getElementById('sms_code_length').value.trim() || '6',
            sms_valid_time: document.getElementById('sms_valid_time').value.trim() || '300',
            sms_interval: document.getElementById('sms_interval').value.trim() || '60',
            sms_enabled: document.getElementById('sms_enabled').checked,
            sms_console_output: document.getElementById('sms_console_output').checked,
        };
    }

    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中...';

        try {
            const response = await fetch('/admin/api/settings/sms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(getPayload()),
            });
            const data = await response.json();
            if (data.status === 'success') {
                showMessage(data.message || '短信配置保存成功', 'success');
            } else {
                showMessage(data.message || '短信配置保存失败', 'error');
            }
        } catch (error) {
            showMessage('网络错误：' + error.message, 'error');
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = '保存配置';
        }
    });

    testBtn.addEventListener('click', async function() {
        const phone = document.getElementById('test_phone').value.trim();
        if (!phone) {
            showMessage('请先填写测试手机号', 'error');
            return;
        }

        testBtn.disabled = true;
        testBtn.textContent = '发送中...';

        try {
            const response = await fetch('/admin/api/settings/sms/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, ...getPayload() }),
            });
            const data = await response.json();
            if (data.status === 'success') {
                showMessage(data.message || '测试短信发送成功', 'success');
            } else {
                showMessage(data.message || '测试短信发送失败', 'error');
            }
        } catch (error) {
            showMessage('网络错误：' + error.message, 'error');
        } finally {
            testBtn.disabled = false;
            testBtn.textContent = '发送测试短信';
        }
    });
});
</script>
{% endblock %}
