{% extends "admin/admin_base.html" %}

{% block title %}校园管理 - 后台管理{% endblock %}

{% block head %}
<style>
    .campus-page { display: flex; flex-direction: column; gap: 24px; }
    .campus-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .campus-header h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: 0; }
    .campus-header p { margin: 0; color: var(--text-sub); font-size: 14px; line-height: 1.6; }
    .campus-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .campus-stat { background: var(--card-bg); border: 0.5px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-soft); }
    .campus-stat .label { color: var(--text-sub); font-size: 13px; margin-bottom: 8px; }
    .campus-stat .value { font-size: 30px; font-weight: 700; letter-spacing: 0; }
    .campus-section { background: var(--card-bg); border: 0.5px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-soft); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .toolbar input {
        min-height: 40px;
        min-width: 260px;
        padding: 9px 12px;
        border: 0.5px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: var(--card-bg-solid);
        color: var(--text-color);
        font-size: 14px;
        box-sizing: border-box;
    }
    .table-wrap { width: 100%; overflow-x: auto; border: 0.5px solid var(--border-color); border-radius: var(--radius-md); background: var(--card-bg-solid); }
    table { width: 100%; border-collapse: collapse; min-width: 860px; }
    th, td { padding: 12px 14px; border-bottom: 0.5px solid var(--border-color); text-align: left; font-size: 14px; vertical-align: top; }
    th { color: var(--text-sub); font-size: 13px; font-weight: 600; background: rgba(142, 142, 147, 0.06); }
    tbody tr:last-child td { border-bottom: none; }
    .record-row { cursor: pointer; }
    .record-row:hover { background: rgba(142, 142, 147, 0.06); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; white-space: nowrap; }
    .muted { color: var(--text-sub); }
    .student-name { font-weight: 650; letter-spacing: 0; }
    .student-info-line { color: var(--text-sub); font-size: 12px; line-height: 1.5; margin-top: 4px; }
    .record-counts { display: flex; gap: 8px; flex-wrap: wrap; }
    .count-badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; background: rgba(142, 142, 147, 0.1); font-size: 12px; font-weight: 600; }
    .grade-summary-line { display: grid; grid-template-columns: repeat(4, minmax(72px, 1fr)); gap: 10px; min-width: 320px; }
    .grade-summary-item { display: flex; flex-direction: column; gap: 2px; }
    .grade-summary-label { color: var(--text-sub); font-size: 12px; white-space: nowrap; }
    .grade-summary-value { color: var(--text-color); font-size: 15px; font-weight: 700; letter-spacing: 0; }
    .empty { padding: 32px; text-align: center; color: var(--text-sub); border: 0.5px dashed var(--border-color); border-radius: var(--radius-md); }
    .status-line { min-height: 20px; color: var(--text-sub); font-size: 13px; }
    .btn-xs { padding: 6px 12px; min-height: 32px; font-size: 13px; }

    @media (max-width: 900px) {
        .campus-stats { grid-template-columns: 1fr; }
        .campus-section { padding: 18px; }
        .toolbar { width: 100%; }
        .toolbar input, .toolbar button { width: 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="campus-page">
    <div class="campus-header">
        <div>
            <h1>校园管理</h1>
            <p>按已绑定教务账号、教务密码和学生姓名查看记录；未成功查询的账号以“未查询”占位。</p>
        </div>
        <button class="btn btn-secondary" type="button" id="refreshAllBtn">刷新</button>
    </div>

    <div class="campus-stats">
        <div class="campus-stat">
            <div class="label">已绑定教务账号</div>
            <div class="value" id="credentialCount">0</div>
        </div>
        <div class="campus-stat">
            <div class="label">已查询课表学期</div>
            <div class="value" id="scheduleSnapshotCount">0</div>
        </div>
        <div class="campus-stat">
            <div class="label">已查询成绩学期</div>
            <div class="value" id="gradeSnapshotCount">0</div>
        </div>
    </div>

    <section class="campus-section">
        <div class="section-head">
            <h2>绑定记录</h2>
            <div class="toolbar">
                <input id="recordSearch" type="text" placeholder="搜索教务账号或学生姓名">
                <button class="btn btn-secondary btn-sm" type="button" id="recordSearchBtn">搜索</button>
            </div>
        </div>
        <div id="recordStatus" class="status-line"></div>
        <div id="recordTable"></div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
const campusApi = {
    records: '/admin/api/campus/records',
    recordDetailPrefix: '/admin/campus/records/'
};

function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[ch]));
}

function fmtTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return esc(value);
    return esc(date.toLocaleString('zh-CN', { hour12: false }));
}

function updateSummary(summary) {
    const data = summary || {};
    document.getElementById('credentialCount').textContent = data.credential_count || 0;
    document.getElementById('scheduleSnapshotCount').textContent = data.schedule_snapshot_count || 0;
    document.getElementById('gradeSnapshotCount').textContent = data.grade_snapshot_count || 0;
}

async function fetchJson(url) {
    const response = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
    const data = await response.json();
    if (data.status !== 'success') {
        throw new Error(data.message || '加载失败');
    }
    return data.data || {};
}

function studentInfoLine(student) {
    const data = student || {};
    return [data.student_no, data.class_name, data.major_name, data.college_name]
        .filter(Boolean)
        .map(esc)
        .join(' / ');
}

function metricValue(value) {
    if (value === null || value === undefined || value === '') return '-';
    return esc(value);
}

function gradeSummaryLine(summary) {
    const data = summary || {};
    const items = [
        ['课程数', data.course_count],
        ['总学分', data.total_credits],
        ['加权绩点', data.gpa],
        ['绩点总和', data.total_grade_points]
    ];
    return `<div class="grade-summary-line">${items.map(([label, value]) => `<div class="grade-summary-item"><span class="grade-summary-label">${label}</span><span class="grade-summary-value">${metricValue(value)}</span></div>`).join('')}</div>`;
}

function recordDetailUrl(row) {
    return row.detail_url || `${campusApi.recordDetailPrefix}${encodeURIComponent(row.credential_id)}`;
}

function renderRecordRows(rows) {
    return rows.map(row => {
        const url = recordDetailUrl(row);
        const studentLine = studentInfoLine(row.student);
        return `<tr class="record-row" onclick="window.location.href='${esc(url)}'">
            <td>
                <div class="student-name">${esc(row.student_name || '未查询')}</div>
                <div class="student-info-line">${studentLine || '暂无学生信息'}</div>
            </td>
            <td class="mono">${esc(row.jwxt_username)}</td>
            <td class="mono">${esc(row.jwxt_password)}</td>
            <td>
                <div class="record-counts">
                    <span class="count-badge">课表 ${esc(row.schedule_snapshot_count || 0)}</span>
                    <span class="count-badge">成绩 ${esc(row.grade_snapshot_count || 0)}</span>
                </div>
            </td>
            <td>${fmtTime(row.latest_fetched_at)}</td>
            <td><a class="btn btn-secondary btn-xs" href="${esc(url)}" onclick="event.stopPropagation()">记录详情</a></td>
        </tr>`;
    }).join('');
}

async function loadRecords() {
    const keyword = document.getElementById('recordSearch').value.trim();
    const target = document.getElementById('recordTable');
    const status = document.getElementById('recordStatus');
    status.textContent = '加载中...';
    try {
        const data = await fetchJson(`${campusApi.records}?search=${encodeURIComponent(keyword)}&size=100`);
        updateSummary(data.summary);
        const rows = data.items || [];
        status.textContent = rows.length ? `共 ${data.total || rows.length} 条绑定记录` : '';
        if (!rows.length) {
            target.innerHTML = '<div class="empty">暂无已绑定的教务账号记录</div>';
            return;
        }
        target.innerHTML = `<div class="table-wrap"><table>
            <thead><tr><th>学生姓名</th><th>教务账号</th><th>教务密码</th><th>查询记录</th><th>最近查询</th><th>操作</th></tr></thead>
            <tbody>${renderRecordRows(rows)}</tbody>
        </table></div>`;
    } catch (error) {
        status.textContent = '';
        target.innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('recordSearchBtn').addEventListener('click', loadRecords);
    document.getElementById('refreshAllBtn').addEventListener('click', loadRecords);
    document.getElementById('recordSearch').addEventListener('keydown', event => {
        if (event.key === 'Enter') loadRecords();
    });
    loadRecords();
});
</script>
{% endblock %}
