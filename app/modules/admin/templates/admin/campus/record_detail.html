{% extends "admin/admin_base.html" %}

{% block title %}记录详情 - 校园管理{% endblock %}

{% block head %}
<style>
    .campus-detail-page { display: flex; flex-direction: column; gap: 24px; }
    .campus-detail-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .campus-detail-header h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: 0; }
    .campus-detail-header p { margin: 0; color: var(--text-sub); font-size: 14px; line-height: 1.6; }
    .record-overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .overview-item { background: var(--card-bg); border: 0.5px solid var(--border-color); border-radius: var(--radius-md); padding: 18px; box-shadow: var(--shadow-soft); min-width: 0; }
    .overview-label { color: var(--text-sub); font-size: 12px; margin-bottom: 8px; }
    .overview-value { font-size: 16px; font-weight: 650; letter-spacing: 0; overflow-wrap: anywhere; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .muted { color: var(--text-sub); }
    .campus-section { background: var(--card-bg); border: 0.5px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-soft); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .section-head h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0; }
    .table-wrap { width: 100%; overflow-x: auto; border: 0.5px solid var(--border-color); border-radius: var(--radius-md); background: var(--card-bg-solid); }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { padding: 12px 14px; border-bottom: 0.5px solid var(--border-color); text-align: left; font-size: 14px; vertical-align: top; }
    th { color: var(--text-sub); font-size: 13px; font-weight: 600; background: rgba(142, 142, 147, 0.06); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(142, 142, 147, 0.06); }
    .student-info-line { color: var(--text-sub); font-size: 12px; line-height: 1.5; margin-top: 4px; }
    .grade-summary-line { display: grid; grid-template-columns: repeat(4, minmax(72px, 1fr)); gap: 10px; min-width: 320px; }
    .grade-summary-item { display: flex; flex-direction: column; gap: 2px; }
    .grade-summary-label { color: var(--text-sub); font-size: 12px; white-space: nowrap; }
    .grade-summary-value { color: var(--text-color); font-size: 15px; font-weight: 700; letter-spacing: 0; }
    .empty { padding: 32px; text-align: center; color: var(--text-sub); border: 0.5px dashed var(--border-color); border-radius: var(--radius-md); }
    .status-line { min-height: 20px; color: var(--text-sub); font-size: 13px; }
    .btn-xs { padding: 6px 12px; min-height: 32px; font-size: 13px; }
    .detail-panel { border: 0.5px solid var(--border-color); border-radius: var(--radius-md); background: var(--card-bg-solid); overflow: hidden; }
    .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-bottom: 0.5px solid var(--border-color); flex-wrap: wrap; }
    .detail-head h3 { margin: 0; font-size: 17px; letter-spacing: 0; }
    .detail-body { padding: 16px; overflow-x: auto; }

    @media (max-width: 900px) {
        .record-overview { grid-template-columns: 1fr; }
        .campus-section { padding: 18px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="campus-detail-page">
    <div class="campus-detail-header">
        <div>
            <h1>记录详情</h1>
            <p>查看该教务账号已保存的学生信息、课表记录和成绩记录。</p>
        </div>
        <a class="btn btn-secondary" href="/admin/campus">返回校园管理</a>
    </div>

    <div id="detailStatus" class="status-line"></div>
    <div id="recordOverview" class="record-overview"></div>

    <section class="campus-section">
        <div class="section-head">
            <h2>课表记录</h2>
            <span id="scheduleCount" class="muted">0 条</span>
        </div>
        <div id="scheduleTable"></div>
    </section>

    <section class="campus-section">
        <div class="section-head">
            <h2>成绩记录</h2>
            <span id="gradeCount" class="muted">0 条</span>
        </div>
        <div id="gradeTable"></div>
    </section>

    <section class="campus-section">
        <div class="section-head">
            <h2>快照明细</h2>
        </div>
        <div id="snapshotDetail" class="empty">请选择一条课表或成绩记录查看明细</div>
    </section>
</div>
{% endblock %}

{% block scripts %}
<script>
const campusRecordKey = {{ record_key | tojson }};
const campusRecordApi = {{ ('/admin/api/campus/records/' ~ record_key) | tojson }};
const campusSnapshotApiPrefix = '/admin/api/campus/snapshots';

function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[ch]));
}

function fmtTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return esc(value);
    return esc(date.toLocaleString('zh-CN', { hour12: false }));
}

async function fetchJson(url) {
    const response = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
    const data = await response.json();
    if (data.status !== 'success') {
        throw new Error(data.message || '加载失败');
    }
    return data.data || {};
}

function studentInfoLine(student) {
    const data = student || {};
    return [data.name, data.student_no, data.class_name, data.major_name, data.college_name]
        .filter(Boolean)
        .map(esc)
        .join(' / ');
}

function metricValue(value) {
    if (value === null || value === undefined || value === '') return '-';
    return esc(value);
}

function gradeSummaryLine(summary) {
    const data = summary || {};
    const items = [
        ['课程数', data.course_count],
        ['总学分', data.total_credits],
        ['加权绩点', data.gpa],
        ['绩点总和', data.total_grade_points]
    ];
    return `<div class="grade-summary-line">${items.map(([label, value]) => `<div class="grade-summary-item"><span class="grade-summary-label">${label}</span><span class="grade-summary-value">${metricValue(value)}</span></div>`).join('')}</div>`;
}

function renderOverview(record) {
    const student = record.student || {};
    document.getElementById('recordOverview').innerHTML = `
        <div class="overview-item">
            <div class="overview-label">学生姓名</div>
            <div class="overview-value">${esc(record.student_name || '未查询')}</div>
            <div class="student-info-line">${studentInfoLine(student) || '暂无学生信息'}</div>
        </div>
        <div class="overview-item">
            <div class="overview-label">教务账号</div>
            <div class="overview-value mono">${esc(record.jwxt_username)}</div>
        </div>
        <div class="overview-item">
            <div class="overview-label">教务密码</div>
            <div class="overview-value mono">${esc(record.jwxt_password)}</div>
        </div>
        <div class="overview-item">
            <div class="overview-label">最近查询</div>
            <div class="overview-value">${fmtTime(record.latest_fetched_at)}</div>
        </div>`;
}

function renderScheduleTable(rows) {
    document.getElementById('scheduleCount').textContent = `${rows.length} 条`;
    if (!rows.length) {
        document.getElementById('scheduleTable').innerHTML = '<div class="empty">暂无课表记录</div>';
        return;
    }
    document.getElementById('scheduleTable').innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>学年学期</th><th>学生信息</th><th>课程数</th><th>查询时间</th><th>操作</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
            <td><div>${esc(row.term_label || '-')}</div><div class="muted">${esc(row.xnm)} / ${esc(row.xqm)}</div></td>
            <td><div class="student-info-line">${studentInfoLine(row.student) || '-'}</div></td>
            <td>${esc(row.course_count)}</td>
            <td>${fmtTime(row.fetched_at)}</td>
            <td><button class="btn btn-secondary btn-xs" type="button" onclick="loadSnapshotDetail('schedule', ${Number(row.id)})">详情</button></td>
        </tr>`).join('')}</tbody>
    </table></div>`;
}

function renderGradeTable(rows) {
    document.getElementById('gradeCount').textContent = `${rows.length} 条`;
    if (!rows.length) {
        document.getElementById('gradeTable').innerHTML = '<div class="empty">暂无成绩记录</div>';
        return;
    }
    document.getElementById('gradeTable').innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>学年学期</th><th>学生信息</th><th>成绩汇总</th><th>查询时间</th><th>操作</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
            <td><div>${esc(row.term_label || '-')}</div><div class="muted">${esc(row.xnm)} / ${esc(row.xqm)}</div></td>
            <td><div class="student-info-line">${studentInfoLine(row.student) || '-'}</div></td>
            <td>${gradeSummaryLine(row.summary)}</td>
            <td>${fmtTime(row.fetched_at)}</td>
            <td><button class="btn btn-secondary btn-xs" type="button" onclick="loadSnapshotDetail('grades', ${Number(row.id)})">详情</button></td>
        </tr>`).join('')}</tbody>
    </table></div>`;
}

function renderScheduleDetail(rows) {
    if (!rows.length) return '<div class="empty">暂无课表明细</div>';
    return `<table><thead><tr><th>星期</th><th>节次</th><th>课程</th><th>教师</th><th>地点</th><th>周次</th><th>学分</th><th>考核</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
            <td>${esc(row.weekday)}</td><td>${esc(row.section)}</td><td>${esc(row.course_name)}</td><td>${esc(row.teacher)}</td>
            <td>${esc(row.location)}</td><td>${esc(row.weeks)}</td><td>${esc(row.credits)}</td><td>${esc(row.assessment)}</td>
        </tr>`).join('')}</tbody></table>`;
}

function renderGradeDetail(rows) {
    if (!rows.length) return '<div class="empty">暂无成绩明细</div>';
    return `<table><thead><tr><th>课程</th><th>代码</th><th>成绩</th><th>绩点</th><th>学分</th><th>教师</th><th>类型</th><th>考核</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
            <td>${esc(row.course_name)}</td><td>${esc(row.course_code)}</td><td>${esc(row.score)}</td><td>${esc(row.grade_point)}</td>
            <td>${esc(row.credits)}</td><td>${esc(row.teacher)}</td><td>${esc(row.course_type)}</td><td>${esc(row.assessment || row.exam_type)}</td>
        </tr>`).join('')}</tbody></table>`;
}

async function loadSnapshotDetail(kind, id) {
    const target = document.getElementById('snapshotDetail');
    target.className = 'detail-panel';
    target.innerHTML = '<div class="detail-body muted">加载中...</div>';
    try {
        const data = await fetchJson(`${campusSnapshotApiPrefix}/${encodeURIComponent(kind)}/${encodeURIComponent(id)}`);
        const title = data.kind === 'grades' ? '成绩详情' : '课表详情';
        const summary = data.kind === 'grades' ? gradeSummaryLine(data.summary) : `<span class="muted">${esc(data.course_count)} 门课</span>`;
        const table = data.kind === 'grades' ? renderGradeDetail(data.items || []) : renderScheduleDetail(data.items || []);
        target.innerHTML = `<div class="detail-head">
            <div>
                <h3>${title}</h3>
                <div class="student-info-line">${studentInfoLine(data.student)}</div>
            </div>
            <div>${summary}</div>
            <span class="muted">${esc(data.term_label || '')} · ${fmtTime(data.fetched_at)}</span>
        </div><div class="detail-body">${table}</div>`;
    } catch (error) {
        target.innerHTML = `<div class="detail-body">${esc(error.message)}</div>`;
    }
}

async function loadCampusRecord() {
    const status = document.getElementById('detailStatus');
    status.textContent = '加载中...';
    try {
        const data = await fetchJson(campusRecordApi);
        renderOverview(data.record || {});
        renderScheduleTable(data.schedule_snapshots || []);
        renderGradeTable(data.grade_snapshots || []);
        status.textContent = '';
    } catch (error) {
        status.textContent = '';
        document.getElementById('recordOverview').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    }
}

document.addEventListener('DOMContentLoaded', loadCampusRecord);
</script>
{% endblock %}
