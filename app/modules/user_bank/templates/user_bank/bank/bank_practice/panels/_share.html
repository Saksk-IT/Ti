    <div id="pageTabShare" data-tab-panel="share" hidden>
      <section class="card" aria-label="分享">
        <h2>分享</h2>
        <div class="sub">
          {% if access_type == 'owner' %}
            快速分享链接；分享码/权限/有效期等请前往「管理 → 分享」。
          {% else %}
            仅创建者可创建分享码；你可复制题库链接进行分享。
          {% endif %}
        </div>
        <div class="search" style="grid-template-columns: 1fr auto; margin-top: 10px;">
          <input id="shareUrl" type="text" readonly />
          <button class="btn primary" type="button" onclick="copyShareUrl()">复制链接</button>
        </div>
        <div class="links">
          <button class="link" type="button" onclick="nativeShare()">系统分享</button>
        </div>
      </section>
    </div>
