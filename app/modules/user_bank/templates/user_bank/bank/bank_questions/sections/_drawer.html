<!-- Edit/Add Drawer -->
<div id="drawer" class="drawer">
    <div class="drawer-header">
        <span id="drawer-title">新增题目</span>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>
    <div class="drawer-body">
        <input type="hidden" id="editingId">
        <div class="form-group">
            <label>题型</label>
            <select id="qType" onchange="handleQuestionTypeChange()" title="题型">
                <option value="选择题">选择题</option>
                <option value="多选题">多选题</option>
                <option value="填空题">填空题</option>
                <option value="判断题">判断题</option>
                <option value="简答题">简答题</option>
            </select>
        </div>
        <div class="form-group">
            <label>难度 (1-5)</label>
            <input type="number" id="qDifficulty" min="1" max="5" value="3" title="难度">
        </div>
        <div class="form-group">
            <label>题干</label>
            <textarea id="qContent" rows="5" oninput="updatePreview()" placeholder="请输入题干内容"></textarea>
        </div>
        <div class="form-group" id="optionsGroup">
            <label>选项</label>
            <div id="optionsContainer" style="display: flex; flex-direction: column; gap: 12px;">
            </div>
            <button type="button" class="btn-secondary" onclick="addOption()" style="margin-top: 12px; width: 100%;">
                + 添加选项
            </button>
        </div>
        <div class="form-group">
            <label>答案</label>
            <div id="answer-container">
                <input type="text" id="qAnswer" placeholder="请输入答案">
            </div>
        </div>
        <div class="form-group">
            <label>解析</label>
            <textarea id="qExplanation" rows="3" placeholder="请输入解析（可选）"></textarea>
        </div>
        <div class="preview-box">
            <h4>预览</h4>
            <div id="previewContent" class="q-content"></div>
            <div id="previewOptions" class="options"></div>
        </div>
    </div>
    <div class="drawer-footer">
        <button class="btn-secondary" onclick="closeDrawer()">取消</button>
        <button class="btn-primary" onclick="saveQuestion()">保存</button>
    </div>
</div>
