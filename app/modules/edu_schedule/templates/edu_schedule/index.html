{% extends "main/shared/app_shell.html" %}

{% block title %}教务课表 - SAK{% endblock %}
{% block page_title %}教务课表{% endblock %}

{% block content %}
<section class="schedule-page">
  <div class="schedule-toolbar">
    <form id="scheduleForm" class="schedule-form" autocomplete="off">
      <div class="field-group term-fields">
        <label>
          <span>学年</span>
          <select id="scheduleAcademicYear">
            {% for option in academic_year_options %}
            <option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          <span>学期</span>
          <select id="scheduleSemester">
            <option value="all">第一、二学期</option>
            <option value="3">第一学期</option>
            <option value="12" selected>第二学期</option>
          </select>
        </label>
      </div>

      <div class="schedule-actions">
        <button class="primary-btn" type="submit" id="scheduleSubmit">查询</button>
        <a class="ghost-btn" href="/settings/account/bindings">账号绑定</a>
      </div>
    </form>
  </div>

  <div class="schedule-state" id="scheduleState" role="status"></div>
  <div class="webvpn-captcha-overlay" id="webvpnCaptchaDialog" role="dialog" aria-modal="true" aria-labelledby="webvpnCaptchaTitle" hidden>
    <div class="webvpn-captcha-modal">
      <div class="webvpn-captcha-head">
        <h2 id="webvpnCaptchaTitle">刷新校园网络登录态</h2>
        <button type="button" class="webvpn-captcha-close" id="closeWebvpnCaptcha" aria-label="关闭">×</button>
      </div>
      <div class="webvpn-captcha-body">
        <p id="webvpnCaptchaMessage">WebVPN 登录态失效，请输入验证码后继续查询。</p>
        <img id="webvpnCaptchaImage" class="webvpn-captcha-image" alt="WebVPN 验证码">
        <input type="text" id="webvpnCaptchaCode" class="webvpn-captcha-input" placeholder="输入验证码" maxlength="10" autocomplete="off">
      </div>
      <div class="webvpn-captcha-actions">
        <button type="button" class="ghost-btn" id="cancelWebvpnCaptcha">取消</button>
        <button type="button" class="primary-btn" id="submitWebvpnCaptcha">提交并继续查询</button>
      </div>
    </div>
  </div>
  <div class="schedule-results" id="scheduleResults"></div>
</section>

<style>
  .schedule-page {
    width: min(1180px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 24px 0 44px;
    display: grid;
    gap: 18px;
  }
  .schedule-toolbar {
    border: 1px solid var(--app-border);
    background: var(--app-surface);
    border-radius: 8px;
    box-shadow: var(--app-shadow-soft);
    padding: 16px;
  }
  .schedule-form {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto;
    gap: 14px;
    align-items: end;
  }
  .field-group {
    display: grid;
    gap: 10px;
  }
  .term-fields {
    grid-template-columns: repeat(2, minmax(120px, 1fr));
  }
  .schedule-form label {
    display: grid;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: var(--app-muted);
  }
  .schedule-form select {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--app-border);
    border-radius: 8px;
    padding: 0 10px;
    background: var(--app-surface-2);
    color: var(--app-text);
    font-size: 14px;
  }
  .schedule-actions {
    display: inline-flex;
    gap: 10px;
    justify-content: flex-end;
    align-items: center;
  }
  .primary-btn,
  .ghost-btn {
    min-height: 40px;
    border-radius: 8px;
    padding: 0 16px;
    border: 1px solid var(--app-border);
    font-weight: 850;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .primary-btn {
    background: var(--app-primary);
    color: var(--app-primary-contrast);
    border-color: var(--app-primary);
  }
  .ghost-btn {
    background: transparent;
    color: var(--app-text);
  }
  .schedule-state {
    min-height: 22px;
    color: var(--app-muted);
    font-size: 13px;
  }
  .schedule-state.error { color: #dc2626; }
  .schedule-results {
    display: grid;
    gap: 18px;
  }
  .webvpn-captcha-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(15, 23, 42, 0.42);
  }
  .webvpn-captcha-overlay[hidden] {
    display: none;
  }
  .webvpn-captcha-modal {
    width: min(420px, calc(100vw - 36px));
    border: 1px solid var(--app-border);
    border-radius: 8px;
    background: var(--app-surface);
    box-shadow: var(--app-shadow-soft);
    padding: 16px;
    display: grid;
    gap: 14px;
  }
  .webvpn-captcha-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .webvpn-captcha-head h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0;
  }
  .webvpn-captcha-close {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--app-border);
    background: var(--app-surface-2);
    color: var(--app-text);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
  }
  .webvpn-captcha-body {
    display: grid;
    gap: 10px;
  }
  .webvpn-captcha-body p {
    margin: 0;
    color: var(--app-muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .webvpn-captcha-image {
    width: 160px;
    height: 54px;
    object-fit: contain;
    border: 1px solid var(--app-border);
    border-radius: 8px;
    background: #fff;
  }
  .webvpn-captcha-input {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--app-border);
    border-radius: 8px;
    padding: 0 10px;
    background: var(--app-surface-2);
    color: var(--app-text);
    font-size: 14px;
  }
  .webvpn-captcha-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-wrap: wrap;
  }
  .term-panel {
    border: 1px solid var(--app-border);
    border-radius: 8px;
    background: var(--app-surface);
    box-shadow: var(--app-shadow-soft);
    overflow: hidden;
  }
  .term-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--app-border);
  }
  .term-title {
    font-size: 18px;
    font-weight: 900;
  }
  .term-meta {
    font-size: 13px;
    color: var(--app-muted);
  }
  .schedule-table-wrap {
    overflow-x: auto;
  }
  .schedule-table {
    width: 100%;
    min-width: 820px;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .schedule-table th,
  .schedule-table td {
    border-bottom: 1px solid var(--app-border);
    border-right: 1px solid var(--app-border);
    vertical-align: top;
    padding: 10px;
  }
  .schedule-table th:last-child,
  .schedule-table td:last-child {
    border-right: 0;
  }
  .schedule-table th {
    width: 13%;
    background: var(--app-surface-2);
    font-size: 13px;
    text-align: left;
  }
  .schedule-table th:first-child {
    width: 90px;
  }
  .section-label {
    font-weight: 900;
    color: var(--app-muted);
  }
  .course-chip {
    display: grid;
    gap: 4px;
    padding: 8px;
    border-radius: 8px;
    background: var(--app-primary-soft);
    margin-bottom: 8px;
  }
  .course-name {
    font-size: 13px;
    font-weight: 900;
  }
  .course-detail {
    font-size: 12px;
    color: var(--app-muted);
    line-height: 1.45;
  }
  .practice-list {
    display: grid;
    gap: 8px;
    padding: 14px 16px;
  }
  .practice-title {
    font-size: 13px;
    font-weight: 900;
    color: var(--app-muted);
  }
  @media (max-width: 980px) {
    .schedule-form {
      grid-template-columns: 1fr;
    }
    .schedule-actions {
      justify-content: flex-start;
      flex-wrap: wrap;
    }
  }
  @media (max-width: 640px) {
    .schedule-page {
      width: min(100vw - 20px, 1180px);
      padding-top: 12px;
    }
    .schedule-toolbar {
      padding: 12px;
    }
    .term-fields {
      grid-template-columns: 1fr;
    }
    .term-head {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
{% endblock %}

{% block body_end %}
<script>
(function () {
  const days = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
  const sections = ['1-2节', '3-4节', '5-6节', '7-8节', '9-10节', '11-12节'];
  const form = document.getElementById('scheduleForm');
  const state = document.getElementById('scheduleState');
  const results = document.getElementById('scheduleResults');
  const submitBtn = document.getElementById('scheduleSubmit');
  const webvpnCaptchaDialog = document.getElementById('webvpnCaptchaDialog');
  const webvpnCaptchaImage = document.getElementById('webvpnCaptchaImage');
  const webvpnCaptchaCode = document.getElementById('webvpnCaptchaCode');
  const webvpnCaptchaMessage = document.getElementById('webvpnCaptchaMessage');
  const submitWebvpnCaptcha = document.getElementById('submitWebvpnCaptcha');
  const cancelWebvpnCaptcha = document.getElementById('cancelWebvpnCaptcha');
  const closeWebvpnCaptcha = document.getElementById('closeWebvpnCaptcha');
  let credentialReady = false;
  let credentialPromptShown = false;
  let webvpnChallengeId = '';
  let pendingQueryPayload = null;
  let activeTaskTimer = null;

  function setState(text, type) {
    state.textContent = text || '';
    state.className = type ? 'schedule-state ' + type : 'schedule-state';
  }

  function buildTerms() {
    const academicYear = Number(document.getElementById('scheduleAcademicYear').value || 0);
    const semester = document.getElementById('scheduleSemester').value;
    const terms = [];
    if (!Number.isInteger(academicYear) || academicYear < 2000 || academicYear > 2100) {
      throw new Error('学年不正确');
    }
    const semesters = semester === 'all' ? ['3', '12'] : [semester];
    semesters.forEach(function (xqm) { terms.push({ xnm: String(academicYear), xqm: xqm }); });
    if (terms.length > 12) {
      throw new Error('一次最多查询 12 个学期');
    }
    return terms;
  }

  function appendText(parent, className, text) {
    const el = document.createElement('div');
    el.className = className;
    el.textContent = text || '';
    parent.appendChild(el);
    return el;
  }

  function courseNode(course) {
    const wrap = document.createElement('div');
    wrap.className = 'course-chip';
    appendText(wrap, 'course-name', course.course_name || '-');
    const detail = [
      course.teacher,
      course.location,
      course.weeks,
      course.assessment ? ('考核：' + course.assessment) : ''
    ].filter(Boolean).join(' / ');
    appendText(wrap, 'course-detail', detail);
    return wrap;
  }

  function renderResult(item) {
    const panel = document.createElement('article');
    panel.className = 'term-panel';

    const head = document.createElement('div');
    head.className = 'term-head';
    appendText(head, 'term-title', (item.term && item.term.label) || '课表');
    const meta = item.student || {};
    appendText(head, 'term-meta', [meta.name, meta.class_name, meta.major_name].filter(Boolean).join(' / '));
    panel.appendChild(head);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'schedule-table-wrap';
    const table = document.createElement('table');
    table.className = 'schedule-table';
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    ['节次'].concat(days).forEach(function (name) {
      const th = document.createElement('th');
      th.textContent = name;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    sections.forEach(function (section) {
      const tr = document.createElement('tr');
      const first = document.createElement('td');
      first.className = 'section-label';
      first.textContent = section;
      tr.appendChild(first);
      days.forEach(function (day) {
        const td = document.createElement('td');
        const list = item.week_table && item.week_table[day] && item.week_table[day][section];
        (list || []).forEach(function (course) { td.appendChild(courseNode(course)); });
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    panel.appendChild(tableWrap);

    if (Array.isArray(item.practice_courses) && item.practice_courses.length) {
      const practice = document.createElement('div');
      practice.className = 'practice-list';
      appendText(practice, 'practice-title', '集中实践');
      item.practice_courses.forEach(function (course) { practice.appendChild(courseNode(course)); });
      panel.appendChild(practice);
    }
    return panel;
  }

  function renderResults(items) {
    results.replaceChildren();
    (items || []).forEach(function (item) {
      results.appendChild(renderResult(item));
    });
  }

  function stopTaskPolling() {
    if (activeTaskTimer) {
      clearTimeout(activeTaskTimer);
      activeTaskTimer = null;
    }
  }

  function renderTaskFallback(task) {
    const items = task && Array.isArray(task.results) ? task.results : [];
    if (items.length) {
      renderResults(items);
      return true;
    }
    const snapshots = task && Array.isArray(task.snapshots) ? task.snapshots : [];
    if (snapshots.length) {
      renderResults(snapshots.map(function (item) { return item.payload; }));
      return true;
    }
    return false;
  }

  function handleTaskState(task, payload) {
    if (!task) {
      throw new Error('查询任务状态不正确');
    }
    if (task.status === 'webvpn_refresh_required') {
      stopTaskPolling();
      showWebvpnCaptcha({
        message: task.message || 'WebVPN 登录态失效，请输入验证码后继续查询。',
        data: task.challenge || {}
      }, payload);
      return true;
    }
    if (task.status === 'succeeded') {
      stopTaskPolling();
      renderResults(task.results || []);
      setState('查询完成', '');
      return true;
    }
    if (task.status === 'failed') {
      stopTaskPolling();
      const hasFallback = renderTaskFallback(task);
      setState(task.message || '教务系统繁忙，请稍后重试', hasFallback ? '' : 'error');
      return true;
    }
    const hasFallback = renderTaskFallback(task);
    const suffix = hasFallback ? '，当前显示上次成功结果' : '';
    setState((task.message || '正在后台查询课表') + suffix, '');
    return false;
  }

  async function pollEduQueryTask(taskId, payload) {
    stopTaskPolling();
    const poll = async function () {
      const response = await fetch('/api/edu-schedule/query-tasks/' + encodeURIComponent(taskId), {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      const data = await response.json();
      if (data.status !== 'success') {
        throw new Error(data.message || '查询任务状态获取失败');
      }
      const task = data.data && data.data.task;
      if (!handleTaskState(task, payload)) {
        activeTaskTimer = setTimeout(function () {
          poll().catch(function (error) {
            stopTaskPolling();
            setState(error.message || '查询任务状态获取失败', 'error');
          });
        }, 2000);
      }
    };
    await poll();
  }

  function hideWebvpnCaptcha() {
    webvpnCaptchaDialog.hidden = true;
    webvpnCaptchaCode.value = '';
    webvpnChallengeId = '';
  }

  function showWebvpnCaptcha(data, payload) {
    const challenge = data && data.data ? data.data : {};
    webvpnChallengeId = challenge.challenge_id || '';
    pendingQueryPayload = payload;
    webvpnCaptchaImage.src = challenge.captcha_image || '';
    webvpnCaptchaMessage.textContent = data.message || 'WebVPN 登录态失效，请输入验证码后继续查询。';
    webvpnCaptchaDialog.hidden = false;
    webvpnCaptchaCode.value = '';
    webvpnCaptchaCode.focus();
  }

  async function submitQueryAfterWebvpnRefresh(payload) {
    stopTaskPolling();
    const response = await fetch('/api/edu-schedule/query', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (data.status !== 'success') {
      if (data.error_code === 'WEBVPN_REFRESH_REQUIRED') {
        showWebvpnCaptcha(data, payload);
        return;
      }
      throw new Error(data.message || '查询失败');
    }
    const task = data.data && data.data.task;
    if (task && task.task_id) {
      handleTaskState(task, payload);
      if (task.status !== 'succeeded' && task.status !== 'failed' && task.status !== 'webvpn_refresh_required') {
        await pollEduQueryTask(task.task_id, payload);
      }
      return;
    }
    renderResults(data.data && data.data.results);
    setState('查询完成', '');
  }

  async function showBindPrompt() {
    if (credentialPromptShown) return;
    credentialPromptShown = true;
    const message = '未绑定教务系统账号，请先到账号绑定页绑定后再查询课表。';
    if (window.appConfirm) {
      const ok = await window.appConfirm(message);
      if (ok) window.location.href = '/settings/account/bindings';
      return;
    }
    if (window.confirm(message)) window.location.href = '/settings/account/bindings';
  }

  async function loadStatus() {
    try {
      const response = await fetch('/api/edu-schedule/status', {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      const data = await response.json();
      if (data.status !== 'success') return;
      const credential = data.data && data.data.credential;
      const snapshots = data.data && data.data.snapshots;
      if (credential && credential.has_credentials) {
        credentialReady = true;
        setState('已绑定教务系统账号：' + credential.username_hint, '');
      } else {
        credentialReady = false;
        setState('未绑定教务系统账号，请先绑定后查询。', 'error');
        showBindPrompt();
      }
      if (Array.isArray(snapshots) && snapshots.length) {
        renderResults(snapshots.map(function (item) { return item.payload; }));
      }
    } catch (error) {
      setState('', '');
    }
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '提交中';
    setState('正在提交后台查询任务...', '');
    try {
      if (!credentialReady) {
        setState('未绑定教务系统账号，请先绑定后查询。', 'error');
        showBindPrompt();
        return;
      }
      const payload = {
        terms: buildTerms()
      };
      await submitQueryAfterWebvpnRefresh(payload);
    } catch (error) {
      setState(error.message || '查询失败', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '查询';
    }
  });

  submitWebvpnCaptcha.addEventListener('click', async function () {
    const captchaCode = webvpnCaptchaCode.value.trim();
    if (!webvpnChallengeId || !captchaCode) {
      setState('请输入 WebVPN 验证码', 'error');
      return;
    }
    submitWebvpnCaptcha.disabled = true;
    setState('正在刷新 WebVPN 登录态...', '');
    try {
      const response = await fetch('/api/edu-schedule/webvpn-session/complete', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify({
          challenge_id: webvpnChallengeId,
          captcha_code: captchaCode
        })
      });
      const data = await response.json();
      if (data.status !== 'success') {
        throw new Error(data.message || '刷新 WebVPN 登录态失败');
      }
      const payload = pendingQueryPayload;
      hideWebvpnCaptcha();
      if (payload) {
        await submitQueryAfterWebvpnRefresh(payload);
      }
    } catch (error) {
      setState(error.message || '刷新 WebVPN 登录态失败', 'error');
    } finally {
      submitWebvpnCaptcha.disabled = false;
      submitBtn.disabled = false;
      submitBtn.textContent = '查询';
    }
  });

  cancelWebvpnCaptcha.addEventListener('click', hideWebvpnCaptcha);
  closeWebvpnCaptcha.addEventListener('click', hideWebvpnCaptcha);

  loadStatus();
})();
</script>
{% endblock %}
