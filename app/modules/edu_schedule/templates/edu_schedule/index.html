{% extends "main/shared/app_shell.html" %}

{% block title %}教务课表 - SAK{% endblock %}
{% block page_title %}教务课表{% endblock %}

{% block content %}
<section class="schedule-page">
  <div class="schedule-toolbar">
    <form id="scheduleForm" class="schedule-form" autocomplete="off">
      <div class="field-group account-fields">
        <label>
          <span>教务账号</span>
          <input id="scheduleUsername" name="username" type="text" inputmode="text" autocomplete="username" maxlength="64" placeholder="学号/工号">
        </label>
        <label>
          <span>教务密码</span>
          <input id="schedulePassword" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="教务系统密码">
        </label>
        <label class="checkbox-field">
          <input id="scheduleRemember" type="checkbox">
          <span>加密保存</span>
        </label>
      </div>

      <div class="field-group term-fields">
        <label>
          <span>开始学年</span>
          <input id="scheduleStartYear" type="number" min="2000" max="2100" step="1" value="2025">
        </label>
        <label>
          <span>结束学年</span>
          <input id="scheduleEndYear" type="number" min="2000" max="2100" step="1" value="2025">
        </label>
        <label>
          <span>学期</span>
          <select id="scheduleSemester">
            <option value="all">第一、二学期</option>
            <option value="3">第一学期</option>
            <option value="12" selected>第二学期</option>
          </select>
        </label>
      </div>

      <div class="schedule-actions">
        <button class="primary-btn" type="submit" id="scheduleSubmit">查询</button>
        <button class="ghost-btn" type="button" id="scheduleClearCredential">删除凭据</button>
      </div>
    </form>
  </div>

  <div class="schedule-state" id="scheduleState" role="status"></div>
  <div class="schedule-results" id="scheduleResults"></div>
</section>

<style>
  .schedule-page {
    width: min(1180px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 24px 0 44px;
    display: grid;
    gap: 18px;
  }
  .schedule-toolbar {
    border: 1px solid var(--app-border);
    background: var(--app-surface);
    border-radius: 8px;
    box-shadow: var(--app-shadow-soft);
    padding: 16px;
  }
  .schedule-form {
    display: grid;
    grid-template-columns: minmax(260px, 1.2fr) minmax(260px, 1fr) auto;
    gap: 14px;
    align-items: end;
  }
  .field-group {
    display: grid;
    gap: 10px;
  }
  .account-fields {
    grid-template-columns: minmax(120px, 1fr) minmax(150px, 1fr) auto;
    align-items: end;
  }
  .term-fields {
    grid-template-columns: repeat(3, minmax(92px, 1fr));
  }
  .schedule-form label {
    display: grid;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: var(--app-muted);
  }
  .schedule-form input,
  .schedule-form select {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--app-border);
    border-radius: 8px;
    padding: 0 10px;
    background: var(--app-surface-2);
    color: var(--app-text);
    font-size: 14px;
  }
  .checkbox-field {
    min-height: 40px;
    display: inline-flex !important;
    grid-template-columns: auto auto;
    align-items: center;
    justify-content: center;
    gap: 8px !important;
    padding: 0 10px;
    border: 1px solid var(--app-border);
    border-radius: 8px;
    color: var(--app-text) !important;
    background: var(--app-surface-2);
  }
  .checkbox-field input {
    width: 16px;
    min-height: 16px;
    padding: 0;
  }
  .schedule-actions {
    display: inline-flex;
    gap: 10px;
    justify-content: flex-end;
    align-items: center;
  }
  .primary-btn,
  .ghost-btn {
    min-height: 40px;
    border-radius: 8px;
    padding: 0 16px;
    border: 1px solid var(--app-border);
    font-weight: 850;
    cursor: pointer;
    white-space: nowrap;
  }
  .primary-btn {
    background: var(--app-primary);
    color: var(--app-primary-contrast);
    border-color: var(--app-primary);
  }
  .ghost-btn {
    background: transparent;
    color: var(--app-text);
  }
  .schedule-state {
    min-height: 22px;
    color: var(--app-muted);
    font-size: 13px;
  }
  .schedule-state.error { color: #dc2626; }
  .schedule-results {
    display: grid;
    gap: 18px;
  }
  .term-panel {
    border: 1px solid var(--app-border);
    border-radius: 8px;
    background: var(--app-surface);
    box-shadow: var(--app-shadow-soft);
    overflow: hidden;
  }
  .term-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--app-border);
  }
  .term-title {
    font-size: 18px;
    font-weight: 900;
  }
  .term-meta {
    font-size: 13px;
    color: var(--app-muted);
  }
  .schedule-table-wrap {
    overflow-x: auto;
  }
  .schedule-table {
    width: 100%;
    min-width: 820px;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .schedule-table th,
  .schedule-table td {
    border-bottom: 1px solid var(--app-border);
    border-right: 1px solid var(--app-border);
    vertical-align: top;
    padding: 10px;
  }
  .schedule-table th:last-child,
  .schedule-table td:last-child {
    border-right: 0;
  }
  .schedule-table th {
    width: 13%;
    background: var(--app-surface-2);
    font-size: 13px;
    text-align: left;
  }
  .schedule-table th:first-child {
    width: 90px;
  }
  .section-label {
    font-weight: 900;
    color: var(--app-muted);
  }
  .course-chip {
    display: grid;
    gap: 4px;
    padding: 8px;
    border-radius: 8px;
    background: var(--app-primary-soft);
    margin-bottom: 8px;
  }
  .course-name {
    font-size: 13px;
    font-weight: 900;
  }
  .course-detail {
    font-size: 12px;
    color: var(--app-muted);
    line-height: 1.45;
  }
  .practice-list {
    display: grid;
    gap: 8px;
    padding: 14px 16px;
  }
  .practice-title {
    font-size: 13px;
    font-weight: 900;
    color: var(--app-muted);
  }
  @media (max-width: 980px) {
    .schedule-form {
      grid-template-columns: 1fr;
    }
    .schedule-actions {
      justify-content: flex-start;
      flex-wrap: wrap;
    }
  }
  @media (max-width: 640px) {
    .schedule-page {
      width: min(100vw - 20px, 1180px);
      padding-top: 12px;
    }
    .schedule-toolbar {
      padding: 12px;
    }
    .account-fields,
    .term-fields {
      grid-template-columns: 1fr;
    }
    .term-head {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
{% endblock %}

{% block body_end %}
<script>
(function () {
  const days = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
  const sections = ['1-2节', '3-4节', '5-6节', '7-8节', '9-10节', '11-12节'];
  const form = document.getElementById('scheduleForm');
  const state = document.getElementById('scheduleState');
  const results = document.getElementById('scheduleResults');
  const submitBtn = document.getElementById('scheduleSubmit');
  const clearBtn = document.getElementById('scheduleClearCredential');

  function setState(text, type) {
    state.textContent = text || '';
    state.className = type ? 'schedule-state ' + type : 'schedule-state';
  }

  function buildTerms() {
    const start = Number(document.getElementById('scheduleStartYear').value || 0);
    const end = Number(document.getElementById('scheduleEndYear').value || 0);
    const semester = document.getElementById('scheduleSemester').value;
    const terms = [];
    if (!Number.isInteger(start) || !Number.isInteger(end) || start < 2000 || end > 2100 || start > end) {
      throw new Error('学年范围不正确');
    }
    const semesters = semester === 'all' ? ['3', '12'] : [semester];
    for (let year = start; year <= end; year += 1) {
      semesters.forEach(function (xqm) { terms.push({ xnm: String(year), xqm: xqm }); });
    }
    if (terms.length > 12) {
      throw new Error('一次最多查询 12 个学期');
    }
    return terms;
  }

  function appendText(parent, className, text) {
    const el = document.createElement('div');
    el.className = className;
    el.textContent = text || '';
    parent.appendChild(el);
    return el;
  }

  function courseNode(course) {
    const wrap = document.createElement('div');
    wrap.className = 'course-chip';
    appendText(wrap, 'course-name', course.course_name || '-');
    const detail = [
      course.teacher,
      course.location,
      course.weeks,
      course.assessment ? ('考核：' + course.assessment) : ''
    ].filter(Boolean).join(' / ');
    appendText(wrap, 'course-detail', detail);
    return wrap;
  }

  function renderResult(item) {
    const panel = document.createElement('article');
    panel.className = 'term-panel';

    const head = document.createElement('div');
    head.className = 'term-head';
    appendText(head, 'term-title', (item.term && item.term.label) || '课表');
    const meta = item.student || {};
    appendText(head, 'term-meta', [meta.name, meta.class_name, meta.major_name].filter(Boolean).join(' / '));
    panel.appendChild(head);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'schedule-table-wrap';
    const table = document.createElement('table');
    table.className = 'schedule-table';
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    ['节次'].concat(days).forEach(function (name) {
      const th = document.createElement('th');
      th.textContent = name;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    sections.forEach(function (section) {
      const tr = document.createElement('tr');
      const first = document.createElement('td');
      first.className = 'section-label';
      first.textContent = section;
      tr.appendChild(first);
      days.forEach(function (day) {
        const td = document.createElement('td');
        const list = item.week_table && item.week_table[day] && item.week_table[day][section];
        (list || []).forEach(function (course) { td.appendChild(courseNode(course)); });
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    panel.appendChild(tableWrap);

    if (Array.isArray(item.practice_courses) && item.practice_courses.length) {
      const practice = document.createElement('div');
      practice.className = 'practice-list';
      appendText(practice, 'practice-title', '集中实践');
      item.practice_courses.forEach(function (course) { practice.appendChild(courseNode(course)); });
      panel.appendChild(practice);
    }
    return panel;
  }

  function renderResults(items) {
    results.replaceChildren();
    (items || []).forEach(function (item) {
      results.appendChild(renderResult(item));
    });
  }

  async function loadStatus() {
    try {
      const response = await fetch('/api/edu-schedule/status', {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      const data = await response.json();
      if (data.status !== 'success') return;
      const credential = data.data && data.data.credential;
      const snapshots = data.data && data.data.snapshots;
      if (credential && credential.has_credentials) {
        setState('已保存教务凭据：' + credential.username_hint, '');
      }
      if (Array.isArray(snapshots) && snapshots.length) {
        renderResults(snapshots.map(function (item) { return item.payload; }));
      }
    } catch (error) {
      setState('', '');
    }
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '查询中';
    setState('正在查询课表...', '');
    try {
      const payload = {
        terms: buildTerms(),
        username: document.getElementById('scheduleUsername').value.trim() || undefined,
        password: document.getElementById('schedulePassword').value || undefined,
        remember: document.getElementById('scheduleRemember').checked
      };
      const response = await fetch('/api/edu-schedule/query', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (data.status !== 'success') {
        throw new Error(data.message || '查询失败');
      }
      renderResults(data.data && data.data.results);
      setState('查询完成', '');
      document.getElementById('schedulePassword').value = '';
    } catch (error) {
      setState(error.message || '查询失败', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '查询';
    }
  });

  clearBtn.addEventListener('click', async function () {
    if (!window.confirm('确认删除已保存的教务凭据？')) return;
    const response = await fetch('/api/edu-schedule/credentials', {
      method: 'DELETE',
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    });
    const data = await response.json();
    if (data.status === 'success') {
      setState('已删除保存的教务凭据', '');
    } else {
      setState(data.message || '删除失败', 'error');
    }
  });

  loadStatus();
})();
</script>
{% endblock %}
