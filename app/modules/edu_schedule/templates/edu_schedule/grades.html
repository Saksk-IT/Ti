{% extends "main/shared/app_shell.html" %}

{% block title %}成绩查询 - SAK{% endblock %}
{% block page_title %}成绩查询{% endblock %}

{% block content %}
<section class="grade-page">
  <div class="grade-toolbar">
    <form id="gradeForm" class="grade-form" autocomplete="off">
      <div class="field-group term-fields">
        <label>
          <span>学年</span>
          <select id="gradeAcademicYear">
            {% for option in academic_year_options %}
            <option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          <span>学期</span>
          <select id="gradeSemester">
            <option value="all">第一、二学期</option>
            <option value="3" selected>第一学期</option>
            <option value="12">第二学期</option>
          </select>
        </label>
      </div>

      <div class="grade-actions">
        <button class="primary-btn" type="submit" id="gradeSubmit">查询</button>
        <a class="ghost-btn" href="/settings/account/bindings">账号绑定</a>
      </div>
    </form>
  </div>

  <div class="grade-state" id="gradeState" role="status"></div>
  <div class="webvpn-captcha-overlay" id="webvpnCaptchaDialog" role="dialog" aria-modal="true" aria-labelledby="webvpnCaptchaTitle" hidden>
    <div class="webvpn-captcha-modal">
      <div class="webvpn-captcha-head">
        <h2 id="webvpnCaptchaTitle">刷新校园网络登录态</h2>
        <button type="button" class="webvpn-captcha-close" id="closeWebvpnCaptcha" aria-label="关闭">×</button>
      </div>
      <div class="webvpn-captcha-body">
        <p id="webvpnCaptchaMessage">WebVPN 登录态失效，请输入验证码后继续查询。</p>
        <img id="webvpnCaptchaImage" class="webvpn-captcha-image" alt="WebVPN 验证码">
        <input type="text" id="webvpnCaptchaCode" class="webvpn-captcha-input" placeholder="输入验证码" maxlength="10" autocomplete="off">
      </div>
      <div class="webvpn-captcha-actions">
        <button type="button" class="ghost-btn" id="cancelWebvpnCaptcha">取消</button>
        <button type="button" class="primary-btn" id="submitWebvpnCaptcha">提交并继续查询</button>
      </div>
    </div>
  </div>
  <div class="grade-results" id="gradeResults"></div>
</section>

<style>
  .grade-page {
    width: min(1180px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 24px 0 44px;
    display: grid;
    gap: 18px;
  }
  .grade-toolbar,
  .term-panel {
    border: 1px solid var(--app-border);
    background: var(--app-surface);
    border-radius: 8px;
    box-shadow: var(--app-shadow-soft);
  }
  .grade-toolbar {
    padding: 16px;
  }
  .grade-form {
    display: grid;
    grid-template-columns: minmax(260px, 1fr) auto;
    gap: 14px;
    align-items: end;
  }
  .field-group {
    display: grid;
    gap: 10px;
  }
  .term-fields {
    grid-template-columns: repeat(2, minmax(120px, 1fr));
  }
  .grade-form label {
    display: grid;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: var(--app-muted);
  }
  .grade-form select {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--app-border);
    border-radius: 8px;
    padding: 0 10px;
    background: var(--app-surface-2);
    color: var(--app-text);
    font-size: 14px;
  }
  .grade-actions {
    display: inline-flex;
    gap: 10px;
    justify-content: flex-end;
    align-items: center;
  }
  .primary-btn,
  .ghost-btn {
    min-height: 40px;
    border-radius: 8px;
    padding: 0 16px;
    border: 1px solid var(--app-border);
    font-weight: 850;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .primary-btn {
    background: var(--app-primary);
    color: var(--app-primary-contrast);
    border-color: var(--app-primary);
  }
  .ghost-btn {
    background: transparent;
    color: var(--app-text);
  }
  .grade-state {
    min-height: 22px;
    color: var(--app-muted);
    font-size: 13px;
  }
  .grade-state.error { color: #dc2626; }
  .grade-results {
    display: grid;
    gap: 18px;
  }
  .webvpn-captcha-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(15, 23, 42, 0.42);
  }
  .webvpn-captcha-overlay[hidden] {
    display: none;
  }
  .webvpn-captcha-modal {
    width: min(420px, calc(100vw - 36px));
    border: 1px solid var(--app-border);
    border-radius: 8px;
    background: var(--app-surface);
    box-shadow: var(--app-shadow-soft);
    padding: 16px;
    display: grid;
    gap: 14px;
  }
  .webvpn-captcha-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .webvpn-captcha-head h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0;
  }
  .webvpn-captcha-close {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--app-border);
    background: var(--app-surface-2);
    color: var(--app-text);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
  }
  .webvpn-captcha-body {
    display: grid;
    gap: 10px;
  }
  .webvpn-captcha-body p {
    margin: 0;
    color: var(--app-muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .webvpn-captcha-image {
    width: 160px;
    height: 54px;
    object-fit: contain;
    border: 1px solid var(--app-border);
    border-radius: 8px;
    background: #fff;
  }
  .webvpn-captcha-input {
    width: 100%;
    min-height: 40px;
    border: 1px solid var(--app-border);
    border-radius: 8px;
    padding: 0 10px;
    background: var(--app-surface-2);
    color: var(--app-text);
    font-size: 14px;
  }
  .webvpn-captcha-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    flex-wrap: wrap;
  }
  .term-panel {
    overflow: hidden;
  }
  .term-head {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--app-border);
  }
  .term-title {
    font-size: 18px;
    font-weight: 900;
  }
  .term-meta,
  .summary-item span {
    color: var(--app-muted);
    font-size: 13px;
  }
  .grade-summary {
    display: grid;
    grid-template-columns: repeat(4, minmax(92px, auto));
    gap: 8px;
  }
  .summary-item {
    display: grid;
    gap: 2px;
    min-width: 92px;
  }
  .summary-item strong {
    font-size: 18px;
  }
  .grade-table-wrap {
    overflow-x: auto;
  }
  .grade-table {
    width: 100%;
    min-width: 880px;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .grade-table th,
  .grade-table td {
    border-bottom: 1px solid var(--app-border);
    padding: 10px;
    vertical-align: top;
    text-align: left;
    font-size: 13px;
  }
  .grade-table th {
    background: var(--app-surface-2);
    color: var(--app-muted);
    font-weight: 900;
  }
  .course-name {
    font-weight: 900;
    color: var(--app-text);
  }
  .subtle {
    color: var(--app-muted);
    line-height: 1.45;
  }
  @media (max-width: 980px) {
    .grade-form,
    .term-head {
      grid-template-columns: 1fr;
    }
    .grade-actions {
      justify-content: flex-start;
      flex-wrap: wrap;
    }
    .grade-summary {
      grid-template-columns: repeat(2, minmax(92px, 1fr));
    }
  }
  @media (max-width: 640px) {
    .grade-page {
      width: min(100vw - 20px, 1180px);
      padding-top: 12px;
    }
    .grade-toolbar {
      padding: 12px;
    }
    .term-fields {
      grid-template-columns: 1fr;
    }
  }
</style>
{% endblock %}

{% block body_end %}
<script>
(function () {
  const form = document.getElementById('gradeForm');
  const state = document.getElementById('gradeState');
  const results = document.getElementById('gradeResults');
  const submitBtn = document.getElementById('gradeSubmit');
  const webvpnCaptchaDialog = document.getElementById('webvpnCaptchaDialog');
  const webvpnCaptchaImage = document.getElementById('webvpnCaptchaImage');
  const webvpnCaptchaCode = document.getElementById('webvpnCaptchaCode');
  const webvpnCaptchaMessage = document.getElementById('webvpnCaptchaMessage');
  const submitWebvpnCaptcha = document.getElementById('submitWebvpnCaptcha');
  const cancelWebvpnCaptcha = document.getElementById('cancelWebvpnCaptcha');
  const closeWebvpnCaptcha = document.getElementById('closeWebvpnCaptcha');
  let credentialReady = false;
  let credentialPromptShown = false;
  let webvpnChallengeId = '';
  let pendingQueryPayload = null;

  function setState(text, type) {
    state.textContent = text || '';
    state.className = type ? 'grade-state ' + type : 'grade-state';
  }

  function buildTerms() {
    const academicYear = Number(document.getElementById('gradeAcademicYear').value || 0);
    const semester = document.getElementById('gradeSemester').value;
    const terms = [];
    if (!Number.isInteger(academicYear) || academicYear < 2000 || academicYear > 2100) {
      throw new Error('学年不正确');
    }
    const semesters = semester === 'all' ? ['3', '12'] : [semester];
    semesters.forEach(function (xqm) { terms.push({ xnm: String(academicYear), xqm: xqm }); });
    if (terms.length > 12) {
      throw new Error('一次最多查询 12 个学期');
    }
    return terms;
  }

  function appendText(parent, tagName, className, text) {
    const el = document.createElement(tagName);
    el.className = className;
    el.textContent = text || '';
    parent.appendChild(el);
    return el;
  }

  function summaryNode(label, value) {
    const wrap = document.createElement('div');
    wrap.className = 'summary-item';
    appendText(wrap, 'span', '', label);
    appendText(wrap, 'strong', '', String(value || 0));
    return wrap;
  }

  function renderGradeRow(grade) {
    const tr = document.createElement('tr');
    const course = document.createElement('td');
    appendText(course, 'div', 'course-name', grade.course_name || '-');
    appendText(course, 'div', 'subtle', [grade.course_code, grade.course_type, grade.course_tag].filter(Boolean).join(' / '));
    tr.appendChild(course);
    ['score', 'credits', 'grade_point', 'credit_grade_point', 'assessment', 'exam_type', 'teacher'].forEach(function (field) {
      const td = document.createElement('td');
      td.textContent = grade[field] || '-';
      tr.appendChild(td);
    });
    return tr;
  }

  function renderResult(item) {
    const panel = document.createElement('article');
    panel.className = 'term-panel';

    const head = document.createElement('div');
    head.className = 'term-head';
    const titleWrap = document.createElement('div');
    appendText(titleWrap, 'div', 'term-title', (item.term && item.term.label) || '成绩');
    const student = item.student || {};
    appendText(titleWrap, 'div', 'term-meta', [student.name, student.class_name, student.major_name].filter(Boolean).join(' / '));
    head.appendChild(titleWrap);

    const summary = item.summary || {};
    const summaryWrap = document.createElement('div');
    summaryWrap.className = 'grade-summary';
    summaryWrap.appendChild(summaryNode('课程数', summary.course_count));
    summaryWrap.appendChild(summaryNode('总学分', summary.total_credits));
    summaryWrap.appendChild(summaryNode('加权绩点', summary.gpa));
    summaryWrap.appendChild(summaryNode('绩点总和', summary.total_grade_points));
    head.appendChild(summaryWrap);
    panel.appendChild(head);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'grade-table-wrap';
    const table = document.createElement('table');
    table.className = 'grade-table';
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    ['课程', '成绩', '学分', '绩点', '学分绩点', '考核', '考试性质', '任课教师'].forEach(function (name) {
      const th = document.createElement('th');
      th.textContent = name;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    (item.grades || []).forEach(function (grade) { tbody.appendChild(renderGradeRow(grade)); });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    panel.appendChild(tableWrap);
    return panel;
  }

  function renderResults(items) {
    results.replaceChildren();
    (items || []).forEach(function (item) {
      results.appendChild(renderResult(item));
    });
  }

  function hideWebvpnCaptcha() {
    webvpnCaptchaDialog.hidden = true;
    webvpnCaptchaCode.value = '';
    webvpnChallengeId = '';
  }

  function showWebvpnCaptcha(data, payload) {
    const challenge = data && data.data ? data.data : {};
    webvpnChallengeId = challenge.challenge_id || '';
    pendingQueryPayload = payload;
    webvpnCaptchaImage.src = challenge.captcha_image || '';
    webvpnCaptchaMessage.textContent = data.message || 'WebVPN 登录态失效，请输入验证码后继续查询。';
    webvpnCaptchaDialog.hidden = false;
    webvpnCaptchaCode.value = '';
    webvpnCaptchaCode.focus();
  }

  async function submitQueryAfterWebvpnRefresh(payload) {
    const response = await fetch('/api/edu-schedule/grades/query', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (data.status !== 'success') {
      if (data.error_code === 'WEBVPN_REFRESH_REQUIRED') {
        showWebvpnCaptcha(data, payload);
        return;
      }
      throw new Error(data.message || '查询失败');
    }
    renderResults(data.data && data.data.results);
    setState('查询完成', '');
  }

  async function showBindPrompt() {
    if (credentialPromptShown) return;
    credentialPromptShown = true;
    const message = '未绑定教务系统账号，请先到账号绑定页绑定后再查询成绩。';
    if (window.appConfirm) {
      const ok = await window.appConfirm(message);
      if (ok) window.location.href = '/settings/account/bindings';
      return;
    }
    if (window.confirm(message)) window.location.href = '/settings/account/bindings';
  }

  async function loadStatus() {
    try {
      const response = await fetch('/api/edu-schedule/status', {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      const data = await response.json();
      if (data.status !== 'success') return;
      const credential = data.data && data.data.credential;
      const snapshots = data.data && data.data.grade_snapshots;
      if (credential && credential.has_credentials) {
        credentialReady = true;
        setState('已绑定教务系统账号：' + credential.username_hint, '');
      } else {
        credentialReady = false;
        setState('未绑定教务系统账号，请先绑定后查询。', 'error');
        showBindPrompt();
      }
      if (Array.isArray(snapshots) && snapshots.length) {
        renderResults(snapshots.map(function (item) { return item.payload; }));
      }
    } catch (error) {
      setState('', '');
    }
  }

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = '查询中';
    setState('正在查询成绩...', '');
    try {
      if (!credentialReady) {
        setState('未绑定教务系统账号，请先绑定后查询。', 'error');
        showBindPrompt();
        return;
      }
      const payload = {
        terms: buildTerms()
      };
      await submitQueryAfterWebvpnRefresh(payload);
    } catch (error) {
      setState(error.message || '查询失败', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '查询';
    }
  });

  submitWebvpnCaptcha.addEventListener('click', async function () {
    const captchaCode = webvpnCaptchaCode.value.trim();
    if (!webvpnChallengeId || !captchaCode) {
      setState('请输入 WebVPN 验证码', 'error');
      return;
    }
    submitWebvpnCaptcha.disabled = true;
    setState('正在刷新 WebVPN 登录态...', '');
    try {
      const response = await fetch('/api/edu-schedule/webvpn-session/complete', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify({
          challenge_id: webvpnChallengeId,
          captcha_code: captchaCode
        })
      });
      const data = await response.json();
      if (data.status !== 'success') {
        throw new Error(data.message || '刷新 WebVPN 登录态失败');
      }
      const payload = pendingQueryPayload;
      hideWebvpnCaptcha();
      if (payload) {
        await submitQueryAfterWebvpnRefresh(payload);
      }
    } catch (error) {
      setState(error.message || '刷新 WebVPN 登录态失败', 'error');
    } finally {
      submitWebvpnCaptcha.disabled = false;
      submitBtn.disabled = false;
      submitBtn.textContent = '查询';
    }
  });

  cancelWebvpnCaptcha.addEventListener('click', hideWebvpnCaptcha);
  closeWebvpnCaptcha.addEventListener('click', hideWebvpnCaptcha);

  loadStatus();
})();
</script>
{% endblock %}
