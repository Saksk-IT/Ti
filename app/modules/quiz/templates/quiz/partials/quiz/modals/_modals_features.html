{# Quiz feature sheet (replaces floating Fab menu) #}
<div class="overlay modal-overlay" id="featureOverlay" style="z-index: 2200; display:none;" onclick="closeFeatureModal(event)">
  <div class="card-container modal-panel feature-modal" role="dialog" aria-modal="true" aria-labelledby="featureModalTitle" onclick="event.stopPropagation()">
    <div class="feature-modal-header">
      <div>
        <div class="feature-modal-title" id="featureModalTitle">设置</div>
        <div class="feature-modal-subtitle">快捷功能</div>
      </div>
      <button class="feature-modal-close" type="button" onclick="closeFeatureModal()" aria-label="关闭">
        <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="feature-list">
      <div class="feature-item">
        <div class="feature-text">
          <div class="feature-title">答对自动切题</div>
          <div class="feature-desc">答对后自动跳到下一题</div>
        </div>
        <label class="feature-switch" aria-label="答对自动切题">
          <input type="checkbox" id="featureAutoNextSwitch" onchange="onFeatureAutoNextToggle(this.checked)">
          <span class="feature-switch-slider" aria-hidden="true"></span>
        </label>
      </div>

      <div class="feature-item" id="featureAutoNextSpeedItem" style="display:none;">
        <div class="feature-text">
          <div class="feature-title">切题速度</div>
          <div class="feature-desc">选择答对后的停留时间</div>
        </div>
        <div class="feature-seg" role="group" aria-label="切题速度">
          <button type="button" class="feature-seg-btn" data-delay-key="fast" onclick="onFeatureAutoNextDelaySelect('fast')">快</button>
          <button type="button" class="feature-seg-btn" data-delay-key="normal" onclick="onFeatureAutoNextDelaySelect('normal')">标准</button>
          <button type="button" class="feature-seg-btn" data-delay-key="slow" onclick="onFeatureAutoNextDelaySelect('slow')">慢</button>
        </div>
      </div>

      <div class="feature-item">
        <div class="feature-text">
          <div class="feature-title">做错自动收藏</div>
          <div class="feature-desc">自动加入收藏夹</div>
        </div>
        <label class="feature-switch" aria-label="做错自动收藏">
          <input type="checkbox" id="featureAutoFavoriteSwitch" onchange="onFeatureAutoFavoriteToggle(this.checked)">
          <span class="feature-switch-slider" aria-hidden="true"></span>
        </label>
      </div>

      <div class="feature-item">
        <div class="feature-text">
          <div class="feature-title">主题风格</div>
          <div class="feature-desc">全局配色风格</div>
        </div>
        <button type="button" class="feature-pill" id="featureThemeStyleBtn" onclick="onFeatureThemeStyleCycle()">默认</button>
      </div>

      <div class="feature-item">
        <div class="feature-text">
          <div class="feature-title">字体大小</div>
          <div class="feature-desc">仅影响答题页字体</div>
        </div>
        <div class="feature-seg" role="group" aria-label="字体大小">
          <button type="button" class="feature-seg-btn" data-size="sm" onclick="onFeatureFontSizeSelect('sm')">A-</button>
          <button type="button" class="feature-seg-btn" data-size="md" onclick="onFeatureFontSizeSelect('md')">A</button>
          <button type="button" class="feature-seg-btn" data-size="lg" onclick="onFeatureFontSizeSelect('lg')">A+</button>
        </div>
      </div>

      {# 主观题判分模式（仅刷题模式显示） #}
      <div class="feature-grading-section" id="featureGradingSection" style="display:none;">
        <div class="feature-title" style="margin-bottom:8px;">主观题判分模式</div>
        <div class="feature-grading-modes" id="featureGradingModes">
          <label class="feature-grading-opt" data-value="auto_full">
            <input type="radio" name="featureGradingMode" value="auto_full">
            <span class="feature-grading-radio"></span>
            <span class="feature-grading-info">
              <span class="feature-grading-label">有答即对</span>
              <span class="feature-grading-desc">填写即判对，快速刷题</span>
            </span>
          </label>
          <label class="feature-grading-opt" data-value="ai">
            <input type="radio" name="featureGradingMode" value="ai">
            <span class="feature-grading-radio"></span>
            <span class="feature-grading-info">
              <span class="feature-grading-label">AI 判分</span>
              <span class="feature-grading-desc">AI 智能评判，需后台配置</span>
            </span>
          </label>
          <label class="feature-grading-opt" data-value="manual">
            <input type="radio" name="featureGradingMode" value="manual">
            <span class="feature-grading-radio"></span>
            <span class="feature-grading-info">
              <span class="feature-grading-label">自评模式</span>
              <span class="feature-grading-desc">查看参考答案后自行评判</span>
            </span>
          </label>
        </div>
      </div>

      <div class="feature-actions">
        <button class="feature-action-btn" type="button" onclick="clearCurrentQuestionProgress(); closeFeatureModal();">清除本题进度</button>
        <button class="feature-action-btn secondary" type="button" onclick="goToShortcutSettings()">更多设置</button>
      </div>
    </div>
  </div>
</div>
