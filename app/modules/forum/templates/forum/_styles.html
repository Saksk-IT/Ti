<style>
.forum-container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

.forum-sort { display: flex; gap: 4px; }

.forum-new-btn { padding: 8px 20px; background: var(--app-primary); color: var(--app-primary-contrast); border-radius: 10px; font-size: 14px; font-weight: 500; text-decoration: none; transition: opacity .2s; min-height: auto; display: inline-flex; align-items: center; }

/* 帖子卡片 */
.forum-post-card { background: var(--app-surface); border: 0.5px solid var(--app-border); border-radius: var(--app-radius-md); padding: 12px; margin-bottom: 12px; cursor: pointer; transition: box-shadow .2s; overflow: hidden; min-width: 0; height: 146px; display: grid; grid-template-columns: auto 1fr 140px; grid-template-rows: auto auto 1fr auto; gap: 6px 12px; box-sizing: border-box; position: relative; }
.forum-post-card:hover { box-shadow: var(--app-shadow-soft); }
.forum-post-header { grid-column: 1 / 3; grid-row: 1 / 2; display: flex; align-items: center; gap: 10px; margin: 0; }
.forum-post-head-main { min-width: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
.forum-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--app-primary-soft); object-fit: cover; flex-shrink: 0; }
.forum-post-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--app-muted); }
.forum-post-meta .author { color: var(--app-text); font-weight: 500; }
.forum-avatar-link { display: inline-flex; flex-shrink: 0; text-decoration: none; }

.forum-post-owner-actions { grid-column: 3 / 4; grid-row: 1 / 2; margin: 0; align-self: start; justify-self: end; position: relative; flex-shrink: 0; }
.forum-post-owner-toggle { width: 24px; height: 24px; border-radius: 4px; border: none; background: transparent; color: var(--app-muted); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; min-height: auto; font-size: 18px; }
.forum-post-owner-toggle:hover { color: var(--app-text); background: color-mix(in srgb, var(--app-bg) 60%, transparent); }
.forum-post-owner-menu { position: absolute; right: 0; top: calc(100% + 6px); display: none; flex-direction: column; gap: 4px; min-width: 112px; padding: 8px; border: 0.5px solid var(--app-border); border-radius: 10px; background: var(--app-surface); box-shadow: var(--app-shadow-soft); z-index: 20; }

.forum-post-owner-menu button { border: none; background: transparent; color: var(--app-text); font-size: 13px; text-align: left; padding: 6px 8px; border-radius: 8px; cursor: pointer; min-height: auto; }
.forum-post-owner-menu button:hover { background: var(--app-primary-soft); }
.forum-post-owner-menu button.danger { color: #dc2626; }
.forum-post-owner-menu button.danger:hover { background: rgba(220, 38, 38, 0.12); }
.forum-board-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--app-primary-soft); color: var(--app-primary); margin: 0; }
.forum-post-title { grid-column: 1 / 3; grid-row: 2 / 3; margin: 0; font-size: 16px; font-weight: 600; color: var(--app-text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
.forum-post-preview { grid-column: 1 / 3; grid-row: 3 / 4; margin: 0; font-size: 13px; color: var(--app-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
.forum-post-stats { grid-column: 1 / 2; grid-row: 4 / 5; display: flex; gap: 16px; align-self: end; margin: 0; font-size: 13px; color: var(--app-muted); }
.forum-post-stats span { display: flex; align-items: center; gap: 4px; }
.forum-post-time { grid-column: 3 / 4; grid-row: 4 / 5; margin: 0; align-self: end; justify-self: end; text-align: right; font-size: 12px; color: var(--app-muted); white-space: nowrap; }
.forum-post-cover-thumb { grid-column: 3 / 4; grid-row: 2 / 4; width: 120px; height: 96px; border-radius: 8px; overflow: hidden; border: 0.5px solid var(--app-border); align-self: start; justify-self: end; }
.forum-post-cover-thumb img { width: 100%; height: 100%; object-fit: cover; }
/* 朋友圈风格内容区 */

.forum-expand-btn { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 1; padding: 4px 16px; border: 0.5px solid var(--app-border); border-radius: 14px; background: var(--app-surface); color: var(--app-primary); font-size: 13px; font-weight: 500; cursor: pointer; min-height: auto; transition: all .15s; }
.forum-expand-btn:hover { background: var(--app-primary-soft); }
/* 图片网格 — 朋友圈风格 */
.forum-post-img-grid { display: none; gap: 4px; margin-bottom: 10px; border-radius: 8px; overflow: hidden; }
.forum-post-img-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.forum-post-img-grid.img-grid-1 { grid-template-columns: 1fr; }
.forum-post-img-grid.img-grid-1 img { aspect-ratio: 16/9; max-height: 300px; }
.forum-post-img-grid.img-grid-2 { grid-template-columns: 1fr 1fr; }
.forum-post-img-grid.img-grid-2 img { aspect-ratio: 1; }

.forum-post-img-grid.img-grid-3 img { aspect-ratio: 1; }
/* 旧图片样式保留兼容 */
.forum-post-images { display: none; gap: 8px; margin-bottom: 10px; overflow: hidden; }
.forum-post-images img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 0.5px solid var(--app-border); }
.forum-post-stats span { display: flex; align-items: center; gap: 4px; }
.forum-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; margin-right: 6px; }
.forum-badge-pin { background: rgba(255,149,0,.12); color: #ff9500; }
.forum-badge-feat { background: rgba(52,199,89,.12); color: #34c759; }
.forum-badge-hidden { background: rgba(14,165,233,.12); color: #0369a1; }
/* 帖子详情 — 双栏布局 */
.forum-detail-layout { max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; box-sizing: border-box; }
.forum-detail-back { padding: 8px 0 12px; flex-shrink: 0; }
.forum-back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--app-muted); font-size: 14px; font-weight: 500; text-decoration: none; transition: color .2s; padding: 4px 8px; border-radius: 8px; }
.forum-back-link:hover { color: var(--app-primary); background: var(--app-primary-soft); }
.forum-detail-columns { display: flex; gap: 24px; flex: 1; min-height: 0; overflow: hidden; }
.forum-detail-left { flex: 1; min-width: 0; overflow-y: auto; }

.forum-detail-left::-webkit-scrollbar-thumb { background: var(--app-border); border-radius: 2px; }
.forum-detail-right { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

.forum-detail-right .forum-comments-section::-webkit-scrollbar { width: 4px; }
.forum-detail-right .forum-comments-section::-webkit-scrollbar-thumb { background: var(--app-border); border-radius: 2px; }
.forum-detail-right .forum-comment-input { background: var(--app-surface); border-top: 0.5px solid var(--app-border); padding: 12px 0; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
@media (max-width: 900px) {
  .forum-detail-layout { overflow-y: auto; }
  .forum-detail-columns { flex-direction: column; overflow: visible; }
  .forum-detail-left { overflow-y: visible; }
  .forum-detail-right { width: 100%; overflow: visible; }
  .forum-detail-right .forum-comments-section { overflow-y: visible; }
}
.forum-post-content { background: var(--app-surface); border: 0.5px solid var(--app-border); border-radius: var(--app-radius-md); padding: 24px; margin-bottom: 16px; }
.forum-post-content .post-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: var(--app-text); line-height: 1.4; min-height: 1.4em; word-break: break-word; }

.forum-post-content .post-body img { max-width: 100%; border-radius: 8px; margin: 8px 0; }
.forum-post-content > .forum-post-preview { -webkit-line-clamp: unset; display: block; overflow: visible; margin-top: 0; margin-bottom: 12px; }
.forum-actions-bar { display: flex; gap: 12px; margin-bottom: 20px; }
.forum-action-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: 0.5px solid var(--app-border); border-radius: 10px; background: var(--app-surface); color: var(--app-muted); font-size: 14px; cursor: pointer; transition: all .2s; min-height: auto; }
.forum-action-btn:hover { border-color: var(--app-primary); color: var(--app-primary); transform: none; box-shadow: none; }

.forum-follow-btn { display: inline-flex; align-items: center; padding: 3px 12px; border: 1px solid var(--app-primary); border-radius: 14px; background: var(--app-primary); color: var(--app-primary-contrast, #fff); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; min-height: auto; margin-left: 8px; vertical-align: middle; }

.forum-comment-input { position: sticky; bottom: 0; background: var(--app-surface); border-top: 0.5px solid var(--app-border); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; }
.forum-comment-input textarea { flex: 1; border: 0.5px solid var(--app-border); border-radius: 10px; padding: 10px 14px; font-size: 14px; resize: none; background: var(--app-surface-2); color: var(--app-text); font-family: inherit; }
.forum-submit-btn { padding: 10px 20px; background: var(--app-primary); color: var(--app-primary-contrast); border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; min-height: auto; }
.forum-submit-btn:hover { opacity: .85; transform: none; box-shadow: none; }
.forum-cancel-btn { padding: 10px 20px; background: var(--app-surface); color: var(--app-muted); border: 0.5px solid var(--app-border); border-radius: 10px; font-size: 14px; cursor: pointer; min-height: auto; }
/* 发帖/编辑 */
.forum-editor-container { padding-top: 8px; }
.forum-article-editor-page { padding-top: 8px; padding-bottom: 20px; }
.forum-article-editor-head { margin-bottom: 16px; }
.forum-article-editor-head h2 { margin: 0 0 6px; font-size: 22px; font-weight: 650; }

.forum-article-form-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.forum-article-main, .forum-article-side { min-width: 0; }
.forum-form-group { margin-bottom: 20px; }
.forum-form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--app-text); }
.forum-form-group input, .forum-form-group select, .forum-form-group textarea { width: 100%; padding: 10px 14px; border: 0.5px solid var(--app-border); border-radius: 10px; font-size: 14px; background: var(--app-surface); color: var(--app-text); box-sizing: border-box; }
.forum-form-group textarea { resize: vertical; min-height: 96px; }
.forum-editor-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.forum-editor-title-row label { margin-bottom: 0; }

.forum-toast-editor .toastui-editor-defaultUI { border: none; background: transparent; }
.forum-toast-editor .toastui-editor-toolbar { background: var(--app-surface); border-bottom: 0.5px solid var(--app-border); }
.forum-toast-editor .toastui-editor-md-container,
.forum-toast-editor .toastui-editor-ww-container { background: var(--app-surface); color: var(--app-text); }
.forum-image-upload { margin-top: 8px; }
.forum-image-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.forum-image-grid .img-item { position: relative; width: 80px; height: 80px; }
.forum-image-grid .img-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.forum-image-grid .img-item .img-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--app-text); color: var(--app-surface); border: none; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; min-height: auto; }
.forum-upload-btn { display: inline-flex; align-items: center; padding: 8px 16px; border: 1px dashed var(--app-border); border-radius: 8px; color: var(--app-muted); font-size: 13px; cursor: pointer; }
.forum-upload-btn:hover { border-color: var(--app-primary); color: var(--app-primary); }
.forum-cover-box { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 0.5px dashed var(--app-border); border-radius: 10px; overflow: hidden; background: var(--app-surface-2); display: flex; align-items: center; justify-content: center; }
.forum-cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.forum-cover-empty { color: var(--app-muted); font-size: 13px; }
.forum-cover-remove { position: absolute; top: 8px; right: 8px; border: none; background: rgba(17, 24, 39, 0.75); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; min-height: auto; }
.forum-summary-count { margin-top: 6px; text-align: right; color: var(--app-muted); font-size: 12px; }
.forum-tag-hint { margin-top: 6px; color: var(--app-muted); font-size: 12px; }
.forum-tags-chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }

.forum-tag-chip button { border: none; background: none; color: var(--app-muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; min-height: auto; }
.forum-form-actions { display: flex; gap: 12px; margin-top: 24px; }

.forum-locked-notice svg { opacity: 0.6; flex-shrink: 0; }
/* 锁定标记 */
