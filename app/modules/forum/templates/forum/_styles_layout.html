<style>
/* ===== 论坛页面：主区域不滚动，各区域独立滚动 ===== */
.app-main.forum-no-scroll { overflow: hidden; flex: 1; display: flex; flex-direction: column; }
.app-main.forum-no-scroll + .app-footer { display: none; }
.app-main.forum-no-scroll ~ .app-footer { display: none; }
/* 确保高度链条完整：app-shell → app-body → app-main 都不溢出 */
.forum-no-scroll-shell { height: 100vh; overflow: hidden; }
.forum-no-scroll-shell > .app-body { overflow: hidden; flex: 1; min-height: 0; }

.forum-main { flex: 1; min-width: 0; overflow-y: auto; scrollbar-gutter: stable; }
