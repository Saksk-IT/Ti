<script>
var commentPage = 1;
var commentTotal = 0;
var replyTarget = null;
var commentSort = 'hot';

function escH(value) {
  var div = document.createElement('div');
  div.textContent = value || '';
  return div.innerHTML;
}

function escJ(value) {
  return String(value || '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r?\n/g, ' ')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function fmtT(value) {
  try {
    return new Date(value).toLocaleString('zh-CN');
  } catch (error) {
    return value || '';
  }
}

var _ic = {
  heart: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>',
  flag: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>'
};

function renderReply(reply, parentId) {
  var avatar = reply.author_avatar
    ? '<a href="/user/' + reply.author_id + '" class="forum-avatar-link"><img class="forum-avatar" src="' + escH(reply.author_avatar) + '" alt=""></a>'
    : '<a href="/user/' + reply.author_id + '" class="forum-avatar-link"><div class="forum-avatar"></div></a>';

  return '<div class="forum-comment">' +
    '<div class="comment-header">' + avatar + '<a href="/user/' + reply.author_id + '" class="forum-user-link" style="font-weight:500">' + escH(reply.author_name) + '</a>' +
      '<span style="font-size:12px;color:var(--app-muted);margin-left:auto">' + fmtT(reply.created_at) + '</span></div>' +
    '<div class="comment-body">' + escH(reply.content) + '</div>' +
    '<div class="comment-footer"><button onclick="setReply(' + parentId + ',' + reply.author_id + ',\'' + escJ(reply.author_name) + '\')">回复</button><button onclick="likeComment(' + reply.id + ')">' + _ic.heart + ' ' + (reply.like_count || 0) + '</button><button onclick="openReportModal(\'comment\',' + reply.id + ')">' + _ic.flag + '</button></div>' +
  '</div>';
}

function renderComment(comment) {
  var avatar = comment.author_avatar
    ? '<a href="/user/' + comment.author_id + '" class="forum-avatar-link"><img class="forum-avatar" src="' + escH(comment.author_avatar) + '" alt=""></a>'
    : '<a href="/user/' + comment.author_id + '" class="forum-avatar-link"><div class="forum-avatar"></div></a>';

  var repliesHtml = '';
  if (comment.replies && comment.replies.length) {
    var sortedReplies = comment.replies.slice().sort(function(a, b) {
      return Number(b.like_count || 0) - Number(a.like_count || 0);
    });
    var visibleReplies = sortedReplies.slice(0, 2);
    var hiddenReplies = sortedReplies.slice(2);
    var visibleHtml = visibleReplies.map(function(reply) {
      return renderReply(reply, comment.id);
    }).join('');
    var hiddenHtml = '';

    if (hiddenReplies.length) {
      var collapseId = 'replies-' + comment.id;
      hiddenHtml = '<div class="forum-replies-collapsed" id="' + collapseId + '">' + hiddenReplies.map(function(reply) {
        return renderReply(reply, comment.id);
      }).join('') + '</div>';
      hiddenHtml += '<button class="forum-replies-toggle" onclick="toggleReplies(' + comment.id + ', this)" data-count="' + hiddenReplies.length + '">展开全部 ' + comment.replies.length + ' 条回复</button>';
    }

    repliesHtml = '<div class="forum-replies">' + visibleHtml + hiddenHtml + '</div>';
  }

  return '<div class="forum-comment" id="comment-' + comment.id + '">' +
    '<div class="comment-header">' + avatar + '<a href="/user/' + comment.author_id + '" class="forum-user-link" style="font-weight:500">' + escH(comment.author_name) + '</a>' +
      '<span style="font-size:12px;color:var(--app-muted);margin-left:auto">' + fmtT(comment.created_at) + '</span></div>' +
    '<div class="comment-body">' + escH(comment.content) + '</div>' +
    '<div class="comment-footer"><button onclick="setReply(' + comment.id + ',' + comment.author_id + ',\'' + escJ(comment.author_name) + '\')">回复</button><button onclick="likeComment(' + comment.id + ')">' + _ic.heart + ' ' + (comment.like_count || 0) + '</button><button onclick="openReportModal(\'comment\',' + comment.id + ')">' + _ic.flag + '</button></div>' +
    repliesHtml +
  '</div>';
}

function toggleReplies(commentId, btn) {
  var collapse = document.getElementById('replies-' + commentId);
  if (!collapse) return;
  var expanded = collapse.classList.toggle('expanded');
  if (expanded) {
    btn.textContent = '收起回复';
    return;
  }
  var total = Number(btn.dataset.count || 0) + 2;
  btn.textContent = '展开全部 ' + total + ' 条回复';
}

async function loadComments(append) {
  try {
    var response = await fetch('/api/forum/posts/' + POST_ID + '/comments?page=' + commentPage + '&per_page=30&sort=' + commentSort);
    var payload = await response.json();
    if (payload.status !== 'success') return;

    commentTotal = Number(payload.data.total || 0);
    updateReaderCommentCount(commentTotal);

    var list = document.getElementById('commentsList');
    var html = payload.data.comments.map(renderComment).join('');
    if (!html && !append) {
      list.innerHTML = '<div class="forum-empty">还没有评论，来抢沙发。</div>';
    } else {
      list.innerHTML = append ? (list.innerHTML + html) : html;
    }

    var loadMore = document.getElementById('commentsLoadMore');
    var totalPages = Math.ceil(commentTotal / 30);
    loadMore.style.display = commentPage < totalPages ? 'block' : 'none';
  } catch (error) {
    console.error(error);
  }
}

function loadMoreComments() {
  commentPage += 1;
  loadComments(true);
}

function setReply(parentId, userId, userName) {
  replyTarget = {parent_id: parentId, reply_to_user_id: userId, reply_to_name: userName};
  openCommentsDrawer();
  var textarea = document.getElementById('commentText');
  if (!textarea) return;
  textarea.placeholder = '回复 @' + userName + '...';
  textarea.focus();
}

async function submitComment() {
  var textarea = document.getElementById('commentText');
  if (!textarea) return;
  var content = textarea.value.trim();
  if (!content) return;

  var body = {content: content};
  if (replyTarget) {
    body.parent_id = replyTarget.parent_id;
    body.reply_to_user_id = replyTarget.reply_to_user_id;
  }

  try {
    var response = await fetch('/api/forum/posts/' + POST_ID + '/comments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    var payload = await response.json();

    if (payload.status === 'success') {
      textarea.value = '';
      textarea.placeholder = '写下你的评论... 使用 @用户名 提及他人';
      replyTarget = null;
      commentPage = 1;
      openCommentsDrawer();
      loadComments(false);
      return;
    }

    alert(payload.message || '发表失败');
  } catch (error) {
    alert('发表失败');
  }
}

async function likeComment(commentId) {
  try {
    var response = await fetch('/api/forum/like', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target_type: 'comment', target_id: commentId})
    });
    var payload = await response.json();

    if (payload.status === 'success' && payload.data) {
      var commentEl = document.getElementById('comment-' + commentId);
      if (commentEl) {
        var buttons = commentEl.querySelectorAll(':scope > .comment-footer > button');
        for (var index = 0; index < buttons.length; index += 1) {
          if (buttons[index].getAttribute('onclick') === 'likeComment(' + commentId + ')') {
            buttons[index].innerHTML = _ic.heart + ' ' + (payload.data.like_count || 0);
            break;
          }
        }
      }

      if (!commentEl) {
        document.querySelectorAll('.comment-footer button').forEach(function(button) {
          if (button.getAttribute('onclick') === 'likeComment(' + commentId + ')') {
            button.innerHTML = _ic.heart + ' ' + (payload.data.like_count || 0);
          }
        });
      }
    }
  } catch (error) {
    console.error(error);
  }
}
</script>
