<script>
let commentPage = 1;
let commentTotal = 0;
let replyTarget = null; // {parent_id, reply_to_user_id, reply_to_name}

function escH(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function fmtT(s) { if (!s) return ''; const d = new Date(s); const diff = (Date.now() - d) / 1000;
  if (diff < 60) return '刚刚'; if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前'; return `${d.getMonth()+1}/${d.getDate()}`; }

function renderReply(r, parentId) {
  const ra = r.author_avatar
    ? `<img class="forum-avatar" src="${escH(r.author_avatar)}" alt="" style="width:24px;height:24px">`
    : '<div class="forum-avatar" style="width:24px;height:24px"></div>';
  const replyTo = r.reply_to_name ? `<span class="forum-reply-to">@${escH(r.reply_to_name)}</span> ` : '';
  return `<div class="forum-comment"><div class="comment-header">${ra}<span style="font-size:13px;font-weight:500">${escH(r.author_name)}</span><span style="font-size:12px;color:var(--app-muted);margin-left:auto">${fmtT(r.created_at)}</span></div>
    <div class="comment-body">${replyTo}${escH(r.content)}</div>
    <div class="comment-footer"><button onclick="setReply(${parentId},${r.author_id},'${escH(r.author_name)}')">回复</button><button onclick="likeComment(${r.id})">&#10084; ${r.like_count||0}</button><button onclick="openReportModal('comment',${r.id})">&#9888;</button></div></div>`;
}

function renderComment(c) {
  const avatar = c.author_avatar ? `<img class="forum-avatar" src="${escH(c.author_avatar)}" alt="">` : '<div class="forum-avatar"></div>';

  let repliesHtml = '';
  if (c.replies && c.replies.length) {
    // 按 like_count 降序排序
    const sorted = [...c.replies].sort((a, b) => (b.like_count || 0) - (a.like_count || 0));
    const visible = sorted.slice(0, 2);
    const hidden = sorted.slice(2);

    let visibleHtml = visible.map(r => renderReply(r, c.id)).join('');
    let hiddenHtml = '';

    if (hidden.length) {
      const collapseId = 'replies-' + c.id;
      hiddenHtml = `<div class="forum-replies-collapsed" id="${collapseId}">${hidden.map(r => renderReply(r, c.id)).join('')}</div>`;
      hiddenHtml += `<button class="forum-replies-toggle" onclick="toggleReplies(${c.id}, this)" data-count="${hidden.length}">展开全部 ${c.replies.length} 条回复</button>`;
    }

    repliesHtml = `<div class="forum-replies">${visibleHtml}${hiddenHtml}</div>`;
  }

  return `<div class="forum-comment" id="comment-${c.id}"><div class="comment-header">${avatar}<span style="font-weight:500">${escH(c.author_name)}</span><span style="font-size:12px;color:var(--app-muted);margin-left:auto">${fmtT(c.created_at)}</span></div>
    <div class="comment-body">${escH(c.content)}</div>
    <div class="comment-footer"><button onclick="setReply(${c.id},${c.author_id},'${escH(c.author_name)}')">回复</button><button onclick="likeComment(${c.id})">&#10084; ${c.like_count||0}</button><button onclick="openReportModal('comment',${c.id})">&#9888;</button></div>${repliesHtml}</div>`;
}

/* 展开/收起回复 */
function toggleReplies(commentId, btn) {
  const el = document.getElementById('replies-' + commentId);
  if (!el) return;
  const expanded = el.classList.toggle('expanded');
  if (expanded) {
    btn.textContent = '收起回复';
  } else {
    const total = parseInt(btn.dataset.count) + 2;
    btn.textContent = '展开全部 ' + total + ' 条回复';
  }
}

async function loadComments(append) {
  try {
    const r = await fetch(`/api/forum/posts/${POST_ID}/comments?page=${commentPage}&per_page=30`).then(r => r.json());
    if (r.status !== 'success') return;
    commentTotal = r.data.total;
    const list = document.getElementById('commentsList');
    const html = r.data.comments.map(renderComment).join('');
    if (append) list.innerHTML += html; else list.innerHTML = html;
    const more = document.getElementById('commentsLoadMore');
    const totalP = Math.ceil(commentTotal / 30);
    more.style.display = commentPage < totalP ? 'block' : 'none';
  } catch(e) { console.error(e); }
}

function loadMoreComments() { commentPage++; loadComments(true); }

function setReply(parentId, userId, userName) {
  replyTarget = {parent_id: parentId, reply_to_user_id: userId, reply_to_name: userName};
  const ta = document.getElementById('commentText');
  ta.placeholder = `回复 @${userName}...`;
  ta.focus();
}

async function submitComment() {
  const ta = document.getElementById('commentText');
  const content = ta.value.trim();
  if (!content) return;
  const body = {content};
  if (replyTarget) { body.parent_id = replyTarget.parent_id; body.reply_to_user_id = replyTarget.reply_to_user_id; }
  try {
    const r = await fetch(`/api/forum/posts/${POST_ID}/comments`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
    if (r.status === 'success') { ta.value = ''; ta.placeholder = '写下你的评论...'; replyTarget = null; commentPage = 1; loadComments(false); }
    else alert(r.message || '发表失败');
  } catch(e) { alert('发表失败'); }
}

async function likeComment(cid) {
  try {
    await fetch('/api/forum/like', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_type:'comment',target_id:cid})});
    commentPage = 1; loadComments(false);
  } catch(e) {}
}

loadComments(false);
</script>
