<script>
var _readerCommentCount = null;
var _readerTocObserver = null;
var _readerTocEntries = [];
var _readerTocActiveId = '';

function getForumReaderPage() {
  return document.getElementById('forumReaderPage');
}

function getReaderMoreHost() {
  return document.getElementById('readerMoreHost');
}

function closeReaderMoreMenu() {
  var host = getReaderMoreHost();
  var menu = document.getElementById('readerMoreMenu');
  var button = document.getElementById('readerMoreBtn');

  if (host) host.classList.remove('is-open');
  if (menu) menu.hidden = true;
  if (button) button.setAttribute('aria-expanded', 'false');
}

function toggleReaderMoreMenu(event) {
  if (event) event.stopPropagation();

  var host = getReaderMoreHost();
  var menu = document.getElementById('readerMoreMenu');
  var button = document.getElementById('readerMoreBtn');
  if (!host || !menu || !button) return;

  var shouldOpen = menu.hidden;
  closeReaderMoreMenu();
  if (!shouldOpen) return;

  host.classList.add('is-open');
  menu.hidden = false;
  button.setAttribute('aria-expanded', 'true');
}

function _readerEsc(value) {
  var div = document.createElement('div');
  div.textContent = value || '';
  return div.innerHTML;
}

function isReaderMobileTocMode() {
  return window.matchMedia('(max-width: 900px)').matches;
}

function syncReaderBodyLock() {
  var page = getForumReaderPage();
  var shouldLock = !!(page && (page.classList.contains('is-comments-open') || page.classList.contains('is-toc-open')));
  document.body.classList.toggle('forum-reader-comments-open', shouldLock);
}

function openTocDrawer() {
  var page = getForumReaderPage();
  if (!page || !isReaderMobileTocMode()) return;
  closeCommentsDrawer();
  page.classList.add('is-toc-open');
  syncReaderBodyLock();
}

function closeTocDrawer() {
  var page = getForumReaderPage();
  if (!page) return;
  page.classList.remove('is-toc-open');
  syncReaderBodyLock();
}

function syncReaderResponsiveState() {
  var page = getForumReaderPage();
  if (!page) return;
  if (!isReaderMobileTocMode()) {
    page.classList.remove('is-toc-open');
  }
  syncReaderBodyLock();
}

function openCommentsDrawer() {
  var page = getForumReaderPage();
  var drawer = document.getElementById('commentsDrawer');
  if (!page || !drawer) return;
  closeTocDrawer();
  page.classList.add('is-comments-open');
  drawer.setAttribute('aria-hidden', 'false');
  syncReaderBodyLock();
}

function closeCommentsDrawer() {
  var page = getForumReaderPage();
  var drawer = document.getElementById('commentsDrawer');
  if (!page || !drawer) return;
  page.classList.remove('is-comments-open');
  drawer.setAttribute('aria-hidden', 'true');
  syncReaderBodyLock();
}

function focusCommentInput() {
  openCommentsDrawer();
  window.setTimeout(function() {
    var textarea = document.getElementById('commentText');
    if (!textarea) return;
    textarea.focus();
    var length = textarea.value.length;
    textarea.setSelectionRange(length, length);
  }, 180);
}

function _readerStateText(post) {
  if (!post) return '';
  var labels = [];
  if (post.is_pinned) labels.push('置顶');
  if (post.is_featured) labels.push('精华');
  if (post.is_locked) labels.push('已锁定');
  if (post.is_hidden) labels.push('已隐藏');
  return labels.join(' · ');
}

function _readerCommentSummary(count) {
  if (!count) return '还没有评论，来抢沙发';
  if (count === 1) return '1 条评论，打开抽屉查看';
  return count + ' 条评论，打开抽屉继续讨论';
}

function syncReaderMeta(post) {
  if (!post) return;
  var boardLabel = document.getElementById('readerBoardLabel');
  var stateChip = document.getElementById('readerPostState');
  var pageTitle = String(post.title == null ? '' : post.title).trim() || '帖子';

  if (boardLabel) {
    boardLabel.textContent = post.board_name || '论坛';
  }

  if (stateChip) {
    var stateText = _readerStateText(post);
    stateChip.hidden = !stateText;
    stateChip.textContent = stateText;
  }

  document.title = 'SAK · ' + pageTitle;
}

function syncReaderActionState(post) {
  var safePost = post || {};
  var likeCount = Number(safePost.like_count || 0);
  var favoriteCount = Number(safePost.favorite_count || 0);
  var commentCount = _readerCommentCount == null
    ? Number(safePost.comment_count || 0)
    : Number(_readerCommentCount || 0);

  document.querySelectorAll('[data-post-like-count]').forEach(function(node) {
    node.textContent = likeCount;
  });

  document.querySelectorAll('[data-post-fav-count]').forEach(function(node) {
    node.textContent = favoriteCount;
  });

  document.querySelectorAll('[data-post-comment-count]').forEach(function(node) {
    node.textContent = commentCount;
  });

  document.querySelectorAll('[data-reader-stat="comments"]').forEach(function(node) {
    node.textContent = commentCount;
  });

  document.querySelectorAll('[data-reader-stat="likes"]').forEach(function(node) {
    node.textContent = likeCount;
  });

  document.querySelectorAll('[data-reader-stat="favorites"]').forEach(function(node) {
    node.textContent = favoriteCount;
  });

  document.querySelectorAll('[data-post-like-toggle]').forEach(function(node) {
    node.classList.toggle('active', !!safePost.liked);
  });

  document.querySelectorAll('[data-post-fav-toggle]').forEach(function(node) {
    node.classList.toggle('active', !!safePost.favorited);
  });

  var summary = _readerCommentSummary(commentCount);
  var entryMeta = document.getElementById('readerCommentEntryMeta');
  var drawerSummary = document.getElementById('commentsDrawerSummary');

  if (entryMeta) {
    entryMeta.textContent = summary;
  }

  if (drawerSummary) {
    drawerSummary.textContent = summary;
  }
}

function updateReaderCommentCount(count) {
  _readerCommentCount = Number(count || 0);
  if (typeof _postData !== 'undefined' && _postData) {
    _postData = Object.assign({}, _postData, {comment_count: _readerCommentCount});
    syncReaderActionState(_postData);
    return;
  }
  syncReaderActionState({comment_count: _readerCommentCount});
}

function _formatReaderTime(value) {
  try {
    return new Date(value).toLocaleDateString('zh-CN');
  } catch (error) {
    return value || '';
  }
}

function _formatReaderCount(value) {
  var number = Number(value || 0);
  if (number >= 10000) return (number / 10000).toFixed(1) + 'w';
  return String(number);
}

function renderReaderEmptyState(message, actionLabel, actionHref) {
  var actionHtml = actionLabel && actionHref
    ? '<a class="forum-reader-side-post" href="' + actionHref + '"><div class="forum-reader-side-post-title">' + _readerEsc(actionLabel) + '</div></a>'
    : '';
  return '<div class="forum-reader-empty">' + _readerEsc(message || '暂无内容') + '</div>' + actionHtml;
}

function renderReaderPostList(posts, emptyText, actionLabel, actionHref) {
  if (!Array.isArray(posts) || !posts.length) {
    return renderReaderEmptyState(emptyText, actionLabel, actionHref);
  }

  return posts.map(function(post) {
    return '<a class="forum-reader-side-post" href="/forum/post/' + post.id + '">' +
      '<div class="forum-reader-side-post-title">' + _readerEsc(post.title) + '</div>' +
      '<div class="forum-reader-side-post-meta">' +
        '<span>' + _readerEsc(post.board_name || '论坛') + '</span>' +
        '<span>' + _formatReaderTime(post.created_at) + '</span>' +
        '<span>赞 ' + _formatReaderCount(post.like_count) + '</span>' +
        '<span>评 ' + _formatReaderCount(post.comment_count) + '</span>' +
      '</div>' +
    '</a>';
  }).join('');
}

document.addEventListener('click', function(event) {
  var host = getReaderMoreHost();
  if (!host || host.contains(event.target)) return;
  closeReaderMoreMenu();
});

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') closeReaderMoreMenu();
});

function renderReaderAuthor(author) {
  if (!author) {
    return '<div class="forum-reader-empty">作者信息暂不可用</div>';
  }

  var currentUserId = typeof getCurrentForumUserId === 'function' ? getCurrentForumUserId() : 0;
  var avatar = author.avatar
    ? '<img class="forum-reader-author-avatar" src="' + _readerEsc(author.avatar) + '" alt="">'
    : '<div class="forum-reader-author-avatar"></div>';
  var followButton = '';
  if (author.id && author.id !== currentUserId) {
    followButton = '<button class="forum-follow-btn' + (author.i_follow ? ' active' : '') + '" id="followAuthorBtn" onclick="toggleFollowAuthor()">' + _followBtnText(author) + '</button>';
  }

  return '<div class="forum-reader-author-head">' +
      '<a href="/user/' + author.id + '" class="forum-avatar-link">' + avatar + '</a>' +
      '<div class="forum-reader-author-main">' +
        '<div class="forum-reader-author-name-row">' +
          '<a href="/user/' + author.id + '" class="forum-reader-author-name forum-user-link">' + _readerEsc(author.username || '用户') + '</a>' +
          followButton +
        '</div>' +
        '<div class="forum-reader-author-meta">加入于 ' + _formatReaderTime(author.created_at) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="forum-reader-author-signature">' + _readerEsc(author.signature || author.college || '这个作者还没有留下简介。') + '</div>' +
    '<div class="forum-reader-author-stats">' +
      '<div class="forum-reader-author-stat"><strong data-author-followers>' + _formatReaderCount(author.follower_count) + '</strong><span>粉丝</span></div>' +
      '<div class="forum-reader-author-stat"><strong data-author-following>' + _formatReaderCount(author.following_count) + '</strong><span>关注</span></div>' +
      '<div class="forum-reader-author-stat"><strong data-author-posts>' + _formatReaderCount(author.post_count) + '</strong><span>帖子</span></div>' +
    '</div>';
}

function syncReaderAuthorState(status) {
  if (!status) return;
  var button = document.getElementById('followAuthorBtn');
  if (button) {
    button.textContent = _followBtnText(status);
    button.classList.toggle('active', !!status.i_follow);
  }
  document.querySelectorAll('[data-author-followers]').forEach(function(node) {
    node.textContent = _formatReaderCount(status.follower_count);
  });
  document.querySelectorAll('[data-author-following]').forEach(function(node) {
    node.textContent = _formatReaderCount(status.following_count);
  });
}

async function loadReaderSidebar(post) {
  if (!post || !post.id) return;
  try {
    var response = await fetch('/api/forum/posts/' + post.id + '/sidebar?limit=4');
    var payload = await response.json();
    if (payload.status !== 'success') return;

    var data = payload.data || {};
    var authorCard = document.getElementById('readerAuthorCard');
    var authorPosts = document.getElementById('readerAuthorPosts');
    var relatedPosts = document.getElementById('readerRelatedPosts');
    var hotPosts = document.getElementById('readerHotPosts');

    if (authorCard) {
      authorCard.innerHTML = renderReaderAuthor(data.author);
    }
    var authorPostItems = Array.isArray(data.author_posts) ? data.author_posts.slice(0, 3) : [];
    var relatedPostItems = Array.isArray(data.related_posts) ? data.related_posts.slice(0, 2) : [];
    var hotPostItems = Array.isArray(data.hot_posts) ? data.hot_posts.slice(0, 2) : [];
    var authorProfileUrl = data.author && data.author.id ? '/user/' + data.author.id : '/forum';
    var boardUrl = post.board_id ? '/forum/board/' + post.board_id : '/forum';

    if (authorPosts) {
      authorPosts.innerHTML = renderReaderPostList(authorPostItems, '作者还没有其他帖子', '查看作者主页', authorProfileUrl);
    }
    if (relatedPosts) {
      relatedPosts.innerHTML = renderReaderPostList(relatedPostItems, '暂时没有更相关的帖子', '查看同版块更多', boardUrl);
    }
    if (hotPosts) {
      hotPosts.innerHTML = renderReaderPostList(hotPostItems, '当前没有热门帖子', '返回论坛', '/forum');
    }
  } catch (error) {
    console.error(error);
  }
}

function _setReaderTocMeta(text) {
  var meta = document.getElementById('readerTocMeta');
  if (meta) meta.textContent = text;
}

function _setReaderTocHint(text) {
  var hint = document.getElementById('readerTocHint');
  if (!hint) return;
  hint.textContent = text || '';
  hint.style.display = text ? 'block' : 'none';
}

function _renderReaderTocPreview() {
  var list = document.getElementById('readerTocList');
  if (!list) return;
  if (!_readerTocEntries.length) {
    list.innerHTML = '<div class="forum-reader-empty">正文暂无可导航标题</div>';
    _setReaderTocHint('');
    return;
  }

  var maxVisible = isReaderMobileTocMode() ? _readerTocEntries.length : 9;
  var activeIndex = _readerTocEntries.findIndex(function(item) { return item.id === _readerTocActiveId; });
  if (activeIndex < 0) activeIndex = 0;

  var start = 0;
  if (_readerTocEntries.length > maxVisible) {
    start = Math.max(0, Math.min(activeIndex - 3, _readerTocEntries.length - maxVisible));
  }
  var end = Math.min(_readerTocEntries.length, start + maxVisible);
  var visibleEntries = _readerTocEntries.slice(start, end);
  var parts = [];

  if (start > 0) {
    parts.push('<div class="forum-reader-toc-hint">前面还有 ' + start + ' 节</div>');
  }

  parts.push(visibleEntries.map(function(item) {
    return '<button type="button" class="forum-reader-toc-item ' + item.levelClass + (item.id === _readerTocActiveId ? ' active' : '') + '" data-target="' + item.id + '" onclick="scrollToReaderHeading(\'' + item.id + '\')">' + _readerEsc(item.label) + '</button>';
  }).join(''));

  if (end < _readerTocEntries.length) {
    parts.push('<div class="forum-reader-toc-hint">后面还有 ' + (_readerTocEntries.length - end) + ' 节</div>');
  }

  list.innerHTML = parts.join('');
  _setReaderTocHint(_readerTocEntries.length > maxVisible ? '目录已收敛展示，滚动正文会自动跟随。' : '');
}

function getReaderScrollContainer() {
  return document.getElementById('readerContentColumn');
}

function isReaderDesktopScrollMode() {
  return window.matchMedia('(min-width: 901px)').matches;
}

function scrollToReaderHeading(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var container = getReaderScrollContainer();
  if (isReaderDesktopScrollMode() && container) {
    var top = el.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop - 18;
    container.scrollTo({top: top, behavior: 'smooth'});
    return;
  }
  var topbar = document.querySelector('.forum-reader-topbar');
  var offset = (topbar ? topbar.offsetHeight : 0) + 18;
  var windowTop = el.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({top: windowTop, behavior: 'smooth'});
  closeTocDrawer();
}

function _setActiveReaderToc(id) {
  _readerTocActiveId = id || '';
  _renderReaderTocPreview();
}

function buildReaderToc() {
  var body = document.querySelector('#postContent .post-body');
  var list = document.getElementById('readerTocList');
  if (!body || !list) return;

  var headings = Array.prototype.slice.call(body.querySelectorAll('h2, h3, h4'));
  if (!headings.length) {
    headings = Array.prototype.slice.call(body.querySelectorAll('h1, h2, h3'));
  }

  if (_readerTocObserver) {
    _readerTocObserver.disconnect();
    _readerTocObserver = null;
  }

  if (!headings.length) {
    _readerTocEntries = [];
    _readerTocActiveId = '';
    _renderReaderTocPreview();
    _setReaderTocMeta('无目录');
    return;
  }

  _readerTocEntries = headings.map(function(node, index) {
    var targetId = node.id || ('reader-heading-' + (index + 1));
    node.id = targetId;
    return {
      id: targetId,
      levelClass: 'level-' + node.tagName.toLowerCase(),
      label: (node.textContent || '').trim() || ('章节 ' + (index + 1))
    };
  });
  _readerTocActiveId = _readerTocEntries[0].id;
  _renderReaderTocPreview();
  _setReaderTocMeta(headings.length + ' 节');

  var observerRoot = (isReaderDesktopScrollMode() && getReaderScrollContainer()) ? getReaderScrollContainer() : null;
  _readerTocObserver = new IntersectionObserver(function(entries) {
    var visible = entries.filter(function(entry) { return entry.isIntersecting; });
    if (!visible.length) return;
    visible.sort(function(a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });
    _setActiveReaderToc(visible[0].target.id);
  }, {
    root: observerRoot,
    rootMargin: observerRoot ? '-18px 0px -72% 0px' : '-120px 0px -60% 0px',
    threshold: [0, 1]
  });

  headings.forEach(function(node) {
    _readerTocObserver.observe(node);
  });
  _setActiveReaderToc(headings[0].id);
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeTocDrawer();
    closeCommentsDrawer();
  }
});

window.addEventListener('resize', syncReaderResponsiveState);
syncReaderResponsiveState();
</script>
