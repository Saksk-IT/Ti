<script>
const API = '/api/forum';
const CURRENT_USER_ID = Number({{ user_id or 0 }});
let currentBoard = (typeof FIXED_BOARD_ID !== 'undefined') ? FIXED_BOARD_ID : '';
let currentSort = 'latest';
let currentFeatured = false;
let currentPage = 1;
let totalPages = 1;
let allPosts = [];
let _postMenuOpenedFor = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function normalizePostTitle(value) {
  const normalized = String(value == null ? '' : value).trim();
  return normalized || '无标题';
}
function fmtTime(s) {
  if (!s) return '';
  const d = new Date(s);
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function isPostOwner(post) {
  return !!CURRENT_USER_ID && Number(post && post.author_id) === CURRENT_USER_ID;
}

function closeAllPostMenus() {
  document.querySelectorAll('.forum-post-owner-actions.open').forEach(el => el.classList.remove('open'));
  _postMenuOpenedFor = null;
}

function togglePostOwnerMenu(event, postId) {
  event.stopPropagation();
  const host = document.querySelector(`.forum-post-owner-actions[data-post-owner-menu="${postId}"]`);
  if (!host) return;
  const shouldOpen = !host.classList.contains('open');
  closeAllPostMenus();
  if (shouldOpen) {
    host.classList.add('open');
    _postMenuOpenedFor = postId;
  }
}

function goEditPost(event, postId) {
  event.stopPropagation();
  window.open(`/forum/post/${postId}/edit`, '_blank');
}

async function togglePostHidden(event, postId, nextHidden) {
  event.stopPropagation();
  closeAllPostMenus();
  try {
    const r = await fetch(`${API}/posts/${postId}/hidden`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hidden: !!nextHidden}),
    }).then(res => res.json());
    if (r.status !== 'success') {
      alert(r.message || '操作失败');
      return;
    }
    currentPage = 1;
    loadPosts();
  } catch (e) {
    alert('操作失败');
  }
}

async function deletePostByAuthor(event, postId) {
  event.stopPropagation();
  closeAllPostMenus();
  if (!confirm('确认删除这篇帖子？删除后不可恢复。')) return;
  try {
    const r = await fetch(`${API}/posts/${postId}`, {method: 'DELETE'}).then(res => res.json());
    if (r.status !== 'success') {
      alert(r.message || '删除失败');
      return;
    }
    currentPage = 1;
    loadPosts();
  } catch (e) {
    alert('删除失败');
  }
}

/* ===== 骨架屏 ===== */
function skeletonCard() {
  return `<div class="forum-post-card forum-skeleton-card" style="pointer-events:none">
    <div class="forum-post-header"><div class="forum-skeleton-avatar"></div><div class="forum-post-meta"><div class="forum-skeleton-row" style="width:120px;height:10px"></div></div></div>
    <div style="margin-bottom:6px"><div class="forum-skeleton-row" style="width:55%;height:14px"></div></div>
    <div style="margin-bottom:10px"><div class="forum-skeleton-row" style="width:90%;margin-bottom:6px"></div><div class="forum-skeleton-row" style="width:70%;margin-bottom:6px"></div><div class="forum-skeleton-row" style="width:45%"></div></div>
    <div class="forum-post-stats"><div class="forum-skeleton-row" style="width:140px;height:10px"></div></div>
  </div>`;
}
function showSkeletons(container, count) {
  container.innerHTML = Array.from({length: count}, skeletonCard).join('');
}

/* ===== Tab 切换 ===== */
function setTab(el, tab) {
  currentSort = tab;
  currentFeatured = false;
  currentPage = 1;
  document.querySelectorAll('.forum-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadPosts();
}

/* 兼容旧的 setSort（board.html 仍用） */
function setSort(el, sort) {
  currentSort = sort; currentFeatured = false; currentPage = 1;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  loadPosts();
}

/* ===== 朋友圈风格帖子卡片 ===== */
function renderPostCard(p) {
  const badges = (p.is_pinned ? '<span class="forum-badge forum-badge-pin">置顶</span>' : '') +
                 (p.is_featured ? '<span class="forum-badge forum-badge-feat">精华</span>' : '') +
                 (p.is_locked ? '<span class="forum-badge forum-badge-lock">锁定</span>' : '') +
                 (p.is_hidden ? '<span class="forum-badge forum-badge-hidden">已隐藏</span>' : '');
  const initial = (p.author_name || 'U')[0].toUpperCase();
  const avatar = p.author_avatar
    ? `<img class="forum-avatar" src="${esc(p.author_avatar)}" alt="">`
    : `<div class="forum-avatar" style="display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--app-primary-soft);color:var(--app-text)">${initial}</div>`;
  const ownerMenu = isPostOwner(p) ? `<div class="forum-post-owner-actions${_postMenuOpenedFor === p.id ? ' open' : ''}" data-post-owner-menu="${p.id}" onclick="event.stopPropagation()">
      <button type="button" class="forum-post-owner-toggle" title="帖子管理" aria-label="帖子管理" onclick="togglePostOwnerMenu(event, ${p.id})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
      </button>
      <div class="forum-post-owner-menu">
        <button type="button" onclick="goEditPost(event, ${p.id})">编辑</button>
        <button type="button" onclick="togglePostHidden(event, ${p.id}, ${p.is_hidden ? 'false' : 'true'})">${p.is_hidden ? '取消隐藏' : '隐藏'}</button>
        <button type="button" class="danger" onclick="deletePostByAuthor(event, ${p.id})">删除</button>
      </div>
    </div>` : '';

  /* 图片网格 — 根据数量自适应 */
  let imgs = '';
  if (p.images && p.images.length) {
    const count = p.images.length;
    const cls = count === 1 ? 'img-grid-1' : count === 2 ? 'img-grid-2' : 'img-grid-3';
    imgs = `<div class="forum-post-img-grid ${cls}">${p.images.slice(0,9).map(u =>
      `<img src="${esc(u)}" alt="" loading="lazy">`
    ).join('')}</div>`;
  }

  /* 题目引用 */
  const refCount = (p.question_refs && p.question_refs.length)
    ? `<span title="引用题目"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg> ${p.question_refs.length}</span>` : '';

  /* 内容预览 */
  const preview = esc((p.summary || p.content_preview || '').toString());
  const cover = p.cover_image
    ? `<div class="forum-post-cover-thumb"><img src="${esc(p.cover_image)}" alt="" loading="lazy"></div>`
    : '';
  const tags = Array.isArray(p.tags) && p.tags.length
    ? `<div class="forum-post-tags">${p.tags.slice(0, 5).map(t => `<span class="forum-post-tag">#${esc(String(t))}</span>`).join('')}</div>`
    : '';

  return `<div class="forum-post-card" onclick="location.href='/forum/post/${p.id}'" data-post-id="${p.id}">
    <div class="forum-post-header"><div class="forum-post-head-main"><a href="/user/${p.author_id}" onclick="event.stopPropagation()" class="forum-avatar-link">${avatar}</a><div class="forum-post-meta"><a href="/user/${p.author_id}" onclick="event.stopPropagation()" class="author forum-user-link">${esc(p.author_name)}</a><span class="forum-board-tag">${esc(p.board_name)}</span></div></div></div>
    ${ownerMenu}
    <div class="forum-post-title">${badges}${esc(normalizePostTitle(p.title))}</div>
    <div class="forum-post-preview">${preview}</div>
    <div class="forum-post-stats"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg> ${p.comment_count||0}</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> ${p.like_count||0}</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg> ${p.view_count||0}</span>${refCount}</div>
    <div class="forum-post-time">${fmtTime(p.created_at)}</div>
    ${cover}
  </div>`;
}

/* 渲染后检测内容高度，添加折叠 */
function applyContentCollapse() {
  document.querySelectorAll('.forum-post-body-wrap').forEach(wrap => {
    if (wrap.dataset.collapsed) return;
    wrap.dataset.collapsed = '1';
    const inner = wrap.querySelector('.forum-post-body-inner');
    if (!inner) return;
    if (inner.scrollHeight > 300) {
      wrap.classList.add('collapsed');
      const btn = document.createElement('button');
      btn.className = 'forum-expand-btn';
      btn.textContent = '展开全文';
      btn.onclick = function(e) {
        e.stopPropagation();
        location.href = '/forum/post/' + wrap.closest('.forum-post-card').dataset.postId;
      };
      wrap.appendChild(btn);
    }
  });
}

/* ===== 加载帖子 ===== */
async function loadPosts() {
  closeAllPostMenus();
  const isFav = typeof IS_FAVORITES_PAGE !== 'undefined' && IS_FAVORITES_PAGE;
  let url = isFav ? API + '/my/favorites' : API + '/posts';
  const params = new URLSearchParams({page: currentPage, per_page: 20, sort: currentSort});
  if (currentBoard) params.set('board_id', currentBoard);
  if (currentFeatured) params.set('featured', '1');
  url += '?' + params.toString();

  const list = document.getElementById('postsList');
  const empty = document.getElementById('emptyState');
  const more = document.getElementById('loadMore');

  // 首页加载时显示骨架屏
  if (currentPage === 1) {
    showSkeletons(list, 5);
    list.classList.remove('fade-in');
  }

  try {
    const r = await fetch(url).then(r => r.json());
    if (r.status !== 'success') return;
    const data = r.data;
    totalPages = Math.ceil(data.total / data.per_page);

    if (currentPage === 1) allPosts = [];
    allPosts = allPosts.concat(data.posts);

    if (!allPosts.length) { list.innerHTML = ''; empty.style.display = 'block'; more.style.display = 'none'; return; }
    empty.style.display = 'none';
    list.innerHTML = allPosts.map(renderPostCard).join('');
    more.style.display = currentPage < totalPages ? 'block' : 'none';

    // 淡入动画
    list.classList.remove('fade-in');
    void list.offsetWidth; // 强制 reflow 重置动画
    list.classList.add('fade-in');

    // 应用内容折叠
    requestAnimationFrame(applyContentCollapse);
  } catch(e) { console.error(e); }
}

function loadMore() { currentPage++; loadPosts(); }

/* ===== 版块详情页 header（board.html 用） ===== */
async function loadBoardHeader() {
  if (typeof FIXED_BOARD_ID === 'undefined') return;
  try {
    const r = await fetch(API + '/boards').then(r => r.json());
    if (r.status !== 'success') return;
    const b = r.data.boards.find(x => x.id == FIXED_BOARD_ID);
    if (!b) return;
    const el = document.getElementById('boardHeader');
    if (el) el.innerHTML = `<h2>${esc(b.name)}</h2><p>${esc(b.description)}</p>`;
  } catch(e) {}
}

/* ===== 兼容旧版块导航（board.html 用） ===== */
function selectBoard(el, boardId) {
  currentBoard = boardId; currentPage = 1;
  document.querySelectorAll('.board-chip').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  loadPosts();
}
async function loadBoards() {
  const bar = document.getElementById('boardsBar');
  if (!bar) return;
  try {
    const r = await fetch(API + '/boards').then(r => r.json());
    if (r.status !== 'success') return;
    const chips = r.data.boards.map(b =>
      `<button class="board-chip${currentBoard == b.id ? ' active' : ''}" data-board-id="${b.id}" onclick="selectBoard(this,'${b.id}')">${esc(b.name)}</button>`
    ).join('');
    bar.innerHTML = `<button class="board-chip${!currentBoard ? ' active' : ''}" data-board-id="" onclick="selectBoard(this,'')">全部</button>` + chips;
  } catch(e) { console.error(e); }
}

// 初始化
document.addEventListener('click', closeAllPostMenus);
loadBoards(); loadPosts(); loadBoardHeader();
</script>
