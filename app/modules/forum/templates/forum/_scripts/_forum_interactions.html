<script>
var _postData = null;
var _followLoading = false;

function _esc(value) {
  var div = document.createElement('div');
  div.textContent = value || '';
  return div.innerHTML;
}

function _normalizePostTitle(value) {
  var title = String(value == null ? '' : value).trim();
  return title || '无标题';
}

function _plainText(html) {
  var div = document.createElement('div');
  div.innerHTML = html || '';
  return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
}

function _shouldRenderSummary(summary, htmlContent) {
  var normalizedSummary = String(summary || '').replace(/\s+/g, ' ').trim();
  if (!normalizedSummary) return false;
  var contentText = _plainText(htmlContent);
  if (!contentText) return true;
  var contentLead = contentText.slice(0, Math.max(normalizedSummary.length + 24, 120));
  return !(contentLead.includes(normalizedSummary) || normalizedSummary.includes(contentLead.slice(0, normalizedSummary.length)));
}

function renderQuestionRefs(refs) {
  if (!refs || !refs.length) return '';
  return '<div class="forum-question-refs">' + refs.map(function(ref) {
    var qid = typeof ref === 'object' ? (ref.id || ref.question_id) : ref;
    var label = typeof ref === 'object' && ref.title ? ref.title : '题目 #' + qid;
    return '<a class="forum-qref-card" href="/quiz?question_id=' + qid + '" target="_blank">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2"/></svg>' +
      '<span>' + label + '</span></a>';
  }).join('') + '</div>';
}

function _followBtnText(status) {
  if (!status) return '关注';
  if (status.mutual) return '互相关注';
  if (status.i_follow) return '已关注';
  return '关注';
}

function getCurrentForumUserId() {
  if (typeof FORUM_CURRENT_USER_ID !== 'undefined') return Number(FORUM_CURRENT_USER_ID || 0);
  if (typeof CURRENT_USER_ID !== 'undefined') return Number(CURRENT_USER_ID || 0);
  if (typeof MY_USER_ID !== 'undefined') return Number(MY_USER_ID || 0);
  return 0;
}

function canManagePost(post) {
  if (!post) return false;
  return Number(post.author_id || 0) === getCurrentForumUserId() || !!FORUM_CAN_MODERATE;
}

function buildPostStats(post) {
  var stats = [
    {
      key: 'views',
      icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>',
      label: '浏览',
      count: (post.view_count || 0)
    },
    {
      key: 'comments',
      icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
      label: '评论',
      count: (post.comment_count || 0)
    },
    {
      key: 'likes',
      icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>',
      label: '点赞',
      count: (post.like_count || 0)
    },
    {
      key: 'favorites',
      icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
      label: '收藏',
      count: (post.favorite_count || 0)
    }
  ];

  return '<div class="forum-reader-stats">' + stats.map(function(item) {
    return '<span class="forum-reader-stat">' + item.icon + '<span data-reader-stat="' + item.key + '">' + item.count + '</span><span>' + item.label + '</span></span>';
  }).join('') + '</div>';
}

async function toggleFollowAuthor() {
  if (_followLoading || !_postData) return;

  _followLoading = true;
  var buttons = Array.prototype.slice.call(document.querySelectorAll('[data-follow-author]'));
  var btn = buttons.length ? buttons[0] : null;
  buttons.forEach(function(button) { button.disabled = true; });

  try {
    var isFollowing = btn && btn.classList.contains('active');
    var url = isFollowing ? '/api/user/unfollow' : '/api/user/follow';
    var response = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target_id: _postData.author_id})
    });
    var payload = await response.json();

    if (payload.status === 'success' && payload.data) {
      syncReaderAuthorState(payload.data);
    }
  } catch (error) {
    console.error(error);
  }

  _followLoading = false;
  buttons.forEach(function(button) { button.disabled = false; });
}

async function loadPostDetail() {
  try {
    var response = await fetch('/api/forum/posts/' + POST_ID);
    var payload = await response.json();

    if (payload.status !== 'success') {
      document.getElementById('postContent').innerHTML = '<div class="forum-empty">帖子不存在</div>';
      syncReaderMeta({title: '帖子不存在', board_name: '论坛'});
      return;
    }

    var post = payload.data;
    _postData = Object.assign({}, post);

    var badges = (post.is_pinned ? '<span class="forum-badge forum-badge-pin">置顶</span>' : '') +
      (post.is_featured ? '<span class="forum-badge forum-badge-feat">精华</span>' : '') +
      (post.is_locked ? '<span class="forum-badge forum-badge-lock">已锁定</span>' : '') +
      (post.is_hidden ? '<span class="forum-badge forum-badge-hidden">已隐藏</span>' : '');

    var summaryHtml = (post.summary && _shouldRenderSummary(post.summary, post.content))
      ? '<div class="forum-reader-summary">' + _esc(post.summary) + '</div>'
      : '';

    var cover = post.cover_image
      ? '<div class="forum-post-cover"><img src="' + _esc(post.cover_image) + '" alt=""></div>'
      : '';

    var tagsHtml = Array.isArray(post.tags) && post.tags.length
      ? '<div class="forum-post-tags">' + post.tags.map(function(tag) {
          return '<span class="forum-post-tag">#' + _esc(String(tag)) + '</span>';
        }).join('') + '</div>'
      : '';

    var galleryImages = Array.isArray(post.images)
      ? post.images.filter(function(url) {
          return !!url && url !== post.cover_image;
        })
      : [];
    var galleryHtml = '';
    if (galleryImages.length) {
      var imageClass = galleryImages.length === 1 ? 'img-grid-1' : (galleryImages.length === 2 ? 'img-grid-2' : 'img-grid-3');
      galleryHtml = '<div class="forum-post-img-grid ' + imageClass + '">' + galleryImages.slice(0, 9).map(function(url) {
        return '<img src="' + _esc(url) + '" alt="帖子图片" loading="lazy">';
      }).join('') + '</div>';
    }

    var questionRefs = renderQuestionRefs(post.question_refs);
    var metaBits = [
      '<span class="forum-board-tag">' + _esc(post.board_name || '论坛') + '</span>',
      '<span class="forum-reader-meta-dot"></span>',
      '<span>' + new Date(post.created_at).toLocaleString('zh-CN') + '</span>'
    ];

    var badgeStrip = badges ? '<div class="forum-reader-flag-strip">' + badges + '</div>' : '';

    document.getElementById('postContent').innerHTML = [
      badgeStrip,
      '<div class="post-title">' + _esc(_normalizePostTitle(post.title)) + '</div>',
      '<div class="forum-reader-meta-strip">',
      metaBits.join(''),
      '</div>',
      summaryHtml,
      tagsHtml,
      cover,
      '<div class="post-body">' + (post.content || '') + '</div>',
      galleryHtml,
      questionRefs,
      buildPostStats(post)
    ].join('');

    var likedClass = post.liked ? ' active' : '';
    var favoritedClass = post.favorited ? ' active' : '';
    var ownerActions = canManagePost(post)
      ? '<div class="forum-author-actions">' +
          '<button class="forum-action-btn" onclick="goEditCurrentPost()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg> 编辑</button>' +
          '<button class="forum-action-btn" onclick="toggleCurrentPostHidden()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C7 20 2.73 16.89 1 12c.8-2.28 2.23-4.23 4.1-5.66"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c5 0 9.27 3.11 11 8a11.05 11.05 0 0 1-4.08 5.65"/><path d="M1 1l22 22"/></svg> ' + (post.is_hidden ? '取消隐藏' : '隐藏') + '</button>' +
          '<button class="forum-action-btn danger" onclick="deleteCurrentPost()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg> 删除</button>' +
        '</div>'
      : '';

    document.getElementById('actionsBar').innerHTML = [
      '<button class="forum-action-btn' + likedClass + '" id="likeBtn" data-post-like-toggle onclick="toggleLike()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> 点赞 <span data-post-like-count>' + (post.like_count || 0) + '</span></button>',
      '<button class="forum-action-btn' + favoritedClass + '" id="favBtn" data-post-fav-toggle onclick="toggleFav()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> 收藏 <span data-post-fav-count>' + (post.favorite_count || 0) + '</span></button>',
      '<button class="forum-action-btn" onclick="openCommentsDrawer()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg> 评论 <span data-post-comment-count>' + (post.comment_count || 0) + '</span></button>',
      '<button class="forum-action-btn" onclick="openForwardModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg> 转发</button>',
      '<button class="forum-action-btn" onclick="openReportModal(\'post\',' + POST_ID + ')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg> 举报</button>',
      ownerActions
    ].join('');

    if (post.is_locked) {
      var commentInput = document.getElementById('commentInput');
      if (commentInput) {
        commentInput.innerHTML = '<div class="forum-locked-notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> 该帖子已锁定，无法评论</div>';
      }
    }

    syncReaderMeta(_postData);
    syncReaderActionState(_postData);
    buildReaderToc();
    bindReaderScrollTracking();
    updateReaderProgressState();
    loadReaderSidebar(_postData);
  } catch (error) {
    console.error(error);
  }
}

async function toggleLike() {
  try {
    var response = await fetch('/api/forum/like', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target_type: 'post', target_id: POST_ID})
    });
    var payload = await response.json();

    if (payload.status === 'success' && _postData) {
      _postData = Object.assign({}, _postData, {
        liked: !!payload.data.liked,
        like_count: Number(payload.data.like_count || 0)
      });
      syncReaderActionState(_postData);
    }
  } catch (error) {
    console.error(error);
  }
}

async function toggleFav() {
  try {
    var response = await fetch('/api/forum/favorite', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({post_id: POST_ID})
    });
    var payload = await response.json();

    if (payload.status === 'success' && _postData) {
      var delta = payload.data.favorited ? 1 : -1;
      _postData = Object.assign({}, _postData, {
        favorited: !!payload.data.favorited,
        favorite_count: Math.max(Number(_postData.favorite_count || 0) + delta, 0)
      });
      syncReaderActionState(_postData);
    }
  } catch (error) {
    console.error(error);
  }
}

function goEditCurrentPost() {
  if (!_postData) return;
  window.open('/forum/post/' + _postData.id + '/edit', '_blank');
}

async function toggleCurrentPostHidden() {
  if (!_postData || !canManagePost(_postData)) return;

  var nextHidden = !_postData.is_hidden;
  try {
    var response = await fetch('/api/forum/posts/' + POST_ID + '/hidden', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hidden: nextHidden})
    });
    var payload = await response.json();

    if (payload.status !== 'success') {
      alert(payload.message || '操作失败');
      return;
    }

    _postData = Object.assign({}, _postData, {is_hidden: nextHidden});
    await loadPostDetail();
  } catch (error) {
    alert('操作失败');
  }
}

async function deleteCurrentPost() {
  if (!_postData || !canManagePost(_postData)) return;
  if (!confirm('确认删除这篇帖子？删除后不可恢复。')) return;

  try {
    var response = await fetch('/api/forum/posts/' + POST_ID, {method: 'DELETE'});
    var payload = await response.json();

    if (payload.status !== 'success') {
      alert(payload.message || '删除失败');
      return;
    }

    location.href = '/forum';
  } catch (error) {
    alert('删除失败');
  }
}
</script>
