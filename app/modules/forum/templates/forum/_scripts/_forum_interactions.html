<script>
// 帖子详情页：加载帖子 + 互动按钮 + 关注
var _postData = null; // 缓存帖子数据供其他模块使用
var _followLoading = false;

function renderQuestionRefs(refs) {
  if (!refs || !refs.length) return '';
  return '<div class="forum-question-refs">' + refs.map(function(ref) {
    var qid = typeof ref === 'object' ? (ref.id || ref.question_id) : ref;
    var label = typeof ref === 'object' && ref.title ? ref.title : '题目 #' + qid;
    return '<a class="forum-qref-card" href="/quiz?question_id=' + qid + '" target="_blank">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2"/></svg>' +
      '<span>' + label + '</span></a>';
  }).join('') + '</div>';
}

function _followBtnText(status) {
  if (!status) return '关注';
  if (status.mutual) return '互相关注';
  if (status.i_follow) return '已关注';
  return '关注';
}

function _followBtnClass(status) {
  if (!status) return '';
  if (status.i_follow) return ' active';
  return '';
}

async function toggleFollowAuthor() {
  if (_followLoading || !_postData) return;
  var authorId = _postData.author_id;
  if (!authorId) return;

  _followLoading = true;
  var btn = document.getElementById('followAuthorBtn');
  if (btn) btn.disabled = true;

  try {
    var isFollowing = btn && btn.classList.contains('active');
    var url = isFollowing ? '/api/user/unfollow' : '/api/user/follow';
    var r = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target_id: authorId})
    });
    var js = await r.json();
    if (js.status === 'success' && js.data) {
      if (btn) {
        btn.textContent = _followBtnText(js.data);
        btn.classList.toggle('active', !!js.data.i_follow);
      }
    }
  } catch(e) {}
  _followLoading = false;
  if (btn) btn.disabled = false;
}

async function loadPostDetail() {
  try {
    const r = await fetch(`/api/forum/posts/${POST_ID}`).then(r => r.json());
    if (r.status !== 'success') { document.getElementById('postContent').innerHTML = '<div class="forum-empty">帖子不存在</div>'; return; }
    const p = r.data;
    _postData = p;
    const avatar = p.author_avatar ? `<a href="/user/${p.author_id}" class="forum-avatar-link"><img class="forum-avatar" src="${p.author_avatar}" alt=""></a>` : `<a href="/user/${p.author_id}" class="forum-avatar-link"><div class="forum-avatar"></div></a>`;
    const badges = (p.is_pinned ? '<span class="forum-badge forum-badge-pin">置顶</span>' : '') +
                   (p.is_featured ? '<span class="forum-badge forum-badge-feat">精华</span>' : '') +
                   (p.is_locked ? '<span class="forum-badge forum-badge-lock">已锁定</span>' : '');
    const imgs = (p.images && p.images.length) ? p.images.map(u => `<img src="${u}" alt="" style="max-width:100%;border-radius:8px;margin:8px 0">`).join('') : '';
    const qrefs = renderQuestionRefs(p.question_refs);

    // 关注按钮（非自己的帖子时显示）
    var followHtml = '';
    var currentUserId = 0;
    try { currentUserId = typeof MY_USER_ID !== 'undefined' ? MY_USER_ID : (typeof CURRENT_USER_ID !== 'undefined' ? CURRENT_USER_ID : 0); } catch(e) {}

    if (p.author_id && p.author_id !== currentUserId) {
      followHtml = ' <button class="forum-follow-btn" id="followAuthorBtn" onclick="toggleFollowAuthor()">关注</button>';
    }

    document.getElementById('postContent').innerHTML = `
      <div class="forum-post-header">${avatar}<div class="forum-post-meta"><a href="/user/${p.author_id}" class="author forum-user-link">${p.author_name}</a>${followHtml} · ${new Date(p.created_at).toLocaleString('zh-CN')}<span class="forum-board-tag">${p.board_name}</span></div></div>
      <div class="post-title">${badges}${p.title}</div>
      <div class="post-body">${p.content}${imgs}</div>
      ${qrefs}
      <div class="forum-post-stats" style="margin-top:16px"><span>&#128065; ${p.view_count||0} 浏览</span></div>`;

    const liked = p.liked ? ' active' : '';
    const faved = p.favorited ? ' active' : '';
    document.getElementById('actionsBar').innerHTML = `
      <button class="forum-action-btn${liked}" id="likeBtn" onclick="toggleLike()">&#10084; <span id="likeCount">${p.like_count||0}</span></button>
      <button class="forum-action-btn${faved}" id="favBtn" onclick="toggleFav()">&#9733; <span id="favCount">${p.favorite_count||0}</span></button>
      <button class="forum-action-btn" onclick="openForwardModal()">&#8618; 转发</button>
      <button class="forum-action-btn" onclick="openReportModal('post',${POST_ID})">&#9888; 举报</button>`;

    // 锁定帖子：隐藏评论输入框，显示锁定提示
    const commentInput = document.getElementById('commentInput');
    if (p.is_locked && commentInput) {
      commentInput.innerHTML = '<div class="forum-locked-notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> 该帖子已锁定，无法评论</div>';
    }

    // 加载关注状态
    if (p.author_id && p.author_id !== currentUserId) {
      try {
        var fRes = await fetch('/api/user/' + p.author_id + '/follow_status');
        var fJs = await fRes.json();
        if (fJs.status === 'success' && fJs.data) {
          var fbtn = document.getElementById('followAuthorBtn');
          if (fbtn) {
            fbtn.textContent = _followBtnText(fJs.data);
            fbtn.classList.toggle('active', !!fJs.data.i_follow);
          }
        }
      } catch(e) {}
    }
  } catch(e) { console.error(e); }
}

async function toggleLike() {
  try {
    const r = await fetch('/api/forum/like', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_type:'post',target_id:POST_ID})}).then(r=>r.json());
    if (r.status === 'success') {
      const btn = document.getElementById('likeBtn');
      btn.classList.toggle('active', r.data.liked);
      const cnt = document.getElementById('likeCount');
      cnt.textContent = parseInt(cnt.textContent) + (r.data.liked ? 1 : -1);
    }
  } catch(e) {}
}

async function toggleFav() {
  try {
    const r = await fetch('/api/forum/favorite', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({post_id:POST_ID})}).then(r=>r.json());
    if (r.status === 'success') {
      const btn = document.getElementById('favBtn');
      btn.classList.toggle('active', r.data.favorited);
      const cnt = document.getElementById('favCount');
      cnt.textContent = parseInt(cnt.textContent) + (r.data.favorited ? 1 : -1);
    }
  } catch(e) {}
}

// loadPostDetail 由 post_detail.html 的 Promise.all 统一调用
</script>
