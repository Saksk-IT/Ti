<script>
// 帖子详情页：加载帖子 + 互动按钮 + 关注
var _postData = null; // 缓存帖子数据供其他模块使用
var _followLoading = false;

function _esc(value) {
  var div = document.createElement('div');
  div.textContent = value || '';
  return div.innerHTML;
}

function _normalizePostTitle(value) {
  var title = String(value == null ? '' : value).trim();
  return title || '无标题';
}

function renderQuestionRefs(refs) {
  if (!refs || !refs.length) return '';
  return '<div class="forum-question-refs">' + refs.map(function(ref) {
    var qid = typeof ref === 'object' ? (ref.id || ref.question_id) : ref;
    var label = typeof ref === 'object' && ref.title ? ref.title : '题目 #' + qid;
    return '<a class="forum-qref-card" href="/quiz?question_id=' + qid + '" target="_blank">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="2"/></svg>' +
      '<span>' + label + '</span></a>';
  }).join('') + '</div>';
}

function _followBtnText(status) {
  if (!status) return '关注';
  if (status.mutual) return '互相关注';
  if (status.i_follow) return '已关注';
  return '关注';
}

function _followBtnClass(status) {
  if (!status) return '';
  if (status.i_follow) return ' active';
  return '';
}

function getCurrentForumUserId() {
  if (typeof FORUM_CURRENT_USER_ID !== 'undefined') return Number(FORUM_CURRENT_USER_ID || 0);
  if (typeof CURRENT_USER_ID !== 'undefined') return Number(CURRENT_USER_ID || 0);
  if (typeof MY_USER_ID !== 'undefined') return Number(MY_USER_ID || 0);
  return 0;
}

function canManagePost(post) {
  if (!post) return false;
  return Number(post.author_id || 0) === getCurrentForumUserId();
}

async function toggleFollowAuthor() {
  if (_followLoading || !_postData) return;
  var authorId = _postData.author_id;
  if (!authorId) return;

  _followLoading = true;
  var btn = document.getElementById('followAuthorBtn');
  if (btn) btn.disabled = true;

  try {
    var isFollowing = btn && btn.classList.contains('active');
    var url = isFollowing ? '/api/user/unfollow' : '/api/user/follow';
    var r = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({target_id: authorId})
    });
    var js = await r.json();
    if (js.status === 'success' && js.data) {
      if (btn) {
        btn.textContent = _followBtnText(js.data);
        btn.classList.toggle('active', !!js.data.i_follow);
      }
    }
  } catch(e) {}
  _followLoading = false;
  if (btn) btn.disabled = false;
}

async function loadPostDetail() {
  try {
    const r = await fetch(`/api/forum/posts/${POST_ID}`).then(r => r.json());
    if (r.status !== 'success') { document.getElementById('postContent').innerHTML = '<div class="forum-empty">帖子不存在</div>'; return; }
    const p = r.data;
    _postData = p;
    const avatar = p.author_avatar ? `<a href="/user/${p.author_id}" class="forum-avatar-link"><img class="forum-avatar" src="${p.author_avatar}" alt=""></a>` : `<a href="/user/${p.author_id}" class="forum-avatar-link"><div class="forum-avatar"></div></a>`;
    const badges = (p.is_pinned ? '<span class="forum-badge forum-badge-pin">置顶</span>' : '') +
                   (p.is_featured ? '<span class="forum-badge forum-badge-feat">精华</span>' : '') +
                   (p.is_locked ? '<span class="forum-badge forum-badge-lock">已锁定</span>' : '') +
                   (p.is_hidden ? '<span class="forum-badge forum-badge-hidden">已隐藏</span>' : '');
    const imgs = (p.images && p.images.length) ? p.images.map(u => `<img src="${u}" alt="" style="max-width:100%;border-radius:8px;margin:8px 0">`).join('') : '';
    const cover = p.cover_image ? `<div class="forum-post-cover"><img src="${_esc(p.cover_image)}" alt=""></div>` : '';
    const tagsHtml = (Array.isArray(p.tags) && p.tags.length)
      ? `<div class="forum-post-tags">${p.tags.map(tag => `<span class="forum-post-tag">#${_esc(String(tag))}</span>`).join('')}</div>`
      : '';
    const summaryHtml = p.summary ? `<div class="forum-post-preview">${_esc(p.summary)}</div>` : '';
    const qrefs = renderQuestionRefs(p.question_refs);

    // 关注按钮（非自己的帖子时显示）
    var followHtml = '';
    var currentUserId = getCurrentForumUserId();

    if (p.author_id && p.author_id !== currentUserId) {
      followHtml = ' <button class="forum-follow-btn" id="followAuthorBtn" onclick="toggleFollowAuthor()">关注</button>';
    }

    document.getElementById('postContent').innerHTML = `
      <div class="forum-post-header">${avatar}<div class="forum-post-meta"><a href="/user/${p.author_id}" class="author forum-user-link">${_esc(p.author_name)}</a>${followHtml} · ${new Date(p.created_at).toLocaleString('zh-CN')}<span class="forum-board-tag">${_esc(p.board_name)}</span></div></div>
      <div class="post-title">${badges}${_esc(_normalizePostTitle(p.title))}</div>
      ${summaryHtml}
      ${cover}
      ${tagsHtml}
      <div class="post-body">${p.content}${imgs}</div>
      ${qrefs}
      <div class="forum-post-stats" style="margin-top:16px"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg> ${p.view_count||0} 浏览</span></div>`;

    const liked = p.liked ? ' active' : '';
    const faved = p.favorited ? ' active' : '';
    const ownerActions = canManagePost(p)
      ? `<div class="forum-author-actions">
          <button class="forum-action-btn" onclick="goEditCurrentPost()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg> 编辑</button>
          <button class="forum-action-btn" onclick="toggleCurrentPostHidden()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C7 20 2.73 16.89 1 12c.8-2.28 2.23-4.23 4.1-5.66"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c5 0 9.27 3.11 11 8a11.05 11.05 0 0 1-4.08 5.65"/><path d="M1 1l22 22"/></svg> ${p.is_hidden ? '取消隐藏' : '隐藏'}</button>
          <button class="forum-action-btn danger" onclick="deleteCurrentPost()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg> 删除</button>
        </div>`
      : '';
    document.getElementById('actionsBar').innerHTML = `
      <button class="forum-action-btn${liked}" id="likeBtn" onclick="toggleLike()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> <span id="likeCount">${p.like_count||0}</span></button>
      <button class="forum-action-btn${faved}" id="favBtn" onclick="toggleFav()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> <span id="favCount">${p.favorite_count||0}</span></button>
      <button class="forum-action-btn" onclick="openForwardModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg> 转发</button>
      <button class="forum-action-btn" onclick="openReportModal('post',${POST_ID})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg> 举报</button>
      ${ownerActions}`;

    // 锁定帖子：隐藏评论输入框，显示锁定提示
    const commentInput = document.getElementById('commentInput');
    if (p.is_locked && commentInput) {
      commentInput.innerHTML = '<div class="forum-locked-notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg> 该帖子已锁定，无法评论</div>';
    }

    // 加载关注状态
    if (p.author_id && p.author_id !== currentUserId) {
      try {
        var fRes = await fetch('/api/user/' + p.author_id + '/follow_status');
        var fJs = await fRes.json();
        if (fJs.status === 'success' && fJs.data) {
          var fbtn = document.getElementById('followAuthorBtn');
          if (fbtn) {
            fbtn.textContent = _followBtnText(fJs.data);
            fbtn.classList.toggle('active', !!fJs.data.i_follow);
          }
        }
      } catch(e) {}
    }
  } catch(e) { console.error(e); }
}

async function toggleLike() {
  try {
    const r = await fetch('/api/forum/like', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_type:'post',target_id:POST_ID})}).then(r=>r.json());
    if (r.status === 'success') {
      const btn = document.getElementById('likeBtn');
      btn.classList.toggle('active', r.data.liked);
      const cnt = document.getElementById('likeCount');
      cnt.textContent = parseInt(cnt.textContent) + (r.data.liked ? 1 : -1);
    }
  } catch(e) {}
}

async function toggleFav() {
  try {
    const r = await fetch('/api/forum/favorite', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({post_id:POST_ID})}).then(r=>r.json());
    if (r.status === 'success') {
      const btn = document.getElementById('favBtn');
      btn.classList.toggle('active', r.data.favorited);
      const cnt = document.getElementById('favCount');
      cnt.textContent = parseInt(cnt.textContent) + (r.data.favorited ? 1 : -1);
    }
  } catch(e) {}
}

function goEditCurrentPost() {
  if (!_postData) return;
  window.open(`/forum/post/${_postData.id}/edit`, '_blank');
}

async function toggleCurrentPostHidden() {
  if (!_postData || !canManagePost(_postData)) return;
  const nextHidden = !_postData.is_hidden;
  try {
    const r = await fetch(`/api/forum/posts/${POST_ID}/hidden`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hidden: nextHidden}),
    }).then(res => res.json());
    if (r.status !== 'success') {
      alert(r.message || '操作失败');
      return;
    }
    _postData = Object.assign({}, _postData, {is_hidden: nextHidden});
    await loadPostDetail();
  } catch(e) {
    alert('操作失败');
  }
}

async function deleteCurrentPost() {
  if (!_postData || !canManagePost(_postData)) return;
  if (!confirm('确认删除这篇帖子？删除后不可恢复。')) return;
  try {
    const r = await fetch(`/api/forum/posts/${POST_ID}`, {method: 'DELETE'}).then(res => res.json());
    if (r.status !== 'success') {
      alert(r.message || '删除失败');
      return;
    }
    location.href = '/forum';
  } catch(e) {
    alert('删除失败');
  }
}

// loadPostDetail 由 post_detail.html 的 Promise.all 统一调用
</script>
