<div class="forum-comment" id="comment-{{ comment.id }}">
  <div class="comment-header">
    {% if comment.author_avatar %}
    <img class="forum-avatar" src="{{ comment.author_avatar }}" alt="">
    {% else %}
    <div class="forum-avatar"></div>
    {% endif %}
    <span style="font-weight:500">{{ comment.author_name }}</span>
    <span style="font-size:12px;color:var(--app-muted);margin-left:auto">{{ comment.created_at }}</span>
  </div>
  <div class="comment-body">{{ comment.content }}</div>
  <div class="comment-footer">
    <button onclick="setReply({{ comment.id }},{{ comment.author_id }},'{{ comment.author_name }}')">回复</button>
    <button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> {{ comment.like_count or 0 }}</button>
  </div>
</div>
