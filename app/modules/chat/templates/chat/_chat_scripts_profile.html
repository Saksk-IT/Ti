{# chat/_chat_scripts_profile.html — JS: 好友资料页弹层逻辑 #}
<script>
  // 好友资料页
  let currentProfileUserId = 0;
  const PROFILE_WORKS_PAGE_SIZE = 3;

  function setProfileWorksLoading(){
    const grid = document.getElementById('upWorksGrid');
    if (!grid) return;
    grid.innerHTML = [
      '<div class="up-dynamic-skel"></div>',
      '<div class="up-dynamic-skel"></div>',
      '<div class="up-dynamic-skel"></div>',
    ].join('');
  }

  function setProfileWorksEmpty(text){
    const grid = document.getElementById('upWorksGrid');
    if (!grid) return;
    const t = String(text || '暂无动态');
    grid.innerHTML = `<div class="up-dynamic-empty">${t}</div>`;
  }

  function profileWorkUrl(item){
    const id = Number(item && item.id || 0);
    if (!id) return '#';
    return item && item.item_type === 'bank'
      ? ('/bank/' + id + '/detail')
      : ('/forum/post/' + id);
  }

  function createProfileWorkCard(item){
    const card = document.createElement('a');
    card.className = 'up-dynamic-item';
    card.href = profileWorkUrl(item);
    card.target = '_blank';
    card.rel = 'noopener noreferrer';

    const cover = document.createElement('div');
    cover.className = 'up-dynamic-cover';

    const coverImage = String((item && item.cover_image) || '').trim();
    if (coverImage) {
      const img = document.createElement('img');
      img.src = coverImage;
      img.alt = '';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      cover.appendChild(img);
    } else {
      cover.textContent = (item && item.item_type === 'bank') ? '📚' : '📝';
    }

    const badge = document.createElement('span');
    badge.className = 'up-dynamic-badge';
    badge.textContent = (item && item.item_type === 'bank') ? '题库' : '帖子';
    cover.appendChild(badge);

    const meta = document.createElement('div');
    meta.className = 'up-dynamic-meta';

    const title = document.createElement('div');
    title.className = 'up-dynamic-title';
    title.textContent = String((item && item.name) || '未命名内容');

    const sub = document.createElement('div');
    sub.className = 'up-dynamic-sub';
    const stat1 = Number(item && item.stat1 || 0);
    const stat1Label = String((item && item.stat1_label) || '');
    const stat2 = Number(item && item.stat2 || 0);
    const stat2Label = String((item && item.stat2_label) || '');
    sub.textContent = `${stat1}${stat1Label} · ${stat2}${stat2Label}`;

    meta.appendChild(title);
    meta.appendChild(sub);
    card.appendChild(cover);
    card.appendChild(meta);
    return card;
  }

  async function loadProfileWorks(userId){
    const uid = Number(userId || 0);
    if (!uid) return;

    const more = document.getElementById('upDynamicMore');
    if (more) more.href = '/user/' + uid;

    setProfileWorksLoading();
    try {
      const res = await fetch(
        `/api/user/${encodeURIComponent(uid)}/works?page=1&per_page=${PROFILE_WORKS_PAGE_SIZE}&type=all`,
        { credentials: 'include' }
      );
      const js = await res.json().catch(() => ({}));
      if (Number(currentProfileUserId) !== uid) return;

      if (!res.ok || js.status !== 'success' || !js.data) {
        setProfileWorksEmpty('动态加载失败');
        return;
      }

      const items = Array.isArray(js.data.items) ? js.data.items : [];
      const grid = document.getElementById('upWorksGrid');
      if (!grid) return;

      if (!items.length) {
        setProfileWorksEmpty('暂无动态');
        return;
      }

      grid.innerHTML = '';
      items.slice(0, PROFILE_WORKS_PAGE_SIZE).forEach(function (item) {
        grid.appendChild(createProfileWorkCard(item));
      });
    } catch (e) {
      if (Number(currentProfileUserId) !== uid) return;
      setProfileWorksEmpty('动态加载失败');
    }
  }

  function closeUserProfileModal(e){
    if (e) e.stopPropagation();
    const modal = document.getElementById('userProfileModal');
    if (!modal) return;
    if (!e || (e.target && e.target.id === 'userProfileModal')) {
      modal.classList.remove('show');
      currentProfileUserId = 0;
      hideProfileMenu();
      toggleRemarkEdit(false);
    }
  }

  async function openUserProfile(userId){
    if (!userId) return;
    currentProfileUserId = userId;
    const modal = document.getElementById('userProfileModal');
    if (!modal) return;

    modal.classList.add('show');

    // 设置查看主页链接
    const viewProfileLink = document.getElementById('upViewProfileLink');
    if (viewProfileLink) viewProfileLink.href = '/user/' + userId;
    loadProfileWorks(userId);

    try {
      const { res, js } = await Chat.api.getUserProfile(userId);
      if (!res.ok || js.status !== 'success') {
        alert(js.message || '加载资料失败');
        closeUserProfileModal();
        return;
      }
      const u = js.user || {};
      const remark = (js.remark || '').trim();

      const av = document.getElementById('upAvatar');
      if (av) {
        const url = u.avatar || '';
        if (url) {
          av.style.backgroundImage = `url('${String(url).replace(/'/g,'%27')}')`;
          av.style.backgroundSize = 'cover';
          av.style.backgroundPosition = 'center';
          av.style.backgroundRepeat = 'no-repeat';
          av.style.borderRadius = '16px';
          av.textContent = '';
        } else {
          av.style.backgroundImage = '';
          av.style.background = 'var(--primary)';
          av.textContent = (u.username || 'U').slice(0,1).toUpperCase();
        }
      }

      const title = document.getElementById('upTitle');
      if (title) title.textContent = remark || u.username || '用户';
      const navTitle = document.getElementById('upNavTitle');
      if (navTitle) navTitle.textContent = remark || u.username || '好友资料';
      const sub = document.getElementById('upSub');
      if (sub) sub.textContent = `用户名：${u.username || '-'}`;

      const inp = document.getElementById('upRemarkInput');
      if (inp) inp.value = remark || '';

      const elR = document.getElementById('upRemark');
      if (elR) elR.textContent = remark || '未设置';
      const elU = document.getElementById('upUsername');
      if (elU) elU.textContent = u.username || '-';
      const elC = document.getElementById('upContact');
      if (elC) elC.textContent = u.contact || '-';
      const elCo = document.getElementById('upCollege');
      if (elCo) elCo.textContent = u.college || '-';

      const isSelf = (u.id && Number(u.id) === Number(MY_ID));
      const btnEdit = document.getElementById('upEditRemark');
      if (btnEdit) btnEdit.style.display = isSelf ? 'none' : 'inline-flex';
      const editWrap = document.getElementById('upRemarkEdit');
      if (editWrap) editWrap.style.display = 'none';

      // 关注状态
      const followBtn = document.getElementById('upFollowBtn');
      const followCounts = document.getElementById('upFollowCounts');
      if (isSelf) {
        if (followBtn) followBtn.style.display = 'none';
      } else if (followBtn) {
        followBtn.style.display = 'inline-flex';
        followBtn.textContent = '关注';
        followBtn.classList.remove('primary');
        try {
          const fRes = await fetch('/api/user/' + userId + '/follow_status');
          const fJs = await fRes.json();
          if (fJs.status === 'success' && fJs.data) {
            _updateProfileFollowBtn(fJs.data);
            if (followCounts) {
              followCounts.style.display = 'block';
              var fc = document.getElementById('upFollowerCount');
              var gc = document.getElementById('upFollowingCount');
              if (fc) fc.textContent = String(fJs.data.follower_count || 0);
              if (gc) gc.textContent = String(fJs.data.following_count || 0);
            }
          }
        } catch(e) {}
      }
      if (isSelf && followCounts) {
        try {
          const fRes2 = await fetch('/api/user/' + userId + '/follow_status');
          const fJs2 = await fRes2.json();
          if (fJs2.status === 'success' && fJs2.data) {
            followCounts.style.display = 'block';
            var fc2 = document.getElementById('upFollowerCount');
            var gc2 = document.getElementById('upFollowingCount');
            if (fc2) fc2.textContent = String(fJs2.data.follower_count || 0);
            if (gc2) gc2.textContent = String(fJs2.data.following_count || 0);
          }
        } catch(e) {}
      }

    } catch(e) {
      alert('加载资料失败');
      closeUserProfileModal();
    }
  }

  function toggleRemarkEdit(open){
    const wrap = document.getElementById('upRemarkEdit');
    const inp = document.getElementById('upRemarkInput');
    if (!wrap || !inp) return;

    if (open) {
      const curEl = document.getElementById('upRemark');
      const curVal = (curEl && curEl.textContent && curEl.textContent !== '未设置') ? curEl.textContent : '';
      inp.value = curVal;
      wrap.style.display = 'block';
      setTimeout(()=>{ try{ inp.focus(); inp.select(); }catch(e){} }, 0);
    } else {
      wrap.style.display = 'none';
    }
  }

  function profileSendMessage(){
    closeUserProfileModal();
    try {
      const ta = Chat.ui.dom.get('composer');
      if (ta) ta.focus();
    } catch(e) {}
  }

  async function saveRemarkFromProfile(forceValue){
    if (!currentProfileUserId) return;
    if (Number(currentProfileUserId) === Number(MY_ID)) return;

    const inp = document.getElementById('upRemarkInput');
    const btn = document.getElementById('upRemarkSave');
    const v = (typeof forceValue === 'string') ? String(forceValue).trim() : String((inp && inp.value) || '').trim();

    if (v.length > 30) {
      alert('备注过长（最多30字）');
      return;
    }

    setLoading(btn, true);
    try {
      const { res: sRes, js: sJs } = await Chat.api.setUserRemark(currentProfileUserId, v);
      if (!sRes.ok || sJs.status !== 'success') {
        alert((sJs && sJs.message) ? sJs.message : (`设置备注失败（HTTP ${sRes.status}）`));
        return;
      }

      toggleRemarkEdit(false);

      await openUserProfile(currentProfileUserId);

      await refreshConversations();
      try {
        const list = await fetchConversations();
        const cur = (list || []).find(x => x.conversation_id === ChatState.currentConversationId);
        if (cur) {
          const name = (cur.c_type === 'direct' ? (cur.peer_remark || cur.peer_username || '私聊') : (cur.title || '会话'));
          const t = document.getElementById('chatTitle');
          if (t) t.textContent = name;
        }
      } catch(e) {}

      showToast(v ? '备注已更新' : '备注已清除');
    } finally {
      setLoading(btn, false);
    }
  }

  // 资料页右上角菜单
  function toggleProfileMenu(e){
    if (e) { e.preventDefault(); e.stopPropagation(); }
    const menu = document.getElementById('profileMenu');
    if (!menu) return;

    const isOpen = menu.classList.contains('show');
    if (isOpen) { menu.classList.remove('show'); return; }

    const btn = e && e.currentTarget ? e.currentTarget : null;
    if (btn) {
      const r = btn.getBoundingClientRect();
      const mw = 220;
      const mh = 150;
      let left = Math.max(12, Math.min(window.innerWidth - mw - 12, r.right - mw));
      let top = r.bottom + 8;
      if (top + mh > window.innerHeight - 12) top = Math.max(12, r.top - mh - 8);
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    menu.classList.add('show');
  }

  function hideProfileMenu(){
    const menu = document.getElementById('profileMenu');
    if (menu) menu.classList.remove('show');
  }

  async function profileMenuAction(act){
    hideProfileMenu();
    if (!currentProfileUserId) return;

    if (act === 'edit_remark') {
      toggleRemarkEdit(true);
      return;
    }
    if (act === 'clear_remark') {
      await saveRemarkFromProfile('');
      return;
    }
    if (act === 'copy_username') {
      try {
        const el = document.getElementById('upUsername');
        const txt = (el && el.textContent) ? el.textContent : '';
        if (!txt) return;
        await navigator.clipboard.writeText(txt);
        showToast('已复制用户名');
      } catch(e) {
        showToast('复制失败');
      }
      return;
    }
  }

  document.addEventListener('click', (e)=>{
    const menu = document.getElementById('profileMenu');
    if (!menu || !menu.classList.contains('show')) return;
    if (menu.contains(e.target)) return;
    hideProfileMenu();
  });

  function _updateProfileFollowBtn(status) {
    var btn = document.getElementById('upFollowBtn');
    if (!btn) return;
    if (status.mutual) {
      btn.textContent = '互相关注';
      btn.classList.remove('primary');
      btn.style.background = 'transparent';
      btn.style.color = 'var(--sub)';
      btn.style.border = '1px solid var(--border)';
    } else if (status.i_follow) {
      btn.textContent = '已关注';
      btn.classList.remove('primary');
      btn.style.background = 'transparent';
      btn.style.color = 'var(--sub)';
      btn.style.border = '1px solid var(--border)';
    } else {
      btn.textContent = '关注';
      btn.classList.add('primary');
      btn.style.background = '';
      btn.style.color = '';
      btn.style.border = '';
    }
    btn._followStatus = status;
  }

  async function toggleProfileFollow() {
    if (!currentProfileUserId || Number(currentProfileUserId) === Number(MY_ID)) return;
    var btn = document.getElementById('upFollowBtn');
    if (!btn) return;
    var status = btn._followStatus || {};
    var isFollowing = !!status.i_follow;
    var url = isFollowing ? '/api/user/unfollow' : '/api/user/follow';

    btn.disabled = true;
    try {
      var r = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target_id: currentProfileUserId})
      });
      var js = await r.json();
      if (js.status === 'success' && js.data) {
        _updateProfileFollowBtn(js.data);
        var fc = document.getElementById('upFollowerCount');
        var gc = document.getElementById('upFollowingCount');
        if (fc) fc.textContent = String(js.data.follower_count || 0);
        if (gc) gc.textContent = String(js.data.following_count || 0);
      }
    } catch(e) {}
    btn.disabled = false;
  }
</script>
