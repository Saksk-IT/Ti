{# chat/_chat_scripts_messages.html — JS: 图片/题目弹层、API 层、会话列表、消息解析/渲染/轮询 #}
<script>
  // 图片弹层
  function openImgModal(url){
    const modal = document.getElementById('imgModal');
    const img = document.getElementById('imgModalImg');
    if (!modal || !img) return;
    img.src = url;
    modal.classList.add('show');
  }

  let currentModalQuestion = null;

  function closeQuestionModal(e) {
      if (e) {
          if (e.target.id !== 'questionModal' && !e.target.classList.contains('close')) return;
      }
      const modal = document.getElementById('questionModal');
      if (modal) modal.classList.remove('show');
      currentModalQuestion = null;
  }

  function renderFillBlankContent(text){
      const safe = escapeHtml(String(text || ''));
      return safe.replace(/__+/g, '<span class="blank-slot" aria-hidden="true"></span>');
  }

  function renderFillBlankAnswer(answer){
      const raw = String(answer || '').trim();
      if (!raw) return '';
      const blanks = raw.split(';;').map(s=>s.trim()).filter(Boolean);
      if (!blanks.length) return escapeHtml(raw);

      const rows = blanks.map((b, idx)=>{
          const alts = b.split(';').map(x=>x.trim()).filter(Boolean);
          const pretty = alts.map(x=>`<span class="ans-pill">${escapeHtml(x)}</span>`).join('');
          return `
            <div class="blank-row">
              <div class="blank-idx">空 ${idx+1}</div>
              <div class="blank-vals">${pretty || '<span class="ans-pill">(空)</span>'}</div>
            </div>
          `;
      }).join('');
      return `<div class="blank-ans">${rows}</div>`;
  }

  function _renderQuestionModal(qInfo){
      document.getElementById('qmTitle').textContent = '题目详情';
      const metaParts = [];
      if (qInfo.type) metaParts.push(String(qInfo.type));
      if (qInfo.subject) metaParts.push(String(qInfo.subject));
      document.getElementById('qmMeta').textContent = metaParts.join(' · ');

      const contentEl = document.getElementById('qmContent');
      const qType = String(qInfo.type || '');
      if (qType === '填空题') {
        contentEl.innerHTML = renderFillBlankContent(String(qInfo.content || ''));
      } else {
        contentEl.textContent = qInfo.content || '';
      }

      const qmAnswerWrap = document.getElementById('qmAnswerWrap');
      const qmExplainWrap = document.getElementById('qmExplainWrap');
      const qmOptionsWrap = document.getElementById('qmOptionsWrap');

      const answer = qInfo.answer || '';
      const explain = qInfo.explanation || '';
      const opts = Array.isArray(qInfo.options) ? qInfo.options : [];
      try { console.log('[QuestionModal] render opts len=', opts.length, opts.slice(0,2)); } catch(e) {}

      if (opts.length) {
          const optsHtml = opts.map(o => {
              const k = (o && o.key) ? String(o.key).trim() : '';
              const v = (o && o.value) ? String(o.value).trim() : '';
              return `<div style="padding: 10px 12px; border-radius: 14px; border: 1px solid var(--border); background: rgba(142,142,147,0.06);"><strong style="margin-right:6px;">${k ? (escapeHtml(k)+'.') : ''}</strong>${escapeHtml(v)}</div>`;
          }).join('');
          document.getElementById('qmOptions').innerHTML = optsHtml;
          qmOptionsWrap.style.display = 'block';
      } else {
          document.getElementById('qmOptions').innerHTML = '';
          qmOptionsWrap.style.display = 'none';
      }

      if (answer) {
        const ansEl = document.getElementById('qmAnswer');
        if (qType === '填空题') {
          ansEl.innerHTML = renderFillBlankAnswer(String(answer));
        } else {
          ansEl.textContent = answer;
        }
        qmAnswerWrap.style.display = 'block';
      } else {
        document.getElementById('qmAnswer').textContent = '';
        qmAnswerWrap.style.display = 'none';
      }

      if (explain) {
        document.getElementById('qmExplain').textContent = explain;
        qmExplainWrap.style.display = 'block';
      } else {
        document.getElementById('qmExplain').textContent = '';
        qmExplainWrap.style.display = 'none';
      }
  }

  async function openQuestionModal(qInfo) {
      if (!qInfo || !qInfo.id) return;
      const modal = document.getElementById('questionModal');
      if (!modal) return;

      modal.classList.add('show');

      console.log('[QuestionModal] initial qInfo', qInfo);
      const hasFull = !!qInfo.has_full_data;
      if (!hasFull) {
          console.log('[QuestionModal] fetching full question from api', qInfo.id);
          document.getElementById('qmTitle').textContent = '题目详情';
          document.getElementById('qmMeta').textContent = '';
          document.getElementById('qmContent').textContent = '加载中...';
          try {
              const res = await fetch(`/api/chat/question/${encodeURIComponent(qInfo.id)}`);
              const js = await res.json();
              console.log('[QuestionModal] api resp', js);
              if (res.ok && js.status === 'success' && js.question) {
                  qInfo = Object.assign({}, qInfo, js.question);
                  console.log('[QuestionModal] merged qInfo', qInfo);
              }
          } catch(e) {}
      }

      currentModalQuestion = qInfo;
      _renderQuestionModal(qInfo);
  }

  function copyQuestionLink(){
      if (!currentModalQuestion || !currentModalQuestion.id) return;
      try {
          navigator.clipboard.writeText(String(currentModalQuestion.id));
          showToast('题目 ID 已复制');
      } catch(e) {
          showToast('复制失败');
      }
  }

  function closeImgModal(e){
    if (e) e.stopPropagation();
    const modal = document.getElementById('imgModal');
    if (!modal) return;
    if (e && e.target && (e.target.id === 'imgModal' || e.target.classList.contains('close'))) {
      modal.classList.remove('show');
      const img = document.getElementById('imgModalImg');
      if (img) img.src = '';
    }
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      const modal = document.getElementById('imgModal');
      if (modal && modal.classList.contains('show')) {
        modal.classList.remove('show');
        const img = document.getElementById('imgModalImg');
        if (img) img.src = '';
      }
      const qModal = document.getElementById('questionModal');
      if (qModal && qModal.classList.contains('show')) {
        qModal.classList.remove('show');
        currentModalQuestion = null;
      }
      const uModal = document.getElementById('userPickModal');
      if (uModal && uModal.classList.contains('show')) {
        uModal.classList.remove('show');
        const listEl = document.getElementById('userPickList');
        if (listEl) listEl.innerHTML = '';
      }
      const pModal = document.getElementById('userProfileModal');
      if (pModal && pModal.classList.contains('show')) {
        pModal.classList.remove('show');
      }
    }
  });

  // =====================================================
  // Commit 4：抽取 Chat.api（统一 fetch 封装，不改功能）
  // =====================================================
  Chat.api = {
    async _json(res){
      let js = {};
      try { js = await res.json(); } catch(e) { js = {}; }
      return js;
    },

    async fetchConversations({limit=50, offset=0}={}){
      const res = await fetch(`/api/chat/conversations?limit=${limit}&offset=${offset}`);
      const js = await this._json(res);
      if (!res.ok || js.status !== 'success') return {list: [], has_more: false};
      return {list: js.data || [], has_more: !!js.has_more};
    },

    async fetchMessages({conversationId, afterId=0, beforeId=0, limit=80}){
      const cid = Number(conversationId || 0);
      const lim = Number(limit || 80);
      let url = `/api/chat/messages?conversation_id=${cid}&limit=${lim}`;
      if (Number(beforeId || 0) > 0) {
        url += `&before_id=${Number(beforeId)}`;
      } else {
        url += `&after_id=${Number(afterId || 0)}`;
      }
      const res = await fetch(url);
      const js = await this._json(res);
      return { res, js };
    },

    async searchUsers(q){
      const kw = String(q || '').trim();
      const res = await fetch(`/api/chat/users?q=${encodeURIComponent(kw)}`);
      const js = await this._json(res);
      if (!res.ok || js.status !== 'success') return [];
      return js.data || [];
    },

    async createConversation(peerUserId){
      const pid = Number(peerUserId || 0);
      const res = await fetch('/api/chat/conversations/create', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ peer_user_id: pid })
      });
      const js = await this._json(res);
      return { res, js };
    },

    async sendText({conversationId, content}){
      const cid = Number(conversationId || 0);
      const text = String(content || '');
      const res = await fetch('/api/chat/messages/send', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ conversation_id: cid, content: text })
      });
      const js = await this._json(res);
      return { res, js };
    },

    async uploadImage(formData){
      const res = await fetch('/api/chat/messages/upload_image', { method:'POST', body: formData });
      const js = await this._json(res);
      return { res, js };
    },

    async uploadAudio(formData){
      const res = await fetch('/api/chat/messages/upload_audio', { method:'POST', body: formData });
      const js = await this._json(res);
      return { res, js };
    },

    async getUserProfile(userId){
      const uid = Number(userId || 0);
      const res = await fetch(`/api/chat/user_profile?user_id=${encodeURIComponent(uid)}`);
      const js = await this._json(res);
      return { res, js };
    },

    async getUserRemark(targetUserId){
      const tid = Number(targetUserId || 0);
      const res = await fetch(`/api/chat/user_remark?target_user_id=${encodeURIComponent(tid)}`);
      const js = await this._json(res);
      return { res, js };
    },

    async setUserRemark(targetUserId, remark){
      const tid = Number(targetUserId || 0);
      const r = String(remark || '');
      const res = await fetch('/api/chat/user_remark', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ target_user_id: tid, remark: r })
      });
      const js = await this._json(res);
      return { res, js };
    },

    async revokeMessage(messageId){
      const res = await fetch('/api/chat/messages/revoke', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message_id: Number(messageId) })
      });
      const js = await this._json(res);
      return { res, js };
    },

    async searchMessages({conversationId, q, limit=20}){
      const cid = Number(conversationId || 0);
      const kw = String(q || '').trim();
      const lim = Number(limit || 20);
      const res = await fetch(`/api/chat/messages/search?conversation_id=${cid}&q=${encodeURIComponent(kw)}&limit=${lim}`);
      const js = await this._json(res);
      return { res, js };
    },
  };

  // D6: 会话列表分页状态
  var _convOffset = 0;
  var _convLimit = 50;
  var _convHasMore = false;
  var _convLoading = false;

  async function fetchConversations(){
    var result = await Chat.api.fetchConversations({limit: _convLimit, offset: 0});
    _convOffset = result.list.length;
    _convHasMore = result.has_more;
    return result.list;
  }

  function chatConvSkeletonItem() {
    return '<div class="conv-item" style="pointer-events:none">' +
      '<div class="chat-skel-avatar"></div>' +
      '<div class="conv-text" style="flex:1;min-width:0">' +
        '<div class="chat-skel-row" style="width:55%;height:13px;margin-bottom:6px"></div>' +
        '<div class="chat-skel-row" style="width:80%;height:10px"></div>' +
      '</div>' +
      '<div class="conv-right"><div class="chat-skel-row" style="width:36px;height:10px"></div></div>' +
    '</div>';
  }

  function showConvSkeletons() {
    var html = Array.from({length: 5}, chatConvSkeletonItem).join('');
    var el = document.getElementById('convList');
    var elM = document.getElementById('convListMobile');
    if (el) el.innerHTML = html;
    if (elM) elM.innerHTML = html;
  }

  function renderConversations(list){
    const el = document.getElementById('convList');
    const elM = document.getElementById('convListMobile');

    const uniqueList = [];
    const seenPeer = new Set();
    (list||[]).forEach(c=>{
      if (c && c.c_type === 'direct') {
        const k = String(c.peer_user_id || '');
        if (!k) { uniqueList.push(c); return; }
        if (seenPeer.has(k)) return;
        seenPeer.add(k);
        uniqueList.push(c);
      } else {
        uniqueList.push(c);
      }
    });

    const html = (uniqueList||[]).map(c => {
      const active = (c.conversation_id === ChatState.currentConversationId) ? 'active' : '';
      const displayName = (c.c_type === 'direct' ? (c.peer_remark || c.peer_username || '私聊') : (c.title || '会话'));
      const avatarUrl = c.peer_avatar || '';
      const sub = c.last_message || '';
      const timeText = (c.last_message_at || c.updated_at || c.last_time || '').toString();
      const badge = (c.unread_count && c.unread_count > 0) ? `<span class="badge">${c.unread_count > 99 ? '99+' : c.unread_count}</span>` : '';
      const timeHtml = timeText ? `<span class="conv-time">${escapeHtml(formatConvTimestamp(timeText))}</span>` : '';
      const initial = (displayName || 'U').slice(0,1).toUpperCase();
      const avatarHtml = avatarUrl
        ? `<div class="avatar" style="background-image:url('${escapeAttr(avatarUrl)}')"></div>`
        : `<div class="avatar" style="background: var(--primary);">${escapeHtml(initial)}</div>`;
      return `
        <div class="conv-item ${active}" onclick="openConversation(${c.conversation_id})">
          <div onclick="event.stopPropagation(); openUserProfile(${c.peer_user_id || 0});" style="display:flex;">
            ${avatarHtml}
          </div>
          <div class="conv-text">
            <div class="conv-title">${escapeHtml(displayName)}</div>
            <div class="conv-sub">${escapeHtml(sub)}</div>
          </div>
          <div class="conv-right">
            ${timeHtml}
            ${badge}
          </div>
        </div>
      `;
    }).join('');
    if (el) { el.innerHTML = html || '<div style="padding:12px; color:var(--sub);">暂无会话。可在上方搜索用户并回车创建。</div>'; el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in'); }
    if (elM) { elM.innerHTML = el ? el.innerHTML : html; elM.classList.remove('fade-in'); void elM.offsetWidth; elM.classList.add('fade-in'); }
  }

  function escapeHtml(s){ return Chat.utils.escapeHtml(s); }
  function escapeAttr(s){ return Chat.utils.escapeAttr(s); }

  let _convFirstLoad = true;

  async function refreshConversations(){
    if (_convFirstLoad) {
      showConvSkeletons();
    }
    const list = await fetchConversations();
    renderConversations(list);
    _convFirstLoad = false;
    _setupConvScroll();
  }

  // D6: 加载更多会话
  async function _loadMoreConversations() {
    if (_convLoading || !_convHasMore) return;
    _convLoading = true;
    var result = await Chat.api.fetchConversations({limit: _convLimit, offset: _convOffset});
    _convOffset += result.list.length;
    _convHasMore = result.has_more;
    _convLoading = false;
    if (result.list.length) _appendConversations(result.list);
  }

  function _appendConversations(list) {
    var el = document.getElementById('convList');
    var elM = document.getElementById('convListMobile');
    var html = (list||[]).map(function(c) {
      var active = (c.conversation_id === ChatState.currentConversationId) ? 'active' : '';
      var displayName = (c.c_type === 'direct' ? (c.peer_remark || c.peer_username || '私聊') : (c.title || '会话'));
      var avatarUrl = c.peer_avatar || '';
      var sub = c.last_message || '';
      var timeText = (c.last_message_at || c.updated_at || c.last_time || '').toString();
      var badge = (c.unread_count && c.unread_count > 0) ? '<span class="badge">' + (c.unread_count > 99 ? '99+' : c.unread_count) + '</span>' : '';
      var timeHtml = timeText ? '<span class="conv-time">' + escapeHtml(formatConvTimestamp(timeText)) + '</span>' : '';
      var initial = (displayName || 'U').slice(0,1).toUpperCase();
      var avatarHtml = avatarUrl
        ? '<div class="avatar" style="background-image:url(\'' + escapeAttr(avatarUrl) + '\')"></div>'
        : '<div class="avatar" style="background: var(--primary);">' + escapeHtml(initial) + '</div>';
      return '<div class="conv-item ' + active + '" onclick="openConversation(' + c.conversation_id + ')">' +
        '<div onclick="event.stopPropagation(); openUserProfile(' + (c.peer_user_id || 0) + ');" style="display:flex;">' + avatarHtml + '</div>' +
        '<div class="conv-text"><div class="conv-title">' + escapeHtml(displayName) + '</div><div class="conv-sub">' + escapeHtml(sub) + '</div></div>' +
        '<div class="conv-right">' + timeHtml + badge + '</div></div>';
    }).join('');
    if (el) el.insertAdjacentHTML('beforeend', html);
    if (elM) elM.insertAdjacentHTML('beforeend', html);
  }

  var _convScrollBound = false;
  function _setupConvScroll() {
    if (_convScrollBound) return;
    _convScrollBound = true;
    ['convList','convListMobile'].forEach(function(id) {
      var container = document.getElementById(id);
      if (!container) return;
      // 找到可滚动的父容器
      var scrollEl = container.closest('.conv-list') || container.parentElement;
      if (!scrollEl) return;
      scrollEl.addEventListener('scroll', function() {
        if (scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 60) {
          _loadMoreConversations();
        }
      });
    });
  }

  function setEmptyStateVisible(show){
    const es = Chat.ui.dom.get('emptyState');
    if (!es) return;
    es.style.display = show ? 'block' : 'none';
  }

  let currentPeerUserId = 0;
  let _earliestMessageId = 0;   // 当前会话已加载的最早消息 ID
  let _hasMoreHistory = true;    // 是否还有更早的历史消息
  let _loadingHistory = false;   // 防止并发加载历史

  async function openConversation(conversationId){
    try { stopCurrentAudio(); } catch(e) {}

    ChatState.currentConversationId = conversationId;
    currentPeerUserId = 0;
    ChatState.lastMessageId = 0;
    _earliestMessageId = 0;
    _hasMoreHistory = true;
    _loadingHistory = false;
    const msgBox = Chat.ui.dom.get('messages');
    if (msgBox) {
      msgBox.innerHTML = '';
      const es = Chat.ui.dom.get('emptyState');
      if (es) msgBox.appendChild(es);
    }
    setEmptyStateVisible(true);

    try {
      const list = await fetchConversations();
      const cur = (list || []).find(x => x.conversation_id === conversationId);
      if (cur) {
        const name = (cur.c_type === 'direct' ? (cur.peer_remark || cur.peer_username || '私聊') : (cur.title || '会话'));
        document.getElementById('chatTitle').textContent = name;
        currentPeerUserId = (cur.c_type === 'direct' ? (cur.peer_user_id || 0) : 0);
        const btnR = document.getElementById('btnRemark');
        if (btnR) btnR.style.display = (currentPeerUserId ? 'inline-flex' : 'none');
        const btnS = document.getElementById('btnSearchMsg');
        if (btnS) btnS.style.display = 'inline-flex';
      } else {
        document.getElementById('chatTitle').textContent = `会话 #${conversationId}`;
      }
    } catch(e) {
      document.getElementById('chatTitle').textContent = `会话 #${conversationId}`;
      const btnR = document.getElementById('btnRemark');
      if (btnR) btnR.style.display = 'none';
      const btnS = document.getElementById('btnSearchMsg');
      if (btnS) btnS.style.display = 'inline-flex';
    }
    document.getElementById('chatHint').textContent = '';

    await refreshConversations();
    await pollMessages(true);

    if (isMobile()) toggleDrawer(false);

    if (ChatState.pollTimer) clearInterval(ChatState.pollTimer);

    // SSE 事件驱动：收到 chat_message 时触发 pollMessages
    if (window._sseSource) {
      // 移除旧监听器
      if (ChatState._sseMessageHandler) {
        try { window._sseSource.removeEventListener('chat_message', ChatState._sseMessageHandler); } catch(e) {}
      }
      ChatState._sseMessageHandler = function(e) {
        try {
          var data = JSON.parse(e.data);
          if (data.conversation_id === ChatState.currentConversationId) {
            pollMessages(false);
          }
          throttledRefreshConversations();
        } catch(err) {}
      };
      window._sseSource.addEventListener('chat_message', ChatState._sseMessageHandler);

      // D2: 撤回事件监听
      if (ChatState._sseRevokeHandler) {
        try { window._sseSource.removeEventListener('chat_message_revoked', ChatState._sseRevokeHandler); } catch(e) {}
      }
      ChatState._sseRevokeHandler = function(e) {
        try {
          var data = JSON.parse(e.data);
          if (data.conversation_id === ChatState.currentConversationId) {
            _applyRevokeToDOM(data.message_id);
          }
          throttledRefreshConversations();
        } catch(err) {}
      };
      window._sseSource.addEventListener('chat_message_revoked', ChatState._sseRevokeHandler);
    } else {
      // SSE 不可用，降级回 2 秒轮询
      ChatState.pollTimer = setInterval(()=>pollMessages(false), 2000);
    }
  }

  function isImageMsg(m){ return (m && m.content_type === 'image'); }
  function isAudioMsg(m){ return (m && m.content_type === 'audio'); }
  function isQuestionMsg(m){ return (m && m.content_type === 'question'); }
  function isForwardMsg(m){ return (m && m.content_type === 'forward'); }

  // ── D2: 撤回菜单 + SSE 监听 ──────────────────────────────
  var _revokeMenuEl = null;
  function _closeRevokeMenu() {
    if (_revokeMenuEl && _revokeMenuEl.parentNode) {
      _revokeMenuEl.parentNode.removeChild(_revokeMenuEl);
    }
    _revokeMenuEl = null;
  }

  function _bindRevokeMenu(bubble, messageId) {
    var longPressTimer = null;
    bubble.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      _showRevokeMenu(e.pageX, e.pageY, messageId);
    });
    bubble.addEventListener('touchstart', function(e) {
      longPressTimer = setTimeout(function() {
        var t = e.touches[0];
        _showRevokeMenu(t.pageX, t.pageY, messageId);
      }, 600);
    }, {passive: true});
    bubble.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
    bubble.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
  }

  function _showRevokeMenu(x, y, messageId) {
    _closeRevokeMenu();
    var menu = document.createElement('div');
    menu.className = 'revoke-ctx-menu';
    menu.style.cssText = 'position:fixed;z-index:9999;background:var(--card,#fff);border:1px solid var(--border,#e0e0e0);border-radius:8px;padding:6px 0;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:80px;';
    var btn = document.createElement('div');
    btn.textContent = '撤回';
    btn.style.cssText = 'padding:8px 18px;font-size:14px;color:var(--danger,#e53935);cursor:pointer;';
    btn.onmouseenter = function(){ btn.style.background='var(--hover,#f5f5f5)'; };
    btn.onmouseleave = function(){ btn.style.background=''; };
    btn.onclick = async function() {
      _closeRevokeMenu();
      var {res, js} = await Chat.api.revokeMessage(messageId);
      if (js.status === 'success') {
        _applyRevokeToDOM(messageId);
      } else {
        alert(js.message || '撤回失败');
      }
    };
    menu.appendChild(btn);

    document.body.appendChild(menu);
    // 定位：确保不超出视口
    var rect = menu.getBoundingClientRect();
    var left = Math.min(x, window.innerWidth - rect.width - 8);
    var top = Math.min(y, window.innerHeight - rect.height - 8);
    menu.style.left = Math.max(0, left) + 'px';
    menu.style.top = Math.max(0, top) + 'px';
    _revokeMenuEl = menu;

    setTimeout(function() {

  function parseForwardContent(content){
    if (!content) return null;
    if (typeof content !== 'string') return null;
    var s = content.trim();
    if (!s) return null;
    // 新 JSON 格式
    if (s.startsWith('{') && s.endsWith('}')) {
      try { return JSON.parse(s); } catch(e) { return null; }
    }
    // 旧文本格式: [转发帖子] title\n/forum/post/123
    var m2 = s.match(/^\[转发帖子\]\s*(.+)\n\/forum\/post\/(\d+)/);
    if (m2) {
      return { post_id: parseInt(m2[2]), title: m2[1].trim(), preview: '', image: '' };
    }
    return null;
  }

  function parseQuestionContent(content){
    if (!content) return null;
    if (typeof content !== 'string') return null;
    const s = content.trim();
    if (!s) return null;
    if (s.startsWith('{') && s.endsWith('}')) {
      try { return JSON.parse(s); } catch(e) { return null; }
    }
    return null;
  }

  function parseAudioContent(content){
    if (!content) return { url: '', url_raw: '', url_m4a: '', duration: null };
    if (typeof content !== 'string') return { url: '', url_raw: '', url_m4a: '', duration: null };
    const s = content.trim();
    if (!s) return { url: '', url_raw: '', url_m4a: '', duration: null };
    if (s.startsWith('{') && s.endsWith('}')) {
      try {
        const obj = JSON.parse(s);
        const url_m4a = obj.url_m4a || '';
        const url_raw = obj.url_raw || '';
        const url = obj.url || url_m4a || url_raw || '';
        return { url, url_raw, url_m4a, duration: (obj.duration != null ? obj.duration : null) };
      } catch(e) {
        return { url: s, url_raw: '', url_m4a: '', duration: null };
      }
    }
    return { url: s, url_raw: '', url_m4a: '', duration: null };
  }

  function parseImageContent(content){
    if (!content) return { url: '', thumb: '' };
    if (typeof content !== 'string') return { url: '', thumb: '' };
    const s = content.trim();
    if (!s) return { url: '', thumb: '' };
    if (s.startsWith('{') && s.endsWith('}')) {
      try {
        const obj = JSON.parse(s);
        return { url: obj.url || obj.u || '', thumb: obj.thumb || obj.t || '', w: obj.w || null, h: obj.h || null };
      } catch(e) {
        return { url: s, thumb: '' };
      }
    }
    return { url: s, thumb: '' };
  }

  function safeParseTime(s){ return Chat.utils.safeParseTime(s); }
  function formatConvTimestamp(ts){ return Chat.utils.formatConvTimestamp(ts); }
  function formatFullTime(d){ return Chat.utils.formatFullTime(d); }
  function formatDividerTime(d){ return Chat.utils.formatDividerTime(d); }

  function maybeInsertTimeDivider(box, message){
    const created = safeParseTime(message && message.created_at);
    if (!created) return;

    let prev = box.lastElementChild;
    while (prev && !prev.classList.contains('msg-row')) {
      prev = prev.previousElementSibling;
    }

    const lastTs = prev ? safeParseTime(prev.getAttribute('data-ts')) : null;
    if (!lastTs) {
      const div = document.createElement('div');
      div.className = 'time-divider';
      div.innerHTML = `<span>${escapeHtml(formatDividerTime(created))}</span>`;
      box.appendChild(div);
      return;
    }

    const gapMs = created.getTime() - lastTs.getTime();
    if (gapMs > 5 * 60 * 1000) {
      const div = document.createElement('div');
      div.className = 'time-divider';
      div.innerHTML = `<span>${escapeHtml(formatDividerTime(created))}</span>`;
      box.appendChild(div);
    }
  }

              </svg>

        btnPlay.onclick = async ()=>{
          try {
            if (audio.paused) {
              if (currentPlayingAudio && currentPlayingAudio !== audio) {
                try { currentPlayingAudio.pause(); currentPlayingAudio.currentTime = 0; } catch(e) {}
              }
              currentPlayingAudio = audio;
              currentPlayingBtn = btnPlay;
              await audio.play();
              setPlayingUI(true);
            } else {
              audio.pause();
              setPlayingUI(false);
              if (currentPlayingAudio === audio) { currentPlayingAudio = null; currentPlayingBtn = null; }
            }
          } catch(e) {
            try {
              if (info && info.url_raw && audio && audio.src !== info.url_raw) {

                setPlayingUI(true);

          if (currentPlayingAudio === audio) { currentPlayingAudio = null; currentPlayingBtn = null; }

          if (currentPlayingAudio && currentPlayingAudio !== audio) {

      const metaTime = created ? formatFullTime(created) : (m.created_at || '');
      meta.textContent = (isMe ? '' : (m.sender_username || '用户') + ' · ') + metaTime;

      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      row.appendChild(avatar);
      row.appendChild(wrap);
      frag.appendChild(row);
    });

    // 在锚点前插入时间分隔线和消息
    if (anchor) {
      // 插入顶部分隔线
      const firstNewTs = safeParseTime(msgs[0] && msgs[0].created_at);
      if (firstNewTs) {
        const div = document.createElement('div');
        div.className = 'time-divider';
        div.innerHTML = `<span>${escapeHtml(formatDividerTime(firstNewTs))}</span>`;
        box.insertBefore(div, anchor);
      }
      box.insertBefore(frag, anchor);
    } else {
      box.appendChild(frag);
    }

    // 恢复滚动位置（保持用户视角不变）
    const newScrollHeight = box.scrollHeight;
    box.scrollTop = prevScrollTop + (newScrollHeight - prevScrollHeight);
  }

  async function loadOlderMessages(){
    if (_loadingHistory || !_hasMoreHistory || !ChatState.currentConversationId) return;
    if (_earliestMessageId <= 0) return;

    _loadingHistory = true;
    try {
      const { res, js } = await Chat.api.fetchMessages({
        conversationId: ChatState.currentConversationId,
        beforeId: _earliestMessageId,
        limit: 30,
      });
      if (!res.ok || js.status !== 'success') return;
      const msgs = js.data || [];
      if (js.has_more === false) _hasMoreHistory = false;
      if (!msgs.length) {
        _hasMoreHistory = false;
        return;
      }
      prependMessages(msgs);
    } finally {
      _loadingHistory = false;
    }
  }

  // 会话列表刷新节流：最多 10 秒一次
  let _lastConvRefresh = 0;
  function throttledRefreshConversations() {
    const now = Date.now();
    if (now - _lastConvRefresh < 10000) return;
    _lastConvRefresh = now;
    refreshConversations();
  }

  async function pollMessages(force){
    if (!ChatState.currentConversationId) return;
    const { res, js } = await Chat.api.fetchMessages({
      conversationId: ChatState.currentConversationId,
      afterId: ChatState.lastMessageId,
      limit: 80
    });
    if (!res.ok || js.status !== 'success') return;
    const msgs = js.data || [];
    if (msgs.length) {
      appendMessages(msgs);
      throttledRefreshConversations();
      try {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2,'0');
        const mm = String(now.getMinutes()).padStart(2,'0');
        const hint = document.getElementById('chatHint');
        if (hint) hint.textContent = `已同步 ${hh}:${mm}`;
      } catch(e) {}
    } else if (force) {
      refreshConversations();
      _lastConvRefresh = Date.now();
    }
  }

  function setLoading(btn, state){
    return Chat.utils.setLoading(btn, state);
  }

  // 滚动到顶部加载历史消息
  (function(){
    const box = document.getElementById('messages');
    if (!box) return;
    let _scrollDebounce = null;
    box.addEventListener('scroll', function(){
      if (_scrollDebounce) return;
      if (box.scrollTop < 80 && _hasMoreHistory && !_loadingHistory && ChatState.currentConversationId) {
        _scrollDebounce = setTimeout(()=>{ _scrollDebounce = null; }, 300);
        loadOlderMessages();
      }
    });
  })();
</script>
