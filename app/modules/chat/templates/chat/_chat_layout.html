{# chat/_chat_layout.html — 主布局：移动端抽屉 + 桌面侧栏 + 聊天窗口 + 输入区 #}

  <div class="overlay" id="overlay" onclick="toggleDrawer(false)"></div>
  <div class="drawer" id="drawer">
    <div class="sidebar">
      <div class="search">
        <input id="userSearch" placeholder="搜索用户，回车发起讨论" onkeydown="onUserSearchKey(event)" />
      </div>
      <div class="chat-sidebar-tabs">
        <button class="chat-tab active" data-tab="conv" onclick="switchChatTab('conv')">消息</button>
        <button class="chat-tab" data-tab="interact" onclick="switchChatTab('interact')">
          互动 <span class="tab-badge" id="interactBadgeMobile" style="display:none">0</span>
        </button>
      </div>
      <div id="convPanelMobile">
        <div class="conv-list" id="convListMobile"></div>
      </div>
      <div id="interactPanelMobile" style="display:none">
        <div class="conv-list" id="interactListMobile"></div>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="search">
        <input id="userSearchDesk" placeholder="搜索用户，回车发起讨论" onkeydown="onUserSearchKey(event,true)" />
      </div>
      <div class="chat-sidebar-tabs">
        <button class="chat-tab active" data-tab="conv" onclick="switchChatTab('conv')">消息</button>
        <button class="chat-tab" data-tab="interact" onclick="switchChatTab('interact')">
          互动 <span class="tab-badge" id="interactBadge" style="display:none">0</span>
        </button>
      </div>
      <div id="convPanel">
        <div class="conv-list" id="convList"></div>
      </div>
      <div id="interactPanel" style="display:none">
        <div class="conv-list" id="interactList"></div>
      </div>
    </div>

    <div class="main">
      <div class="chat-header">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <div class="title" id="chatTitle">请选择一个话题</div>
          <div class="subtle" id="chatHint"></div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button class="btn btn-icon" id="btnSearchMsg" onclick="toggleMsgSearch()" style="display:none;" title="搜索消息" aria-label="搜索消息">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="btn" id="btnRemark" onclick="openUserProfile(currentPeerUserId)" style="display:none;">资料</button>
        </div>
      </div>
      <div id="msgSearchBar" style="display:none;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--card,#fff);">
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="msgSearchInput" type="text" placeholder="搜索当前会话消息…" onkeydown="if(event.key==='Enter'){event.preventDefault();doMsgSearch();}" style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);outline:none;" />
          <button class="btn" onclick="doMsgSearch()" style="padding:4px 12px;font-size:13px;">搜索</button>
          <button class="btn" onclick="closeMsgSearch()" style="padding:4px 8px;font-size:13px;color:var(--sub);">取消</button>
        </div>
        <div id="msgSearchResults" style="display:none;max-height:200px;overflow-y:auto;margin-top:6px;"></div>
      </div>
      <div class="messages" id="messages">
        <div id="emptyState" style="display:none; padding:22px 10px; text-align:center; color:var(--sub);">
          <div style="font-weight:700; color:var(--text); margin-bottom:6px;">开始一个话题</div>
          <div>左侧选择话题，或在上方搜索用户回车发起讨论。</div>
        </div>
      </div>
      <div class="composer">
        <button class="btn-plus" id="btnPlus" type="button" title="更多" aria-label="更多" onclick="togglePlusMenu(event)">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14"/>
            <path d="M5 12h14"/>
          </svg>
        </button>

        <div class="pill">
          <input id="imgInput" type="file" accept="image/*" style="display:none" onchange="sendImageFile(this)" />

          <textarea id="composer" placeholder="信息…" onkeydown="onComposerKey(event)"></textarea>

          <button class="btn btn-icon" id="btnVoice" title="按住说话" aria-label="按住说话">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
              <path d="M19 11a7 7 0 0 1-14 0"/>
              <path d="M12 19v3"/>
              <path d="M8 22h8"/>
            </svg>
          </button>

          <button class="btn primary btn-send" id="btnSendText" onclick="sendMessage()" style="display:none;" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14"/>
              <path d="m18 11-6-6-6 6"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
