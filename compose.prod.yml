# 生产环境配置（独立完整版）
# 使用方式: docker compose --env-file .env.production -f compose.prod.yml up -d

services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - ./var/uploads:/app/var/uploads:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ${TI_IMAGE:-ghcr.io/saksk-it/ti:latest}
    pull_policy: ${TI_IMAGE_PULL_POLICY:-always}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      FLASK_ENV: production
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      BACKUP_CREDENTIAL_SECRET: ${BACKUP_CREDENTIAL_SECRET:?BACKUP_CREDENTIAL_SECRET is required}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?DEFAULT_ADMIN_USERNAME is required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD is required}
      DEFAULT_ADMIN_PHONE: ${DEFAULT_ADMIN_PHONE:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_RESET_PASSWORD: ${DEFAULT_ADMIN_RESET_PASSWORD:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ti_db}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      RATELIMIT_LIMIT_MULTIPLIER: ${RATELIMIT_LIMIT_MULTIPLIER:-100}
      RATELIMIT_DEFAULT: "${RATELIMIT_DEFAULT:-500000/day;50000/hour;1000/second}"
      JWT_ACCESS_TOKEN_EXPIRES_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRES_SECONDS:-1296000}
      SSE_ENABLED: ${SSE_ENABLED:-false}
      SSE_RETRY_AFTER_SECONDS: ${SSE_RETRY_AFTER_SECONDS:-300}
      RQ_QUEUE_NAME: saksk
      PROXY_FIX_ENABLED: ${PROXY_FIX_ENABLED:-true}
      ENABLE_GZIP: "false"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_MINICODE_ENV_VERSION: ${WECHAT_MINICODE_ENV_VERSION:-}
      WECHAT_MINICODE_CHECK_PATH: ${WECHAT_MINICODE_CHECK_PATH:-auto}
      AI_CHANGE_RECORD_TOKEN: ${AI_CHANGE_RECORD_TOKEN:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_TIMEOUT: ${DASHSCOPE_TIMEOUT:-25}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      MAIL_DEFAULT_SENDER_NAME: ${MAIL_DEFAULT_SENDER_NAME:-系统通知}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_CONSOLE_OUTPUT: ${MAIL_CONSOLE_OUTPUT:-false}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_TEMPLATE_CODE_BIND: ${ALIYUN_SMS_TEMPLATE_CODE_BIND:-}
      ALIYUN_SMS_TEMPLATE_CODE_RESET: ${ALIYUN_SMS_TEMPLATE_CODE_RESET:-}
      ALIYUN_SMS_CODE_LENGTH: ${ALIYUN_SMS_CODE_LENGTH:-6}
      ALIYUN_SMS_VALID_TIME: ${ALIYUN_SMS_VALID_TIME:-300}
      ALIYUN_SMS_INTERVAL: ${ALIYUN_SMS_INTERVAL:-60}
      SMS_ENABLED: ${SMS_ENABLED:-true}
      SMS_CONSOLE_OUTPUT: ${SMS_CONSOLE_OUTPUT:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
    volumes:
      - ./var:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${TI_IMAGE:-ghcr.io/saksk-it/ti:latest}
    pull_policy: ${TI_IMAGE_PULL_POLICY:-always}
    restart: unless-stopped
    command: sh -c "rq worker -u $$REDIS_URL $$RQ_QUEUE_NAME"
    environment:
      FLASK_ENV: production
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?DEFAULT_ADMIN_USERNAME is required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD is required}
      DEFAULT_ADMIN_PHONE: ${DEFAULT_ADMIN_PHONE:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ti_db}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      RATELIMIT_LIMIT_MULTIPLIER: ${RATELIMIT_LIMIT_MULTIPLIER:-100}
      RATELIMIT_DEFAULT: "${RATELIMIT_DEFAULT:-500000/day;50000/hour;1000/second}"
      RQ_QUEUE_NAME: saksk
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_MINICODE_ENV_VERSION: ${WECHAT_MINICODE_ENV_VERSION:-}
      WECHAT_MINICODE_CHECK_PATH: ${WECHAT_MINICODE_CHECK_PATH:-auto}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_TIMEOUT: ${DASHSCOPE_TIMEOUT:-25}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      MAIL_DEFAULT_SENDER_NAME: ${MAIL_DEFAULT_SENDER_NAME:-系统通知}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_CONSOLE_OUTPUT: ${MAIL_CONSOLE_OUTPUT:-false}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_TEMPLATE_CODE_BIND: ${ALIYUN_SMS_TEMPLATE_CODE_BIND:-}
      ALIYUN_SMS_TEMPLATE_CODE_RESET: ${ALIYUN_SMS_TEMPLATE_CODE_RESET:-}
      ALIYUN_SMS_CODE_LENGTH: ${ALIYUN_SMS_CODE_LENGTH:-6}
      ALIYUN_SMS_VALID_TIME: ${ALIYUN_SMS_VALID_TIME:-300}
      ALIYUN_SMS_INTERVAL: ${ALIYUN_SMS_INTERVAL:-60}
      SMS_ENABLED: ${SMS_ENABLED:-true}
      SMS_CONSOLE_OUTPUT: ${SMS_CONSOLE_OUTPUT:-false}
    volumes:
      - ./var:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ti_db}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=50"]
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyuser} -d ${POSTGRES_DB:-ti_db}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./var/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  backup:
    image: ${TI_IMAGE:-ghcr.io/saksk-it/ti:latest}
    pull_policy: ${TI_IMAGE_PULL_POLICY:-always}
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ti_db}
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      BACKUP_CREDENTIAL_SECRET: ${BACKUP_CREDENTIAL_SECRET:?BACKUP_CREDENTIAL_SECRET is required}
      TZ: ${TZ:-Asia/Shanghai}
      BACKUP_SCHEDULER_POLL_SECONDS: ${BACKUP_SCHEDULER_POLL_SECONDS:-60}
      BACKUP_JOB_LEASE_SECONDS: ${BACKUP_JOB_LEASE_SECONDS:-3600}
      BACKUP_PG_DUMP_TIMEOUT: ${BACKUP_PG_DUMP_TIMEOUT:-900}
      TI_BACKUP_SCHEDULER: "1"
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    volumes:
      - ./var:/data:ro
    command: python -m app.tasks.backup_scheduler
    stop_grace_period: ${BACKUP_STOP_GRACE_PERIOD:-1h}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
