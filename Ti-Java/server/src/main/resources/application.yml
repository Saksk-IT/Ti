spring:
  application:
    name: ti-server
  profiles:
    default: local
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false
        WRITE_DATES_WITH_CONTEXT_TIME_ZONE: true
  mvc:
    log-request-details: false
    problemdetails:
      enabled: false
  jpa:
    generate-ddl: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    # Migration artifacts are versioned and verified in disposable databases. Production
    # execution remains an explicit operator action until the cutover contract authorizes it.
    enabled: ${TI_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    validate-migration-naming: true
  session:
    data:
      redis:
        # Spring Boot 4.1's non-indexed repository stores exactly one hash per Session.
        repository-type: default
        namespace: ${TI_SESSION_REDIS_NAMESPACE:ti-java:identity:sessions}
        # The hard Session registry evicts immediately, so the Session hash must exist first.
        flush-mode: immediate
        save-mode: on-set-attribute
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 100

  web:
    error:
      include-binding-errors: never
      include-exception: false
      include-message: never
      include-path: never
      include-stacktrace: never
      whitelabel:
        enabled: false

server:
  port: ${TI_SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 7d
  tomcat:
    accesslog:
      enabled: false
    accept-count: 64
    threads:
      max: 64
      min-spare: 4

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
          additional-path: server:/livez
        readiness:
          include: readinessState,db,redis,publicBankSnapshot
          additional-path: server:/readyz
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: logstash
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO

ti:
  catalog:
    question-edit-idempotency:
      key-secret: ${TI_CATALOG_QUESTION_EDIT_IDEMPOTENCY_KEY_SECRET:local-only-catalog-question-edit-idempotency-key-0001}
      receipt-ttl: ${TI_CATALOG_QUESTION_EDIT_IDEMPOTENCY_RECEIPT_TTL:24h}
    public-bank:
      snapshot:
        # Remains disabled until this shadow slice owns production reads and its schema is active.
        readiness-enabled: ${TI_PUBLIC_BANK_SNAPSHOT_READINESS_ENABLED:false}
        refresh-lock-namespace: ${TI_PUBLIC_BANK_SNAPSHOT_LOCK_NAMESPACE:ti-java:catalog:public-bank-snapshot}
        refresh-lock-ttl: ${TI_PUBLIC_BANK_SNAPSHOT_LOCK_TTL:15m}
  learning:
    write-idempotency:
      key-secret: ${TI_LEARNING_WRITE_IDEMPOTENCY_KEY_SECRET:local-only-learning-write-idempotency-key-0001}
      receipt-ttl: ${TI_LEARNING_WRITE_IDEMPOTENCY_RECEIPT_TTL:24h}
  security:
    client-address:
      trusted-proxy-cidrs: ${TI_TRUSTED_PROXY_CIDRS:}
    legacy-auth:
      enabled: ${TI_LEGACY_AUTH_ENABLED:false}
      accept-until: ${TI_LEGACY_AUTH_ACCEPT_UNTIL:1970-01-01T00:00:00Z}
      secret: ${ti.legacy-auth.secret:${TI_LEGACY_AUTH_SECRET:}}
    login-rate-limit:
      namespace: ${TI_LOGIN_RATE_LIMIT_NAMESPACE:ti-java:identity:login-rate}
      requests-per-minute: ${TI_LOGIN_RATE_LIMIT_REQUESTS_PER_MINUTE:5}
      key-secret: ${TI_LOGIN_RATE_LIMIT_KEY_SECRET:local-only-login-rate-limit-key-0001}
    subject-read-rate-limit:
      namespace: ${TI_SUBJECT_READ_RATE_LIMIT_NAMESPACE:ti-java:catalog:subject-read-rate}
      requests-per-minute: ${TI_SUBJECT_READ_REQUESTS_PER_MINUTE:60}
      requests-per-hour: ${TI_SUBJECT_READ_REQUESTS_PER_HOUR:600}
      multiplier: ${TI_RATE_LIMIT_MULTIPLIER:1}
    public-bank-read-rate-limit:
      namespace: ${TI_PUBLIC_BANK_READ_RATE_LIMIT_NAMESPACE:ti-java:catalog:public-bank-read-rate}
      requests-per-second: ${TI_PUBLIC_BANK_READ_REQUESTS_PER_SECOND:10}
      requests-per-hour: ${TI_PUBLIC_BANK_READ_REQUESTS_PER_HOUR:500}
      requests-per-day: ${TI_PUBLIC_BANK_READ_REQUESTS_PER_DAY:5000}
      # Java shadow evidence stays at 1; production overrides this default to legacy's 100x policy.
      multiplier: ${TI_PUBLIC_BANK_RATE_LIMIT_MULTIPLIER:${TI_RATE_LIMIT_MULTIPLIER:1}}
    personal-bank-user-counts-read-rate-limit:
      namespace: ${TI_PERSONAL_BANK_USER_COUNTS_READ_RATE_LIMIT_NAMESPACE:ti-java:learning:personal-bank-user-counts-read-rate}
      requests-per-second: ${TI_PERSONAL_BANK_USER_COUNTS_READ_REQUESTS_PER_SECOND:10}
      requests-per-hour: ${TI_PERSONAL_BANK_USER_COUNTS_READ_REQUESTS_PER_HOUR:500}
      requests-per-day: ${TI_PERSONAL_BANK_USER_COUNTS_READ_REQUESTS_PER_DAY:5000}
      multiplier: ${TI_PERSONAL_BANK_USER_COUNTS_READ_RATE_LIMIT_MULTIPLIER:${TI_RATE_LIMIT_MULTIPLIER:1}}
      key-secret: ${TI_PERSONAL_BANK_USER_COUNTS_READ_RATE_LIMIT_KEY_SECRET:local-only-user-counts-rate-limit-key-0001}
    personal-bank-user-counts-cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    csrf-issuance-rate-limit:
      namespace: ${TI_CSRF_ISSUANCE_RATE_LIMIT_NAMESPACE:ti-java:identity:csrf-issuance-rate}
      requests-per-minute: ${TI_CSRF_ISSUANCE_RATE_LIMIT_REQUESTS_PER_MINUTE:30}
      global-requests-per-minute: ${TI_CSRF_ISSUANCE_RATE_LIMIT_GLOBAL_REQUESTS_PER_MINUTE:1000}
      anonymous-session-timeout: ${TI_CSRF_ANONYMOUS_SESSION_TIMEOUT:10m}
    legacy-session-exchange:
      namespace: ${TI_LEGACY_SESSION_EXCHANGE_NAMESPACE:ti-java:identity:legacy-session-exchange}
      requests-per-minute: ${TI_LEGACY_SESSION_EXCHANGE_REQUESTS_PER_MINUTE:10}
      global-requests-per-minute: ${TI_LEGACY_SESSION_EXCHANGE_GLOBAL_REQUESTS_PER_MINUTE:100}
      max-exchanges-per-identity: ${TI_LEGACY_SESSION_EXCHANGE_MAX_PER_IDENTITY:3}
      max-replay-markers: ${TI_LEGACY_SESSION_EXCHANGE_MAX_REPLAY_MARKERS:10000}
      replay-marker-ttl: ${TI_LEGACY_SESSION_EXCHANGE_REPLAY_MARKER_TTL:7d}
    target-session-limit:
      namespace: ${TI_TARGET_SESSION_LIMIT_NAMESPACE:ti-java:identity:target-session-index}
      max-sessions-per-identity: ${TI_TARGET_SESSION_MAX_PER_IDENTITY:3}
      max-total-sessions: ${TI_TARGET_SESSION_MAX_TOTAL:10000}
      registry-ttl: ${TI_TARGET_SESSION_REGISTRY_TTL:7d}
    session:
      cookie-name: ti_dev_session
      csrf-cookie-name: ti_dev_csrf
      secure-cookie: false
