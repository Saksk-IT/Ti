spring:
  config:
    activate:
      on-profile: prod
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${TI_DB_URL}
    username: ${TI_DB_USERNAME}
    password: ${ti.db.password:${TI_DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${TI_DB_POOL_MAX:12}
      minimum-idle: ${TI_DB_POOL_MIN:2}
      connection-timeout: ${TI_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${TI_DB_VALIDATION_TIMEOUT_MS:1000}
  data:
    redis:
      host: ${TI_REDIS_HOST}
      port: ${TI_REDIS_PORT:6379}
      password: ${ti.redis.password:${TI_REDIS_PASSWORD}}
      timeout: ${TI_REDIS_TIMEOUT:2s}
      connect-timeout: ${TI_REDIS_CONNECT_TIMEOUT:2s}

server:
  # Forwarding headers remain raw so the explicit trusted-proxy allowlist below is authoritative.
  forward-headers-strategy: none

management:
  server:
    address: ${TI_MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${TI_MANAGEMENT_PORT:9090}

ti:
  security:
    login-rate-limit:
      namespace: ${TI_LOGIN_RATE_LIMIT_NAMESPACE:ti-java:identity:login-rate}
      requests-per-minute: ${TI_LOGIN_RATE_LIMIT_REQUESTS_PER_MINUTE:5}
      key-secret: ${ti.login-rate-limit.key-secret:${TI_LOGIN_RATE_LIMIT_KEY_SECRET}}
    subject-read-rate-limit:
      namespace: ${TI_SUBJECT_READ_RATE_LIMIT_NAMESPACE:ti-java:catalog:subject-read-rate}
      requests-per-minute: ${TI_SUBJECT_READ_REQUESTS_PER_MINUTE:60}
      requests-per-hour: ${TI_SUBJECT_READ_REQUESTS_PER_HOUR:600}
      multiplier: ${TI_RATE_LIMIT_MULTIPLIER:100}
    public-bank-read-rate-limit:
      namespace: ${TI_PUBLIC_BANK_READ_RATE_LIMIT_NAMESPACE:ti-java:catalog:public-bank-read-rate}
      requests-per-second: ${TI_PUBLIC_BANK_READ_REQUESTS_PER_SECOND:10}
      requests-per-hour: ${TI_PUBLIC_BANK_READ_REQUESTS_PER_HOUR:500}
      requests-per-day: ${TI_PUBLIC_BANK_READ_REQUESTS_PER_DAY:5000}
      multiplier: ${TI_PUBLIC_BANK_RATE_LIMIT_MULTIPLIER:${TI_RATE_LIMIT_MULTIPLIER:100}}
    personal-bank-user-counts-read-rate-limit:
      namespace: ${TI_PERSONAL_BANK_USER_COUNTS_READ_RATE_LIMIT_NAMESPACE:ti-java:learning:personal-bank-user-counts-read-rate}
      requests-per-second: ${TI_PERSONAL_BANK_USER_COUNTS_READ_REQUESTS_PER_SECOND:10}
      requests-per-hour: ${TI_PERSONAL_BANK_USER_COUNTS_READ_REQUESTS_PER_HOUR:500}
      requests-per-day: ${TI_PERSONAL_BANK_USER_COUNTS_READ_REQUESTS_PER_DAY:5000}
      multiplier: ${TI_PERSONAL_BANK_USER_COUNTS_READ_RATE_LIMIT_MULTIPLIER:${TI_RATE_LIMIT_MULTIPLIER:100}}
      key-secret: ${ti.personal-bank-user-counts-read-rate-limit.key-secret:${TI_PERSONAL_BANK_USER_COUNTS_READ_RATE_LIMIT_KEY_SECRET}}
    session:
      cookie-name: __Host-ti_session
      csrf-cookie-name: __Host-ti_csrf
      secure-cookie: true
