name: ${TI_JAVA_COMPOSE_PROJECT:-ti-java-phase2}

x-phase2-hardening: &phase2-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: ${TI_JAVA_LOG_MAX_SIZE:-10m}
      max-file: ${TI_JAVA_LOG_MAX_FILES:-3}

services:
  postgres:
    <<: *phase2-hardening
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: ${TI_JAVA_COMPOSE_PROJECT:-ti-java-phase2}-postgres
    hostname: postgres
    user: "70:70"
    environment:
      POSTGRES_DB: ${TI_JAVA_DB_NAME:-ti_java_phase2}
      POSTGRES_USER: ${TI_JAVA_DB_OWNER_USER:-ti_java_fixture_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres.owner.password
      TI_JAVA_DB_APP_USER: ${TI_JAVA_DB_APP_USER:-ti_java_read}
      TI_JAVA_DB_APP_PASSWORD_FILE: /run/secrets/ti.db.password
    secrets:
      - source: postgres_owner_password
        target: postgres.owner.password
      - source: ti_db_password
        target: ti.db.password
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
      - type: bind
        source: ./server/src/test/resources/db/phase2/minimal-reference-schema.sql
        target: /docker-entrypoint-initdb.d/010-minimal-reference-schema.sql
        read_only: true
      - type: bind
        source: ./infra/phase2/postgres/020-create-readonly-role.sh
        target: /docker-entrypoint-initdb.d/020-create-readonly-role.sh
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=70,gid=70,mode=1770
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=0770
    ports:
      - "127.0.0.1:${TI_JAVA_POSTGRES_PORT:-25432}:5432"
    networks:
      - backend
      - host_access
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --quiet --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: ${TI_JAVA_POSTGRES_MEMORY:-768m}
    pids_limit: 256

  redis:
    <<: *phase2-hardening
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    container_name: ${TI_JAVA_COMPOSE_PROJECT:-ti-java-phase2}-redis
    hostname: redis
    user: "999:1000"
    command:
      - sh
      - -ec
      - >-
        redis_password="$$(tr -d '\r\n' < /run/secrets/ti.redis.password)";
        test -n "$${redis_password}";
        escaped_password="$$(printf '%s' "$${redis_password}" | sed 's/\\/\\\\/g; s/"/\\"/g')";
        umask 077;
        printf 'requirepass "%s"\nappendonly yes\nappendfsync everysec\nmaxmemory 128mb\nmaxmemory-policy noeviction\n'
        "$${escaped_password}" > /tmp/redis.conf;
        unset redis_password escaped_password;
        exec redis-server /tmp/redis.conf
    secrets:
      - source: ti_redis_password
        target: ti.redis.password
    volumes:
      - type: volume
        source: redis_data
        target: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=999,gid=1000,mode=1770
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/ti.redis.password)" redis-cli --no-auth-warning ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: ${TI_JAVA_REDIS_MEMORY:-256m}
    pids_limit: 128

  api:
    <<: *phase2-hardening
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ti-java-server:phase2-local
    container_name: ${TI_JAVA_COMPOSE_PROJECT:-ti-java-phase2}-api
    hostname: api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TI_SERVER_PORT: "8080"
      TI_DB_URL: jdbc:postgresql://postgres:5432/${TI_JAVA_DB_NAME:-ti_java_phase2}
      TI_DB_USERNAME: ${TI_JAVA_DB_APP_USER:-ti_java_read}
      TI_REDIS_HOST: redis
      TI_REDIS_PORT: "6379"
      TI_SUBJECT_READ_RATE_LIMIT_NAMESPACE: ${TI_SUBJECT_READ_RATE_LIMIT_NAMESPACE:-ti-java:catalog:subject-read-rate}
      TI_SUBJECT_READ_REQUESTS_PER_MINUTE: ${TI_SUBJECT_READ_REQUESTS_PER_MINUTE:-60}
      TI_SUBJECT_READ_REQUESTS_PER_HOUR: ${TI_SUBJECT_READ_REQUESTS_PER_HOUR:-600}
      TI_RATE_LIMIT_MULTIPLIER: ${TI_RATE_LIMIT_MULTIPLIER:-1}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Djava.io.tmpdir=/tmp
      TI_MANAGEMENT_ADDRESS: 0.0.0.0
      TI_MANAGEMENT_PORT: "9090"
    secrets:
      - source: ti_db_password
        target: ti.db.password
      - source: ti_redis_password
        target: ti.redis.password
      - source: ti_login_rate_limit_key_secret
        target: ti.login-rate-limit.key-secret
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=1770
    ports:
      - "127.0.0.1:${TI_JAVA_API_PORT:-18080}:8080"
    expose:
      - "9090"
    networks:
      - backend
      - host_access
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: ${TI_JAVA_API_MEMORY:-768m}
    pids_limit: 256

networks:
  backend:
    name: ${TI_JAVA_COMPOSE_PROJECT:-ti-java-phase2}-backend
    internal: true
  host_access:
    name: ${TI_JAVA_COMPOSE_PROJECT:-ti-java-phase2}-host-access

volumes:
  postgres_data:
    name: ${TI_JAVA_COMPOSE_PROJECT:-ti-java-phase2}-postgres-data
  redis_data:
    name: ${TI_JAVA_COMPOSE_PROJECT:-ti-java-phase2}-redis-data

secrets:
  postgres_owner_password:
    file: ${TI_JAVA_DB_OWNER_PASSWORD_FILE:-./infra/phase2/secrets/postgres-owner-password.example}
  ti_db_password:
    file: ${TI_JAVA_DB_PASSWORD_FILE:-./infra/phase2/secrets/ti-db-password.example}
  ti_redis_password:
    file: ${TI_JAVA_REDIS_PASSWORD_FILE:-./infra/phase2/secrets/ti-redis-password.example}
  ti_login_rate_limit_key_secret:
    file: ${TI_JAVA_LOGIN_RATE_LIMIT_KEY_SECRET_FILE:-./infra/phase2/secrets/ti-login-rate-limit-key-secret.example}
