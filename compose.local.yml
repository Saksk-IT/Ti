# docker compose --env-file local-demo.env.example -f compose.dev.yml -f compose.local.yml up -d
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    volumes:
      - ./scripts:/app/scripts:ro
      - local-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ping?deep=1', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  worker:
    restart: unless-stopped
    volumes:
      - local-data:/data
  backup:
    restart: unless-stopped
    volumes:
      - local-data:/data:ro
  postgres:
    restart: unless-stopped
    volumes:
      - local-postgres:/var/lib/postgresql/data
  redis:
    restart: unless-stopped
    volumes:
      - local-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  local-data:
  local-postgres:
  local-redis:
