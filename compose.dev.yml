# 本地开发配置（独立完整版）
# 使用方式: docker compose --env-file .env -f compose.dev.yml up

services:
  web:
    image: ${TI_IMAGE:-ghcr.io/saksk-it/ti:latest}
    pull_policy: ${TI_IMAGE_PULL_POLICY:-always}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:8000"
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_PHONE: ${DEFAULT_ADMIN_PHONE:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_RESET_PASSWORD: ${DEFAULT_ADMIN_RESET_PASSWORD:-0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyuser}:${POSTGRES_PASSWORD:-studypass}@postgres:5432/${POSTGRES_DB:-ti_db}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-saksk}
      PROXY_FIX_ENABLED: "false"
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_MINICODE_ENV_VERSION: ${WECHAT_MINICODE_ENV_VERSION:-}
      WECHAT_MINICODE_CHECK_PATH: ${WECHAT_MINICODE_CHECK_PATH:-auto}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_TYPE: ${AI_API_TYPE:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MODEL_SOURCE: ${AI_MODEL_SOURCE:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-25}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_TIMEOUT: ${DASHSCOPE_TIMEOUT:-25}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      MAIL_DEFAULT_SENDER_NAME: ${MAIL_DEFAULT_SENDER_NAME:-系统通知}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_CONSOLE_OUTPUT: ${MAIL_CONSOLE_OUTPUT:-true}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_TEMPLATE_CODE_BIND: ${ALIYUN_SMS_TEMPLATE_CODE_BIND:-}
      ALIYUN_SMS_TEMPLATE_CODE_RESET: ${ALIYUN_SMS_TEMPLATE_CODE_RESET:-}
      ALIYUN_SMS_CODE_LENGTH: ${ALIYUN_SMS_CODE_LENGTH:-6}
      ALIYUN_SMS_VALID_TIME: ${ALIYUN_SMS_VALID_TIME:-300}
      ALIYUN_SMS_INTERVAL: ${ALIYUN_SMS_INTERVAL:-60}
      SMS_ENABLED: ${SMS_ENABLED:-true}
      SMS_CONSOLE_OUTPUT: ${SMS_CONSOLE_OUTPUT:-false}
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates
      - ./migrations:/app/migrations
      - ./run.py:/app/run.py
      - ./var:/data
    command: ["flask", "run", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: ${TI_IMAGE:-ghcr.io/saksk-it/ti:latest}
    pull_policy: ${TI_IMAGE_PULL_POLICY:-always}
    command: sh -c "rq worker -u $$REDIS_URL $$RQ_QUEUE_NAME"
    environment:
      FLASK_ENV: development
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_PHONE: ${DEFAULT_ADMIN_PHONE:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyuser}:${POSTGRES_PASSWORD:-studypass}@postgres:5432/${POSTGRES_DB:-ti_db}
      REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-saksk}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_MINICODE_ENV_VERSION: ${WECHAT_MINICODE_ENV_VERSION:-}
      WECHAT_MINICODE_CHECK_PATH: ${WECHAT_MINICODE_CHECK_PATH:-auto}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_TYPE: ${AI_API_TYPE:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MODEL_SOURCE: ${AI_MODEL_SOURCE:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-25}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-plus}
      DASHSCOPE_TIMEOUT: ${DASHSCOPE_TIMEOUT:-25}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      MAIL_DEFAULT_SENDER_NAME: ${MAIL_DEFAULT_SENDER_NAME:-系统通知}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_CONSOLE_OUTPUT: ${MAIL_CONSOLE_OUTPUT:-true}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_TEMPLATE_CODE_BIND: ${ALIYUN_SMS_TEMPLATE_CODE_BIND:-}
      ALIYUN_SMS_TEMPLATE_CODE_RESET: ${ALIYUN_SMS_TEMPLATE_CODE_RESET:-}
      ALIYUN_SMS_CODE_LENGTH: ${ALIYUN_SMS_CODE_LENGTH:-6}
      ALIYUN_SMS_VALID_TIME: ${ALIYUN_SMS_VALID_TIME:-300}
      ALIYUN_SMS_INTERVAL: ${ALIYUN_SMS_INTERVAL:-60}
      SMS_ENABLED: ${SMS_ENABLED:-true}
      SMS_CONSOLE_OUTPUT: ${SMS_CONSOLE_OUTPUT:-false}
    volumes:
      - ./app:/app/app
      - ./var:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      - web
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studypass}
      POSTGRES_DB: ${POSTGRES_DB:-ti_db}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=50"]
    ports:
      - "${POSTGRES_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyuser} -d ${POSTGRES_DB:-ti_db}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./var/redis:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  backup:
    image: postgres:16-alpine
    environment:
      TZ: ${BACKUP_TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-studyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studypass}
      POSTGRES_DB: ${POSTGRES_DB:-ti_db}
      BACKUP_TZ: ${BACKUP_TZ:-Asia/Shanghai}
      BACKUP_ANCHOR_TIME: ${BACKUP_ANCHOR_TIME:-04:00}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-43200}
      BACKUP_CHECK_INTERVAL: ${BACKUP_CHECK_INTERVAL:-60}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./var:/data:ro
      - ./scripts/backup-cron.sh:/backup-cron.sh
    command: sh -c "/backup-cron.sh"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
